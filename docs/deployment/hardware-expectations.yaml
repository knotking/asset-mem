# Machine-readable hardware allocations by environment and traffic tier.
# Used by .github/scripts/hardware_tier.py (audit, apply, deploy resolve).
#
# Tiers: idle | ph | scale_10x | scale_100x

tier_meta:
  idle:
    description: Default prod; scale-to-zero; minimal cost
    traffic:
      peak_concurrent_web: 10
      peak_concurrent_chats: 5
      checkpoint_analyses_per_hour: 10
      doc_uploads_per_hour: 5
  ph:
    description: Product Hunt / marketing spike
    traffic:
      peak_concurrent_web: 2000
      peak_concurrent_chats: 200
      checkpoint_analyses_per_hour: 500
      doc_uploads_per_hour: 150
  scale_10x:
    description: Sustained growth ~10x PH peak
    traffic:
      peak_concurrent_web: 20000
      peak_concurrent_chats: 2000
      checkpoint_analyses_per_hour: 5000
      doc_uploads_per_hour: 1500
  scale_100x:
    description: Major scale; requires GCP quota review
    traffic:
      peak_concurrent_web: 200000
      peak_concurrent_chats: 20000
      checkpoint_analyses_per_hour: 50000
      doc_uploads_per_hour: 15000

staging:
