                            - cost
                          type: STRING
                        nullable: true
                        type: ARRAY
                    required:
                      - user_query
                    type: OBJECT
                  response:
                    type: STRING
                - description: Load persisted report snapshots (contentSnapshot / chatMarkdown) for Q&A.
                  name: report_retrieval
                  parameters:
                    properties:
                      user_query:
                        type: STRING
                    required:
                      - user_query
                    type: OBJECT
                  response:
                    type: STRING
                - description: "List recent checkpoints for this property (inventory / status queries).\n\n    Returns a markdown summary of the most recent checkpoints with analysis status.\n    Use when the user asks what checkpoints exist or wants a property-wide status\n    overview — not when analyzing specific selected checkpoints.\n    "
                  name: list_checkpoints
                  parameters:
                    properties:
                      property_id:
                        type: STRING
                      user_query:
                        default: ''
                        type: STRING
                      location:
                        nullable: true
                        type: STRING
                    required:
                      - property_id
                    type: OBJECT
                  response:
                    type: STRING
                - description: "Retrieve and analyze checkpoints for this property.\n\n    ``branches`` selects optional analysis sections:\n    - ``[]`` (default) — retrieval + issue summary only (no coverage/diy/service/cost).\n    - ``[\"cost\"]``, ``[\"diy\", \"cost\"]``, etc. — run those branch analyses after retrieval.\n\n    Pass ``checkpoint_ids`` only when the client attached real Firestore ids in session\n    context; omit them for semantic search across the property.\n    "
                  name: analyze_checkpoints
                  parameters:
                    properties:
                      user_query:
                        type: STRING
                      property_id:
                        type: STRING
