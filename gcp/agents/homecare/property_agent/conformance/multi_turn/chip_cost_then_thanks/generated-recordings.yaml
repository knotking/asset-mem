                        items:
                          type: STRING
                        nullable: true
                        type: ARRAY
                      context_doc_uris:
                        items:
                          type: STRING
                        nullable: true
                        type: ARRAY
                      property_address:
                        nullable: true
                        type: STRING
                      search_location:
                        nullable: true
                        type: OBJECT
                    required:
                      - user_query
                      - property_id
                    type: OBJECT
                  response:
                    type: STRING
          labels:
            adk_agent_name: property_agent
        live_connect_config:
          input_audio_transcription: {}
