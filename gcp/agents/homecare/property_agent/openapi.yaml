  # ============================================================================
  # Sub-Agent Summary
  # ============================================================================
  # The Property Agent orchestrates the following sub-agents:
  #
  # 1. Triage Agent (DiagnosisInput -> TriageAgentOutput)
  #    - Input: DiagnosisInput (user_query, diagnosis_uris, context_doc_uris, property_address)
  #    - Output: TriageAgentOutput (triageResult with diagnosis)
  #    - Purpose: Analyzes multimodal data or performs text-only triage
  #
  # 2. Coverage Agent (DocsInput -> CoverageAgentOutput)
  #    - Input: DocsInput (user_query, context_doc_uris, property_address)
  #    - Output: CoverageAgentOutput (coverageResult with warrantyInfo, insuranceInfo)
  #    - Purpose: Retrieves warranty and insurance information from user documents
  #
  # 3. DIY Agent (DocsInput -> DIYAgentOutput)
  #    - Input: DocsInput (user_query, context_doc_uris, property_address)
  #    - Output: DIYAgentOutput (diyResults with diySteps, youtubeSearch, recommendedProducts)
  #    - Purpose: Provides DIY repair steps, YouTube tutorials, and product recommendations
  #
  # 4. Service Agent (DocsInput -> ServiceAgentOutput)
  #    - Input: DocsInput (user_query, context_doc_uris, property_address)
  #    - Output: ServiceAgentOutput (serviceResults with costEstimates, localPros)
  #    - Purpose: Finds local service providers and provides cost estimates
  #
  # 5. Shopping Agent (DocsInput -> ShoppingAgentOutput)
  #    - Input: DocsInput (user_query, context_doc_uris, property_address)
  #    - Output: ShoppingAgentOutput (recommendedProducts with category-based structure)
  #    - Purpose: Provides product recommendations (reusable across contexts)
  #
  # 6. Cost Agent (CostAgentInput -> CostAgentOutput)
  #    - Input: CostAgentInput (query string describing the repair)
  #    - Output: CostAgentOutput (costEstimates with DIY vs Service comparison and recommendation)
  #    - Purpose: Provides structured DIY vs Service cost estimates
  #
  # 7. User Docs Agent (DocsInput -> UserDocsAgentOutput)
  #    - Input: DocsInput (user_query, context_doc_uris, property_address)
  #    - Output: UserDocsAgentOutput (user_docs_result)
  #    - Purpose: Retrieves information from user-uploaded documents
  #
  # 8. Knowledge Base Agent (DocsInput -> KnowledgeBaseAgentOutput)
  #    - Input: DocsInput (user_query, context_doc_uris, property_address)
  #    - Output: KnowledgeBaseAgentOutput (knowledge_base_results)
  #    - Purpose: Retrieves information from general knowledge base RAG corpus
  #
  # All sub-agents are modular and can be used independently or orchestrated
  # through the Analysis Agent.


