openapi: 3.1.0
info:
  title: Property Agent API
  version: 2.0.0
  description: |
    OpenAPI schema for the Property Agent (Orchestrator V2).
    
    **Two-hop orchestration:** `resolve_turn_llm` classifies each turn; the executor LLM
    calls a flat tool registry (or returns markdown from session history).
    
    **Root executor tools (3):**
    - `run_checkpoint_pipeline` — retrieval + optional coverage/DIY/service/cost + assembler + synthesis
    - `user_docs_retrieval` — user document RAG (`context_doc_uris`)
    - `knowledge_base_retrieval` — shared corpus RAG
    
    **Inside `run_checkpoint_pipeline` (not root-routable):**
    - Checkpoint retrieval (Firestore vector search)
    - Optional branches: coverage, DIY, service, cost
    - Deterministic `contentJson` assembly; synthesis LLM for `contentMarkdown` only
    
    Casual turns (greeting, thanks) short-circuit with canned markdown before the executor runs.

paths: {}

components:
  schemas:
    # ============================================================================
    # Input Schemas
    # ============================================================================
    
    DiagnosisInput:
      type: object
      required:
        - user_query
      properties:
        user_query:
          type: string
          description: The user query or question. This is the only required field.
        context_doc_uris:
          type: array
          items:
            type: string
            format: uri
          description: Optional list of context document URIs (GCS paths). May be omitted, null, or empty.
          nullable: true
        checkpoint_ids:
          type: array
          items:
            type: string
          description: Optional checkpoint IDs for explicit checkpoint context.
          nullable: true
        property_address:
          type: string
          description: Optional property address (identity/context; not market geo when search_location is set).
          nullable: true
        property_id:
          type: string
          description: Property ID for checkpoint and property-scoped queries.
          nullable: true
        primary_agent:
          type: string
          enum: [checkpoint, docs]
          description: Context for resolve_turn (checkpoint or docs path).
          nullable: true
        checkpoint_optional_agents:
          type: array
          items:
            type: string
            enum: [coverage, diy, service, cost]
          description: Optional checkpoint analysis branches after retrieval.
          nullable: true
      description: |
        Input schema for the root property agent (orchestrator).
        
        **Key Points:**
        - Only `user_query` is required.
        - All optional fields may be omitted entirely; the executor invokes tools for retrieval and checkpoint flows.

    DocsInput:
      type: object
      required:
        - user_query
      properties:
        user_query:
          type: string
          description: The user query for the executor and branch agents.
        context_doc_uris:
          type: array
          items:
            type: string
            format: uri
          description: Optional context document URIs (user uploads, chat attachments).
          nullable: true
        property_address:
          type: string
          description: Property address (identity/context).
          nullable: true
        property_id:
          type: string
          nullable: true
        checkpoint_ids:
          type: array
          items:
            type: string
          nullable: true
        checkpoint_optional_agents:
          type: array
          items:
            type: string
            enum: [coverage, diy, service, cost]
          nullable: true
        search_location:
          type: object
          description: Unified market/geo (source, coordinates, radius_miles 5-100, label).
          nullable: true
      description: Input schema for the executor and checkpoint optional-analysis branches.

    # ============================================================================
    # Branch output schemas (checkpoint optional analysis + retrieval)
    # ============================================================================

    CoverageAgentOutput:
      type: object
      required:
        - coverageResult
      properties:
        coverageResult:
          type: object
          properties:
            warrantyInfo:
              type: string
              description: Warranty information extracted from user documents.
              nullable: true
            insuranceInfo:
              type: string
              description: Insurance information extracted from user documents.
              nullable: true
      description: Coverage Agent output - warranty and insurance information.
      example:
        coverageResult:
          warrantyInfo: "Warranty covers parts for 5 years from purchase date."
          insuranceInfo: "Home insurance does not cover routine maintenance or wear and tear."

    DIYAgentOutput:
      type: object
      required:
        - diyResults
      properties:
        diyResults:
          type: object
          properties:
            diySteps:
              type: object
              properties:
                summary:
                  type: string
                  description: Summary of DIY repair steps from Google search.
                  nullable: true
                steps:
                  type: array
                  items:
                    type: object
                    required:
                      - stepNumber
                      - description
                    properties:
                      stepNumber:
                        type: integer
                        description: Step number (1-indexed).
                      description:
                        type: string
                        description: Description of the step.
            youtubeSearch:
              type: object
              properties:
                videos:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                        description: Video title.
                      url:
                        type: string
                        format: uri
                        description: YouTube video URL.
                      description:
                        type: string
                        description: Video description if available.
                        nullable: true
            recommendedProducts:
              type: object
              properties:
                products:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                DIY:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        $ref: '#/components/schemas/Product'
                    description:
                      type: string
                Professional:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        $ref: '#/components/schemas/Product'
                    description:
                      type: string
      description: DIY Agent output - DIY repair steps, YouTube tutorials, and product recommendations.
      example:
        diyResults:
          diySteps:
            summary: "Replace the faucet cartridge to stop the leak"
            steps:
              - stepNumber: 1
                description: "Turn off water supply valves under the sink"
              - stepNumber: 2
                description: "Remove the faucet handle and bonnet nut"
              - stepNumber: 3
                description: "Replace the cartridge and reassemble"
          youtubeSearch:
            videos:
              - title: "How to replace a kitchen faucet cartridge"
                url: "https://www.youtube.com/watch?v=abc123"
                description: "Step-by-step tutorial for faucet repair"
          recommendedProducts:
            products:
              - item_name: "Universal Faucet Cartridge"
                image_url: "https://example.com/image.jpg"
                vendor: "Home Depot"
                reviews: "120 reviews"
                store_url: "https://homedepot.com/product/123"

    ServiceAgentOutput:
      type: object
      required:
        - serviceResults
      properties:
        serviceResults:
          type: object
          properties:
            costEstimates:
              type: string
              description: Cost estimation text from cost_estimation tool.
              nullable: true
            localPros:
              type: object
              properties:
                serpAPIResults:
                  type: array
                  items:
                    $ref: '#/components/schemas/ServiceProvider'
                  description: Service providers from SerpAPI search.
                googleSearchResults:
                  type: array
                  items:
                    $ref: '#/components/schemas/ServiceProvider'
                  description: Service providers from Google Search results.
                googleSearchResults:
                  type: array
                  items:
                    $ref: '#/components/schemas/ServiceProvider'
                  description: Service providers from Google search fallback.
      description: Service Agent output - local professional service providers and cost estimates.
      example:
        serviceResults:
          costEstimates: "Professional service: $200-500"
          localPros:
            serpAPIResults:
              - name: "Springfield Plumbing Co"
                rating: "4.6"
                phone: "+1-555-123-4567"
                location: "123 Main St, Springfield"
            googleSearchResults:
              - name: "Main St Plumbers"
                rating: "4.3"
                phone: "+1-555-987-6543"
                reviews: "150 reviews"

    ShoppingAgentOutput:
      type: object
      required:
        - recommendedProducts
      properties:
        recommendedProducts:
          type: object
          additionalProperties: true
          properties:
            DIY:
              type: object
              properties:
                products:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                description:
                  type: string
            Professional:
              type: object
              properties:
                products:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                description:
                  type: string
      description: Shopping Agent output - product recommendations with category-based structure.
      example:
        recommendedProducts:
          DIY:
            products:
              - item_name: "Touch-Up Paint Kit"
                image_url: "https://images.example.com/paint.jpg"
                vendor: "AutoZone"
                reviews: "120 reviews"
                store_url: "https://autozone.com/paint"
            description: "Essential products you'll need for diy repair"

    CostAgentInput:
      type: object
      properties:
        query:
          type: string
          description: Query string describing the repair or service needed.
      description: Input schema for Cost Agent - accepts a query string.
      example:
        query: "car scratch repair"

    CostAgentOutput:
      type: object
      required:
        - costEstimates
      properties:
        costEstimates:
          type: object
          properties:
            repair_type:
              type: string
              description: Type of repair derived from query.
            DIY:
              type: object
              properties:
                cost_range:
                  type: string
                  description: Cost range for DIY repair (e.g., "$50-300").
                includes:
                  type: array
                  items:
                    type: string
                  description: What is included in DIY cost.
                savings:
                  type: string
                  description: Potential savings with DIY.
                complexity:
                  type: string
                  description: Complexity assessment.
            Service:
              type: object
              properties:
                cost_range:
                  type: string
                  description: Cost range for professional service (e.g., "$200-800").
                includes:
                  type: array
                  items:
                    type: string
                  description: What is included in professional service.
                benefits:
                  type: string
                  description: Benefits of professional service.
                complexity:
                  type: string
                  description: Complexity assessment.
            comparison:
              type: object
              properties:
                diy_savings:
                  type: string
                  description: Savings comparison text.
                professional_benefits:
                  type: string
                  description: Professional benefits text.
                considerations:
                  type: string
                  description: General considerations.
            recommendation:
              type: object
              properties:
                simple_repairs:
                  type: string
                  description: Recommendation for simple repairs.
                complex_repairs:
                  type: string
                  description: Recommendation for complex repairs.
                note:
                  type: string
                  description: Additional notes about cost estimates.
              nullable: true
      description: Cost Agent output - structured DIY vs Service cost estimates.
      example:
        costEstimates:
          repair_type: "Paint Touch-Up And Scratch Repair"
          DIY:
            cost_range: "$20-50"
            includes: ["Material/product costs", "Basic tools (if needed)", "Time investment required"]
            savings: "60-80% on labor costs"
            complexity: "Simple repairs may be cost-effective"
          Service:
            cost_range: "$200-500"
            includes: ["Labor costs", "Professional expertise", "Warranty/guarantee included"]
            benefits: "Expertise and warranty"
            complexity: "Complex or safety-critical repairs recommended"
          comparison:
            diy_savings: "60-80% on labor costs"
            professional_benefits: "Expertise and warranty"
            considerations: "Complexity and skill level"
          recommendation:
            simple_repairs: "DIY may be cost-effective"
            complex_repairs: "Professional service recommended"
            note: "Estimates may vary by location and specific circumstances"

    UserDocsAgentOutput:
      type: object
      properties:
        user_docs_result:
          type: string
          description: Retrieved information from user-uploaded documents.
      description: User Docs Agent output - retrieval results from user documents.
      example:
        user_docs_result: "Warranty covers parts for 5 years from purchase date. See section 3.2 of warranty document."

    KnowledgeBaseAgentOutput:
      type: object
      properties:
        knowledge_base_results:
          type: string
          description: Retrieved information from knowledge base RAG corpus.
      description: Knowledge Base Agent output - retrieval results from general knowledge base.
      example:
        knowledge_base_results: "The E3 error code indicates an unbalanced load. See manual section 4.2 for troubleshooting steps."

    Product:
      type: object
      properties:
        item_name:
          type: string
          description: Product/item name.
          nullable: true
        image_url:
          type: string
          format: uri
          description: Product image URL.
          nullable: true
        vendor:
          type: string
          description: Vendor/manufacturer/store name.
          nullable: true
        reviews:
          type: string
          description: Number of reviews or review text.
          nullable: true
        store_url:
          type: string
          format: uri
          description: URL to product/store page.
          nullable: true
        product_name:
          type: string
          description: Legacy field - product name (use item_name instead).
          nullable: true
        url:
          type: string
          format: uri
          description: Legacy field - product URL (use store_url instead).
          nullable: true
        item_price:
          type: string
          description: Legacy field - product price.
          nullable: true
        price:
          type: string
          description: Legacy field - product price.
          nullable: true
        rating:
          type: string
          description: Legacy field - product rating.
          nullable: true
        description:
          type: string
          description: Legacy field - product description.
          nullable: true
      description: Product schema matching shopping_agent output format.
      example:
        item_name: "Touch-Up Paint Kit"
        image_url: "https://images.example.com/paint.jpg"
        vendor: "AutoZone"
        reviews: "120 reviews"
        store_url: "https://autozone.com/touch-up-paint"

    ServiceProvider:
      type: object
      properties:
        name:
          type: string
          description: Service provider business name.
        contact_info:
          type: string
          description: Phone number or contact information.
          nullable: true
        location:
          type: string
          description: Address or location.
          nullable: true
        ratings:
          type: string
          description: Rating (e.g., "4.5" or "4.5/5").
          nullable: true
        reviews:
          type: string
          description: Number of reviews or review text.
          nullable: true
        website:
          type: string
          format: uri
          description: Business website URL.
          nullable: true
        link:
          type: string
          format: uri
          description: Business listing URL.
          nullable: true
        directions:
          type: string
          format: uri
          description: Google Maps directions URL.
          nullable: true
        specialties:
          type: string
          description: Service specialties or services offered.
          nullable: true
        additional_information:
          type: string
          description: Additional provider information.
          nullable: true
        authorized:
          type: string
          description: Whether provider is authorized (e.g., "True", "False").
          nullable: true
      description: Service provider schema for local professional listings.
      example:
        name: "Springfield Plumbing Co"
        contact_info: "+1-555-123-4567"
        location: "123 Main St, Springfield, IL 62701"
        ratings: "4.6"
        reviews: "150 reviews"
        website: "https://springfieldplumbing.example.com"
        specialties: "Residential and commercial plumbing, emergency repairs"

    # ============================================================================
    # Main Agent Response Schemas
    # ============================================================================

    PropertyAgentResponse:
      oneOf:
        - $ref: '#/components/schemas/StructuredResponse'
        - $ref: '#/components/schemas/StructuredResponseWithMarkdown'
        - $ref: '#/components/schemas/RetrievalResponse'
        - type: string
          description: Plain text response for casual or small-talk queries.
      description: |
        The root agent returns a retrieval payload, structured checkpoint analysis
        (`contentJson` + `contentMarkdown` via state_delta), or plain text for casual queries.

        **Checkpoint optional-analysis format (V2):**
        - `contentMarkdown`: human-readable prose for chat display
        - `contentJson`: structured `analysis` object with branch results (`coverageResult`,
          `diyResults`, `serviceResults`, `costEstimationResults`, checkpoint summary fields)
        - Persisted on Firestore chat messages by the proxy; clients use `resolveMessageContentParts`
      examples:
        - $ref: '#/components/examples/ExampleStructuredResponse'
        - $ref: '#/components/examples/ExampleStructuredResponseWithMarkdown'
        - $ref: '#/components/examples/ExampleRetrievalResponse'
        - 'Hello! How can I help you with your home care needs today?'

    StructuredResponse:
      type: object
      additionalProperties: false
      properties:
        analysis:
          type: object
          additionalProperties: false
          properties:
            title:
              type: string
              description: Concise headline summarizing the analysis outcome or clarification request.
            triageResult:
              oneOf:
                - type: object
                  additionalProperties: false
                  properties:
                    diagnosis:
                      type: string
                    needs_clarification:
                      type: boolean
                      default: false
                - type: object
                  additionalProperties: false
                  required:
                    - needs_clarification
                    - clarification_questions
                  properties:
                    needs_clarification:
                      type: boolean
                      const: true
                    clarification_questions:
                      type: array
                      items:
                        type: string
                      minItems: 1
                      maxItems: 3
                    message:
                      type: string
                      nullable: true
            coverageResult:
              type: object
              additionalProperties: false
              properties:
                warrantyInfo:
                  type: string
                insuranceInfo:
                  type: string
            diyResults:
              type: object
              additionalProperties: false
              properties:
                diySteps:
                  type: object
                  additionalProperties: false
                  properties:
                    summary:
                      type: string
                    steps:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          stepNumber:
                            type: integer
                          description:
                            type: string
                youtubeSearch:
                  type: object
                  additionalProperties: false
                  properties:
                    videos:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          title:
                            type: string
                          url:
                            type: string
                            format: uri
                          description:
                            type: string
                recommendedProducts:
                  type: object
                  additionalProperties: false
                  properties:
                    products:
                      type: array
                      items:
                        $ref: '#/components/schemas/Product'
                    DIY:
                      type: object
                      properties:
                        products:
                          type: array
                          items:
                            $ref: '#/components/schemas/Product'
                        description:
                          type: string
                    Professional:
                      type: object
                      properties:
                        products:
                          type: array
                          items:
                            $ref: '#/components/schemas/Product'
                        description:
                          type: string
            serviceResults:
              type: object
              additionalProperties: false
              properties:
                localPros:
                  type: object
                  additionalProperties: false
                  properties:
                    serpAPIResults:
                      type: array
                      items:
                        $ref: '#/components/schemas/ServiceProvider'
                    googleSearchResults:
                      type: array
                      items:
                        $ref: '#/components/schemas/ServiceProvider'
                    googleSearchResults:
                      type: array
                      items:
                        $ref: '#/components/schemas/ServiceProvider'
            costEstimationResults:
              type: object
              additionalProperties: false
              properties:
                costEstimates:
                  type: object
                  additionalProperties: false
                  properties:
                    repair_type:
                      type: string
                    DIY:
                      type: object
                      properties:
                        cost_range:
                          type: string
                        includes:
                          type: array
                          items:
                            type: string
                        savings:
                          type: string
                        complexity:
                          type: string
                    Service:
                      type: object
                      properties:
                        cost_range:
                          type: string
                        includes:
                          type: array
                          items:
                            type: string
                        benefits:
                          type: string
                        complexity:
                          type: string
                    comparison:
                      type: object
                      properties:
                        diy_savings:
                          type: string
                        professional_benefits:
                          type: string
                        considerations:
                          type: string
        title:
          type: string
          description: Optional top-level title mirroring `analysis.title` for legacy clients.
      description: Aggregated response with nested analysis results.

    StructuredResponseWithMarkdown:
      type: string
      description: |
        Analysis Agent response format that includes both JSON and Markdown.
        
        The response MUST be formatted as:
        ```
        # {analysis.title}
        [Markdown formatted human-readable response]
        
        ```json
        { ... structured JSON data matching StructuredResponse schema including "analysis": { "title": "..." } ... }
        ```
        ```
        
        - The JSON code block contains the structured data for webapp consumption (parsed by chat-message.tsx)
        - The Markdown text above contains a human-readable formatted response for Telegram consumption
        
        Clients should:
        - Extract the JSON from the code block for structured parsing
        - Extract the Markdown text for display in Telegram or other markdown-aware clients

    ResearchResults:
      type: object
      additionalProperties: false
      properties:
        summaryOfFindings:
          type: string
          description: Overall summary of research across sources.
        yourDocuments:
          type: string
          description: Findings extracted from user-provided documents.
        googleSearch:
          type: string
          description: Notable findings from web search.
        youtubeSearch:
          type: string
          description: Notable tutorials or guidance found on YouTube.

    ServiceProviderResults:
      type: object
      additionalProperties: false
      properties:
        serpAPIResults:
          type: array
          items:
            type: object
            description: Provider record as returned by SerpAPI integration.
        googleSearchResults:
          type: array
          items:
            type: object
            description: Provider record as returned by service search integrations.

    ProductRecommendationsResults:
      type: object
      additionalProperties: false
      properties:
        recommendedProducts:
          type: array
          description: Curated list of relevant products with key attributes.
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
                format: uri
              price:
                type: number
              rating:
                type: number
              imageUrl:
                type: string
                format: uri

    

    RetrievalResponse:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [user_documents, knowledge_base]
          description: Origin of the retrieval results.
        result:
          type: string
          description: Raw retrieval output (may contain citations or formatting).
        noInformationFound:
          type: boolean
          description: True if the retrieval tools found no relevant information.

  examples:
    ExampleStructuredResponse:
      summary: Structured response with all sections
      value:
        analysis:
          triageResult:
            diagnosis: "Leaking kitchen faucet due to worn cartridge"
          coverageResult:
            warrantyInfo: "Warranty covers parts for 5 years."
            insuranceInfo: "Insurance does not cover routine maintenance."
          diyResults:
            diySteps:
              summary: "Replace the faucet cartridge to stop the leak."
              steps:
                - stepNumber: 1
                  description: "Turn off water supply."
                - stepNumber: 2
                  description: "Remove handle and bonnet nut."
                - stepNumber: 3
                  description: "Replace the cartridge and reassemble."
            youtubeSearch:
              videos:
                - title: "How to replace a kitchen faucet cartridge"
                  url: "https://example.com/video/abc"
                  description: "Step-by-step tutorial"
            recommendedProducts:
              products:
                - item_name: "Universal Faucet Cartridge"
                  image_url: "https://example.com/images/cartridge.jpg"
                  vendor: "Home Depot"
                  reviews: "120 reviews"
                  store_url: "https://homedepot.com/product/123"
          serviceResults:
            localPros:
              serpAPIResults:
                - name: "Springfield Plumbing Co"
                  rating: "4.6"
                  phone: "+1-555-123-4567"
              googleSearchResults:
                - name: "Main St Plumbers"
                  rating: "4.3"
                  phone: "+1-555-987-6543"
              googleSearchResults:
                - name: "QuickFix Plumbing"
                  link: "https://quickfix.example.com"
                  rating: "4.4"
          costEstimationResults:
            costEstimates:
              repair_type: "Pipe Leak Repair"
              DIY:
                cost_range: "$20-100"
                includes: ["Materials", "Tools", "Time"]
                savings: "~60-80% on labor"
                complexity: "Simple repairs may be cost-effective"
              Service:
                cost_range: "$200-500"
                includes: ["Labor", "Expertise", "Warranty"]
                benefits: "Expertise and warranty"
                complexity: "Complex or safety-critical repairs recommended"
              comparison:
                diy_savings: "~60-80% on labor"
                professional_benefits: "Expertise and warranty"
                considerations: "Repair complexity and safety factors"
              recommendation:
                simple_repairs: "DIY may be cost-effective"
                complex_repairs: "Professional service recommended"
                note: "Estimates may vary by location and specific circumstances"

    ExampleStructuredResponseWithMarkdown:
      summary: Analysis Agent response with both JSON and Markdown (required format)
      value: |
        ```json
        {
          "analysis": {
            "triageResult": {
              "diagnosis": "Leaking kitchen faucet due to worn cartridge"
            },
            "coverageResult": {
              "warrantyInfo": "Warranty covers parts for 5 years.",
              "insuranceInfo": "Insurance does not cover routine maintenance."
            },
            "diyResults": {
              "diySteps": {
                "summary": "Replace the faucet cartridge to stop the leak.",
                "steps": [
                  {"stepNumber": 1, "description": "Turn off water supply."},
                  {"stepNumber": 2, "description": "Remove handle and bonnet nut."},
                  {"stepNumber": 3, "description": "Replace the cartridge and reassemble."}
                ]
              },
              "youtubeSearch": {
                "videos": [
                  {
                    "title": "How to replace a kitchen faucet cartridge",
                    "url": "https://example.com/video/abc",
                    "description": "Step-by-step tutorial"
                  }
                ]
              },
              "recommendedProducts": {
                "products": [
                  {
                    "item_name": "Universal Faucet Cartridge",
                    "image_url": "https://example.com/images/cartridge.jpg",
