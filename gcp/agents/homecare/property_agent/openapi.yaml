openapi: 3.1.0
info:
  title: Property Agent API
  version: 1.0.0
  description: |
    OpenAPI schema for the Property Agent response. The Property Agent returns
    the sub-agent output verbatim. Depending on routing, the response can be a
    structured object (multimodal analysis and aggregated results) or a direct
    retrieval result. Casual, non-homecare queries may yield a simple string.

paths: {}

components:
  schemas:
    PropertyAgentResponse:
      oneOf:
        - $ref: '#/components/schemas/StructuredResponse'
        - $ref: '#/components/schemas/RetrievalResponse'
        - type: string
          description: Plain text response for casual or small-talk queries.
      description: |
        The root agent returns either a structured analysis/aggregation object,
        a retrieval payload, or a simple text response.
      examples:
        - $ref: '#/components/examples/ExampleStructuredResponse'
        - $ref: '#/components/examples/ExampleRetrievalResponse'
        - 'Hello! How can I help you with your home care needs today?'

    StructuredResponse:
      type: object
      additionalProperties: false
      properties:
        analysis:
          type: object
          additionalProperties: false
          properties:
            triageResult:
              type: object
              additionalProperties: false
              properties:
                diagnosis:
                  type: string
            coverageResult:
              type: object
              additionalProperties: false
              properties:
                warrantyInfo:
                  type: string
                insuranceInfo:
                  type: string
            diyResults:
              type: object
              additionalProperties: false
              properties:
                diySteps:
                  type: object
                  additionalProperties: false
                  properties:
                    summary:
                      type: string
                    steps:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          stepNumber:
                            type: integer
                          description:
                            type: string
                youtubeSearch:
                  type: object
                  additionalProperties: false
                  properties:
                    videos:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          title:
                            type: string
                          url:
                            type: string
                            format: uri
                          description:
                            type: string
                recommendedProducts:
                  type: object
                  additionalProperties: false
                  properties:
                    products:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          vendor:
                            type: string
                          url:
                            type: string
                            format: uri
                          description:
                            type: string
                          price:
                            type: string
            serviceResults:
              type: object
              additionalProperties: false
              properties:
                localPros:
                  type: object
                  additionalProperties: false
                  properties:
                    serpAPIResults:
                      type: array
                      items:
                        type: object
                    yelpAPIResults:
                      type: array
                      items:
                        type: object
            costEstimationResults:
              type: object
              additionalProperties: false
              properties:
                costEstimates:
                  type: object
                  additionalProperties: false
                  properties:
                    repair_type:
                      type: string
                    DIY:
                      type: object
                      properties:
                        cost_range:
                          type: string
                        includes:
                          type: array
                          items:
                            type: string
                        savings:
                          type: string
                        complexity:
                          type: string
                    Service:
                      type: object
                      properties:
                        cost_range:
                          type: string
                        includes:
                          type: array
                          items:
                            type: string
                        benefits:
                          type: string
                        complexity:
                          type: string
                    comparison:
                      type: object
                      properties:
                        diy_savings:
                          type: string
                        professional_benefits:
                          type: string
                        considerations:
                          type: string
      description: Aggregated response with nested analysis results.

    ResearchResults:
      type: object
      additionalProperties: false
      properties:
        summaryOfFindings:
          type: string
          description: Overall summary of research across sources.
        yourDocuments:
          type: string
          description: Findings extracted from user-provided documents.
        googleSearch:
          type: string
          description: Notable findings from web search.
        youtubeSearch:
          type: string
          description: Notable tutorials or guidance found on YouTube.

    ServiceProviderResults:
      type: object
      additionalProperties: false
      properties:
        serpAPIResults:
          type: array
          items:
            type: object
            description: Provider record as returned by SerpAPI integration.
        yelpAPIResults:
          type: array
          items:
            type: object
            description: Provider record as returned by Yelp integration.

    ProductRecommendationsResults:
      type: object
      additionalProperties: false
      properties:
        recommendedProducts:
          type: array
          description: Curated list of relevant products with key attributes.
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
                format: uri
              price:
                type: number
              rating:
                type: number
              imageUrl:
                type: string
                format: uri

    

    RetrievalResponse:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [user_documents, knowledge_base]
          description: Origin of the retrieval results.
        result:
          type: string
          description: Raw retrieval output (may contain citations or formatting).
        noInformationFound:
          type: boolean
          description: True if the retrieval tools found no relevant information.

  examples:
    ExampleStructuredResponse:
      summary: Structured response with all sections
      value:
        analysis:
          triageResult:
            diagnosis: "Leaking kitchen faucet due to worn cartridge"
          coverageResult:
            warrantyInfo: "Warranty covers parts for 5 years."
            insuranceInfo: "Insurance does not cover routine maintenance."
          diyResults:
            diySteps:
              summary: "Replace the faucet cartridge to stop the leak."
              steps:
                - stepNumber: 1
                  description: "Turn off water supply."
                - stepNumber: 2
                  description: "Remove handle and bonnet nut."
                - stepNumber: 3
                  description: "Replace the cartridge and reassemble."
            youtubeSearch:
              videos:
                - title: "How to replace a kitchen faucet cartridge"
                  url: "https://example.com/video/abc"
                  description: "Step-by-step tutorial"
            recommendedProducts:
              products:
                - vendor: "ExampleStore"
                  url: "https://example.com/product/123"
                  description: "Universal Faucet Cartridge"
                  price: "24.99"
          serviceResults:
            localPros:
              serpAPIResults:
                - name: "Springfield Plumbing Co"
                  rating: "4.6"
                  phone: "+1-555-123-4567"
              yelpAPIResults:
                - name: "Main St Plumbers"
                  rating: "4.3"
                  phone: "+1-555-987-6543"
          costEstimationResults:
            costEstimates:
              repair_type: "Pipe Leak Repair"
              DIY:
                cost_range: "$20-100"
                includes: ["Materials", "Tools", "Time"]
                savings: "~60-80% on labor"
                complexity: "Simple repairs may be cost-effective"
              Service:
                cost_range: "$200-500"
                includes: ["Labor", "Expertise", "Warranty"]
                benefits: "Expertise and warranty"
                complexity: "Complex or safety-critical repairs recommended"
              comparison:
                diy_savings: "~60-80% on labor"
                professional_benefits: "Expertise and warranty"
                considerations: "Repair complexity and safety factors"

    ExampleRetrievalResponse:
      summary: Retrieval result from user documents
      value:
        source: user_documents
        result: |
          The E3 error indicates an unbalanced load. See manual section 4.2.
          Citation: gs://my-bucket/manuals/washer.pdf#page=12
        noInformationFound: false


