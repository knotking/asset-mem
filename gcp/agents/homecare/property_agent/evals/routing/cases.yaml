# Routing eval set (Single-loop refactor Phase 0 baseline).
#
# Each case feeds `call_resolve_turn_llm` with a session-state dict and an
# optional recent dialogue, then asserts fields on the returned ResolvedTurn
# (after all sanitize/post-processing — i.e. what the executor actually sees).
#
# Expectation matching rules (see run_routing_eval.py):
# - Scalar fields (discourse_act, intent, route, user_goal, retrieval_only,
#   focus_branch, capability_key): exact match, or membership when a list of
#   acceptable values is given.
# - run_optional_agents: order-insensitive exact set match.
# - run_optional_agents_any_of: list of acceptable sets (any may match).
#
# Useful state keys:
# - primary_agent, checkpoint_ids, context_doc_uris, report_ids
# - checkpoint_optional_agents      (client UI toggles — must NOT be copied)
# - checkpoint_ids_analyzed         (last analyzed set; drives selection_changed)
# - checkpoint_last_response_kind: analysis  + checkpoint_analysis (prior analysis)
# - pending_user_action             (offer awaiting short affirmation)
# - last_offered_options            (capability menu for ordinal picks)
# - chat_intent                     (client chip hint)

defaults:
  state:
    property_id: "EVALPROP0001"
    property_address: "1982 Helena Way, Brentwood, CA 94513"
    primary_agent: "checkpoint"

# Reusable prior-analysis blobs (anchors).
anchors:
  prior_cost_diy: &prior_cost_diy
    checkpoint_last_response_kind: analysis
    checkpoint_ids: ["CKPT0000000000000001"]
    checkpoint_ids_analyzed: ["CKPT0000000000000001"]
    checkpoint_analysis:
      title: "Vehicle and Garage Surface Damage"
      checkpointSummary:
        checkpointsAnalyzed: 1
        issuesDetected:
          - "Significant paint transfer and deep surface scratches on the rear quarter panel"
        locations: ["Vehicle - Exterior"]
        overallCondition: "damaged, needs maintenance"
      analysisStatus: {cost: completed, diy: completed}
      costEstimationResults:
        costEstimates:
          repair_type: "Vehicle paint damage"
          DIY: {cost_range: "$50-300"}
          Service: {cost_range: "$200-800"}
      diyResults:
        diySteps:
          summary: "Clean, remove paint transfer, sand, touch-up paint, clear coat."
  prior_diy_only: &prior_diy_only
    checkpoint_last_response_kind: analysis
    checkpoint_ids: ["CKPT0000000000000001"]
    checkpoint_ids_analyzed: ["CKPT0000000000000001"]
    checkpoint_analysis:
      title: "Rear Quarter Panel and Bumper Paint Damage"
      checkpointSummary:
        checkpointsAnalyzed: 1
        issuesDetected:
          - "Significant paint transfer and deep surface scratches"
        locations: ["Vehicle - Exterior"]
        overallCondition: "damaged, needs maintenance"
      analysisStatus: {diy: completed}
      diyResults:
        diySteps:
          summary: "Clean, remove paint transfer, sand, touch-up paint, clear coat."
  prior_service: &prior_service
    checkpoint_last_response_kind: analysis
    checkpoint_ids: ["CKPT0000000000000001"]
    checkpoint_ids_analyzed: ["CKPT0000000000000001"]
    checkpoint_analysis:
      title: "Garage Door Paint Damage"
      checkpointSummary:
        checkpointsAnalyzed: 1
        issuesDetected: ["Paint chipping and scuffing near the handle"]
        locations: ["Garage"]
        overallCondition: "wear and tear"
      analysisStatus: {service: completed}
      serviceResults:
        providers:
          - {name: "Brentwood Pro Painters", rating: 4.8, phone: "925-555-0101"}
          - {name: "Delta Door & Trim", rating: 4.6, phone: "925-555-0102"}

cases:
  # ── Casual ────────────────────────────────────────────────────────────────
  - id: greeting_hi
    tags: [casual, greeting]
    query: "hi"
    expect:
      discourse_act: greeting
      intent: greeting
      route: none
      run_optional_agents: []

  - id: greeting_good_morning
    tags: [casual, greeting]
    query: "good morning!"
    expect:
      discourse_act: greeting
      intent: greeting
      route: none
      run_optional_agents: []

  - id: greeting_with_selection
    tags: [casual, greeting, selection]
    query: "hello"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
    expect:
      discourse_act: greeting
      intent: greeting
      route: none
      run_optional_agents: []

  - id: capabilities_what_can_you_do
    tags: [casual, capabilities]
    query: "what can you do?"
    expect:
      discourse_act: capabilities
      intent: capabilities
      route: none
      run_optional_agents: []

  - id: capabilities_suggest
    tags: [casual, capabilities]
    query: "what do you suggest I look at?"
    expect:
      discourse_act: [capabilities, new_work]
      route: [none, checkpoint]
      run_optional_agents: []

  - id: closure_thanks
    tags: [casual, closure]
    query: "thanks, that's really helpful"
    state: *prior_cost_diy
    dialogue:
      - role: user
        text: "run cost and diy analysis"
      - role: assistant
        text: "Here is the cost comparison: DIY $50-300 vs professional $200-800. Would you like anything else?"
    expect:
      discourse_act: closure
      intent: acknowledgment
      run_optional_agents: []

  - id: closure_got_it
    tags: [casual, closure]
    query: "got it"
    state: *prior_diy_only
    dialogue:
      - role: assistant
        text: "The DIY repair involves cleaning, sanding, and applying touch-up paint."
    expect:
      discourse_act: closure
      intent: acknowledgment
      run_optional_agents: []

  # ── Accept offer ──────────────────────────────────────────────────────────
  - id: accept_offer_yes_pending_cost
    tags: [accept_offer, pending]
    query: "yes"
    state:
      <<: *prior_diy_only
      pending_user_action:
        kind: run_branch
        expanded_user_query: "Run cost analysis for the vehicle paint damage"
        run_optional_agents: [cost]
        offered_summary: "Offered to run cost analysis."
    dialogue:
      - role: assistant
        text: "I can also estimate repair costs. Want me to run **cost** analysis?"
    expect:
      discourse_act: accept_offer
      intent: substantive
      route: checkpoint
      retrieval_only: false
      run_optional_agents: [cost]
      user_goal: new_analysis

  - id: accept_offer_sure_do_it
    tags: [accept_offer, pending]
    query: "sure, do it"
    state:
      <<: *prior_cost_diy
      pending_user_action:
        kind: run_branch
        expanded_user_query: "Find local service providers for this repair"
        run_optional_agents: [service]
        offered_summary: "Offered to find local providers."
    dialogue:
      - role: assistant
        text: "Would you like me to find local auto body shops near you?"
    expect:
      discourse_act: accept_offer
      route: checkpoint
      retrieval_only: false
      run_optional_agents: [service]
      user_goal: new_analysis

  - id: accept_offer_ok_after_question
    tags: [accept_offer, pending]
    query: "ok"
    state:
      <<: *prior_diy_only
      pending_user_action:
        kind: run_branch
        expanded_user_query: "Run cost analysis and compare DIY vs professional"
        run_optional_agents: [cost]
        offered_summary: "Offered cost analysis."
    dialogue:
      - role: assistant
        text: "Want me to run **cost** analysis to compare DIY vs professional repair?"
    expect:
      discourse_act: accept_offer
      run_optional_agents: [cost]
      retrieval_only: false

  - id: decline_offer_is_closure
    tags: [closure, pending, failure_guard]
    query: "no thanks, that's all"
    state:
      <<: *prior_diy_only
      pending_user_action:
        kind: run_branch
        expanded_user_query: "Run cost analysis for the vehicle paint damage"
        run_optional_agents: [cost]
        offered_summary: "Offered cost analysis."
    dialogue:
      - role: assistant
        text: "Want me to run **cost** analysis as well?"
    expect:
      discourse_act: closure
      intent: acknowledgment
      run_optional_agents: []

  # ── Explain prior / provider detail ──────────────────────────────────────
  - id: explain_prior_pro_expensive
    tags: [explain_prior, focus_cost]
    query: "why is professional so expensive?"
    state: *prior_cost_diy
    dialogue:
      - role: assistant
        text: "Cost comparison complete: DIY $50-300, professional service $200-800."
    expect:
      discourse_act: explain_prior
      route: [checkpoint, none]
      retrieval_only: true
      run_optional_agents: []
      user_goal: answer_from_context
      focus_branch: cost

  - id: explain_prior_diy_steps
    tags: [explain_prior, focus_diy]
    query: "can you explain the DIY steps in more detail?"
    state: *prior_diy_only
    dialogue:
      - role: assistant
        text: "DIY analysis complete: clean the area, remove paint transfer, sand, apply touch-up paint."
    expect:
      discourse_act: explain_prior
      retrieval_only: true
      run_optional_agents: []
      user_goal: answer_from_context
      focus_branch: diy

  - id: explain_prior_worth_it
    tags: [explain_prior, focus_cost]
    query: "is DIY really worth it compared to hiring someone?"
    state: *prior_cost_diy
    dialogue:
      - role: assistant
        text: "DIY would cost $50-300 in materials; professional service runs $200-800 with warranty."
    expect:
      discourse_act: explain_prior
      retrieval_only: true
      run_optional_agents: []
      user_goal: answer_from_context

  - id: provider_detail_first
    tags: [provider_detail]
    query: "tell me more about the first provider"
    state: *prior_service
    dialogue:
      - role: assistant
        text: "I found two providers: Brentwood Pro Painters (4.8 stars) and Delta Door & Trim (4.6 stars)."
    expect:
      discourse_act: [provider_detail, explain_prior]
      retrieval_only: true
      run_optional_agents: []
      user_goal: answer_from_context

  - id: provider_detail_phone
    tags: [provider_detail]
    query: "do they have a phone number?"
    state: *prior_service
    dialogue:
      - role: assistant
        text: "Brentwood Pro Painters has a 4.8 star rating and offers garage door repainting."
    expect:
      discourse_act: [provider_detail, explain_prior]
      retrieval_only: true
      run_optional_agents: []

  # ── New work: retrieval-only ──────────────────────────────────────────────
  - id: cold_summarize_selected
    tags: [new_work, retrieval, weblog_t1]
    query: "Summarize the issues for the selected checkpoint"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: true
      run_optional_agents: []
      user_goal: new_analysis

  - id: inventory_status
    tags: [new_work, inventory, weblog_t3, failure_observed]
    # Observed defect 2026-06-10: resolver returned retrieval_only=false
    # despite the prompt rule mandating true for inventory queries.
    query: "What checkpoints do I have and what is their current status?"
    state: {}
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: true
      run_optional_agents: []
      user_goal: new_analysis

  - id: inventory_list
    tags: [new_work, inventory]
    query: "list my checkpoints"
    state: {}
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: true
      run_optional_agents: []
      user_goal: new_analysis

  - id: cold_any_issues
    tags: [new_work, retrieval]
    query: "are there any issues with my property?"
    state: {}
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: true
      run_optional_agents: []
      user_goal: new_analysis

  - id: selection_changed_car_issue
    tags: [new_work, selection, weblog_t2, failure_observed]
    # Observed defect 2026-06-10: resolver leaked the dangling cost offer into
    # run_optional_agents for a plain "any issues?" question (28s unrequested run).
    query: "Is there any issue with my car based on the selected checkpoints?"
    state:
      <<: *prior_diy_only
      checkpoint_ids: ["CKPT0000000000000001", "CKPT0000000000000002"]
      checkpoint_ids_analyzed: ["CKPT0000000000000001"]
    dialogue:
      - role: assistant
        text: "The vehicle exterior shows paint transfer and deep scratches. Would you like me to run **cost** or **DIY** analysis?"
    expect:
      discourse_act: new_work
      route: checkpoint
      run_optional_agents: []
      user_goal: new_analysis

  - id: post_branch_summarize
    tags: [context, weblog_t6, failure_observed]
    # Observed defect 2026-06-10: resolver echoed polluted ui toggles
    # (['diy','diy']) into run_optional_agents for a plain summarize ask.
    query: "Summarize the issues for the selected checkpoints"
    state:
      <<: *prior_diy_only
      checkpoint_optional_agents: [diy, diy]
    dialogue:
      - role: assistant
        text: "DIY analysis complete for the vehicle paint damage with step-by-step repair guidance."
    expect:
      discourse_act: [new_work, explain_prior]
      retrieval_only: true
      run_optional_agents: []
      user_goal: answer_from_context

  - id: fresh_provider_search
    tags: [new_work, branch_service, fresh]
    query: "search again for current providers near me"
    state: *prior_service
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: false
      run_optional_agents: [service]
      user_goal: new_analysis

  # ── New work: optional branches ───────────────────────────────────────────
  - id: branch_cost_explicit
    tags: [new_work, branch_cost]
    query: "run cost analysis"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: false
      run_optional_agents: [cost]
      user_goal: new_analysis

  - id: branch_diy_explicit
    tags: [new_work, branch_diy, weblog_t4]
    query: "Run DIY analysis on the selected checkpoint"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: false
      run_optional_agents: [diy]
      user_goal: new_analysis

  - id: branch_service_providers
    tags: [new_work, branch_service]
    query: "find local service providers for this repair"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: false
      run_optional_agents: [service]
      user_goal: new_analysis

  - id: branch_coverage_insurance
    tags: [new_work, branch_coverage]
    query: "would this damage be covered by my insurance?"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
    expect:
      route: [checkpoint, user_docs]
      run_optional_agents_any_of:
        - [coverage]
        - []
      user_goal: [new_analysis, answer_from_context]

  - id: branch_cost_compare_chip_text
    tags: [new_work, branch_cost, chip]
    query: "Run cost analysis and compare DIY vs professional"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
      chat_intent: new_analysis
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: false
      run_optional_agents_any_of:
        - [cost]
        - [cost, diy]
      user_goal: new_analysis

  - id: branch_rerun_cost_explicit
    tags: [new_work, branch_cost, rerun]
    query: "run cost analysis again"
    state: *prior_cost_diy
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: false
      run_optional_agents: [cost]
      user_goal: new_analysis

  - id: branch_how_about_cost
    tags: [new_work, branch_cost]
    query: "how about cost?"
    state: *prior_diy_only
    dialogue:
      - role: assistant
        text: "DIY analysis complete: estimated materials cost $60-250 with detailed repair steps."
    expect:
      discourse_act: [new_work, accept_offer]
      route: checkpoint
      retrieval_only: false
      run_optional_agents: [cost]
      user_goal: new_analysis

  - id: menu_ordinal_last_pick
    tags: [accept_offer, menu]
    query: "the last one"
    state:
      pending_user_action:
        kind: pick_capability
        expanded_user_query: "Help me choose what to explore from the capability menu."
        run_optional_agents: []
        offered_summary: "Capability menu offered."
      last_offered_options: [checkpoints, documents, coverage, diy, service, cost]
    dialogue:
      - role: assistant
        text: "I can help with: 1. checkpoints, 2. documents, 3. coverage, 4. diy, 5. service, 6. cost. Which would you like?"
    expect:
      discourse_act: [accept_offer, new_work]
      capability_key: cost
      run_optional_agents: [cost]

  # ── Docs route ────────────────────────────────────────────────────────────
  - id: docs_policy_water_damage
    tags: [user_docs]
    query: "what does my insurance policy say about water damage?"
    state:
      primary_agent: docs
      context_doc_uris: ["gs://homegeek-user-data-staging/docs/policy.pdf"]
    expect:
      route: user_docs
      run_optional_agents: []
      retrieval_only: true

  - id: docs_lease_end
    tags: [user_docs]
    query: "when does my lease end?"
    state:
      primary_agent: docs
      context_doc_uris: ["gs://homegeek-user-data-staging/docs/lease.pdf"]
    expect:
      route: user_docs
      run_optional_agents: []

  - id: docs_summarize
    tags: [user_docs]
    query: "summarize my documents"
    state:
      primary_agent: docs
      context_doc_uris:
        - "gs://homegeek-user-data-staging/docs/policy.pdf"
        - "gs://homegeek-user-data-staging/docs/lease.pdf"
    expect:
      route: user_docs
      run_optional_agents: []

  - id: docs_coverage_question_on_docs_tab
    tags: [user_docs, branch_coverage]
    query: "does my policy cover the garage door damage?"
    state:
      <<: *prior_diy_only
      primary_agent: docs
      context_doc_uris: ["gs://homegeek-user-data-staging/docs/policy.pdf"]
    expect:
      route: user_docs
      run_optional_agents: []

  # ── Report route ──────────────────────────────────────────────────────────
  - id: report_summarize
    tags: [report]
    query: "summarize my report"
    state:
      primary_agent: report
      report_ids: ["RPT0000000000000001"]
    expect:
      route: report
      retrieval_only: true
      run_optional_agents: []
      user_goal: answer_from_context

  - id: report_cost_question_stays_report
    tags: [report, failure_guard]
    query: "what were the cost estimates in the report?"
    state:
      primary_agent: report
      report_ids: ["RPT0000000000000001"]
    expect:
      route: report
      run_optional_agents: []
      retrieval_only: true

  - id: report_show_again
    tags: [report]
    query: "show me the report again"
    state:
      primary_agent: report
      report_ids: ["RPT0000000000000001"]
    expect:
      route: report
      run_optional_agents: []

  - id: checkpoint_replay_full_report
    tags: [replay]
    query: "show me the full analysis report again"
    state: *prior_cost_diy
    expect:
      discourse_act: replay_report
      user_goal: replay_deliverable
      run_optional_agents: []

  # ── Edge cases ────────────────────────────────────────────────────────────
  - id: ui_toggles_never_copied
    tags: [edge, ui_toggles, failure_guard]
    query: "are there any issues?"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
      checkpoint_optional_agents: [diy]
    expect:
      route: checkpoint
      run_optional_agents: []
      user_goal: new_analysis

  - id: selection_cleared_summarize
    tags: [edge, selection]
    query: "summarize the issues"
    state:
      <<: *prior_diy_only
      checkpoint_ids: []
    expect:
      route: checkpoint
      retrieval_only: true
      run_optional_agents: []
      user_goal: new_analysis

  - id: general_homecare_question
    tags: [edge, general]
    query: "how often should I service my HVAC system?"
    state: {}
    expect:
      run_optional_agents: []
      retrieval_only: true
