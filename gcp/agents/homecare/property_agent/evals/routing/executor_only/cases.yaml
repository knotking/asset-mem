      run_optional_agents: []
      user_goal: answer_from_context

  - id: weblog_session_2_t1_chip_cost
    tags: [weblog, weblog_session_2, chip, executor_only]
    query: "Run cost analysis and compare DIY vs professional"
    state:
      checkpoint_ids: ["CKPT0000000000000001"]
      chip_action: {type: run_branch, branch: cost}
    expect:
      discourse_act: new_work
      route: checkpoint
      retrieval_only: false
      focus_branch: cost
      query_mode: branch_explicit
