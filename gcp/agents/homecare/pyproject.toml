[project]
name = "property_agent"
version = "0.1.0"
description = "Answer questions related to Vertex AI documentation using Vertex AI RAG Engine"
authors = []
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adk==0.0.5",
    "google-adk==1.7.0",
    "google-cloud-aiplatform[adk,agent-engines]==1.104.0",
    "google-auth==2.36.0",
    "google-cloud-pubsub==2.31.1",
    "google-search-results==2.4.2",
    "langchain==0.3.26",
    "langchain-community==0.3.27",
    "llama-index==0.12.0",
    "pydantic-settings==2.8.1",
    "python-dotenv==1.0.0",
    "requests==2.32.4",
    "tabulate==0.9.0",
    "tool==0.8.0",
    "tools==1.0.6",
    "tqdm==4.66.1",
    "youtube-search==2.1.2",
    "Pillow==10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
    "scikit-learn==1.6.1",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.26.0",
    "black==25.1.0",
]

[tool.setuptools]
packages = ["property_agent"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
