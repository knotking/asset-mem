[project]
name = "property_agent"
version = "0.1.0"
description = "Answer questions related to Vertex AI documentation using Vertex AI RAG Engine"
authors = []
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework",
    "google-adk==1.33.0",
    "google-cloud-aiplatform[adk,agent-engines]==1.151.0",
    "google-auth==2.52.0",
    "google-cloud-firestore==2.22.0",  # Firestore vector search in checkpoint retrieval (run_checkpoint_pipeline)
    "google-cloud-pubsub==2.31.1",
    "google-genai==1.72.0",  # For query embedding generation in checkpoint_agent
    "google-search-results==2.4.2",
    "langchain==0.3.26",
    "langchain-community==0.3.27",
    "llama-index==0.14.21",
    "pydantic-settings==2.8.1",
    "pandas>=2.2.0,<3",
    "rouge-score>=0.1.2",
    "python-dotenv==1.0.0",
    "requests==2.32.4",
    "tabulate==0.9.0",
    "tool==0.8.0",
    "tools==1.0.6",
    "tqdm==4.66.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
    "scikit-learn==1.6.1",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.26.0",
    "black==25.1.0",
    "mypy>=2.1.0",
    "jsonschema>=4.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["property_agent*"]

[tool.uv.sources]
agent-framework = { path = "../../agent_framework", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration_external: live YouTube / SerpAPI (opt-in via RUN_EXTERNAL_DIY_SEARCH_TESTS=1)",
    "eval_dataset: offline eval datasets (routing, trajectory, contracts)",
    "contract: contentJson schema and deterministic rubric scoring",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]
