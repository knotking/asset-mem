[tool.poetry]
name = "service-broker"
version = "0.1.0"
description = "HomeGeek Service Request Broker and Proxy agents implemented with Google ADK."
authors = []
readme = "README.md"
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.11"
adk = "^0.0.5"
google-adk = "^1.17.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.8.1"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
tabulate = "^0.9.0"
twilio = "^9.3.3"
typer = "^0.12.5"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pytest = "^8.3.5"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

