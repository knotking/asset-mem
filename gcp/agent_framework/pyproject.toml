[project]
name = "agent-framework"
version = "0.1.0"
description = "Deprecated shim — use agent-platform-core and agent-platform-adk"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "agent-platform-core",
    "agent-platform-adk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
]

[tool.uv.sources]
agent-platform-core = { path = "../../../agent-platform/packages/core", editable = true }
agent-platform-adk = { path = "../../../agent-platform/packages/adk", editable = true }

[tool.setuptools]
package-dir = { "agent_framework" = "." }
packages = [
    "agent_framework",
    "agent_framework.context",
    "agent_framework.context.prompt",
    "agent_framework.contracts",
    "agent_framework.execution",
    "agent_framework.memory",
    "agent_framework.observability",
    "agent_framework.registry",
    "agent_framework.routing",
    "agent_framework.runtime",
    "agent_framework.state",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
