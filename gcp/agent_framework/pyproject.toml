[project]
name = "agent-framework"
version = "0.1.0"
description = "Reusable Google ADK agent framework (routing, state, tools, context)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.33.0",
    "google-genai>=1.72.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
package-dir = { "agent_framework" = "." }
packages = [
    "agent_framework",
    "agent_framework.context",
    "agent_framework.context.prompt",
    "agent_framework.contracts",
    "agent_framework.execution",
    "agent_framework.memory",
    "agent_framework.observability",
    "agent_framework.registry",
    "agent_framework.routing",
    "agent_framework.runtime",
    "agent_framework.state",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
