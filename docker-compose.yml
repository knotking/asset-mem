volumes:
  n8n_storage:
  postgres_storage:
  qdrant_storage:
  api_storage:

networks:
  homegeek:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ["homegeek"]
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_RUNNERS_ENABLED=true
    - N8N_HOST=${N8N_SUB_DOMAIN}.${N8N_DOMAIN}
    - N8N_PROTOCOL=https
    # - WEBHOOK_URL=https://funky-frankly-stingray.ngrok-free.app
    - WEBHOOK_URL=https://${N8N_SUB_DOMAIN}.${N8N_DOMAIN}/


x-postgres: &service-postgres
  image: postgres:16-alpine
  networks: ["homegeek"]
  hostname: postgres
  environment:
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
x-qdrant: &service-qdrant
  image: qdrant/qdrant
  hostname: qdrant
  networks: ["homegeek"]
services:
  postgres:
    <<: *service-postgres
    restart: unless-stopped
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-init:
    <<: *service-postgres
    hostname: postgres-init
    container_name: postgres-init
    entrypoint: /bin/sh
    command:
      - "-c"
      - "PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /backup/postgres/10-create-user-tables.sql"
    volumes:
      - ./n8n/backup:/backup
    depends_on:
      postgres:
        condition: service_healthy
  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        n8n import:credentials --separate --input=/backup/credentials \
        && n8n import:workflow --separate --input=/backup/workflows
    volumes:
      - ./n8n/backup:/backup
    depends_on:
      postgres:
        condition: service_healthy
  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully


  qdrant:
    <<: *service-qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage
  qdrant-init:
    image: curlimages/curl
    networks: ["homegeek"]
    container_name: qdrant-init
    entrypoint: /bin/sh
    command:
      - "-c"
      - "/backup/qdrant/10-create-collections.sh"
    volumes:
      - ./n8n/backup:/backup
    depends_on:
      - qdrant

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - 8000:8000
    networks: ["homegeek"]
    working_dir: /app
    volumes:
      - api_storage:/home/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    # command: ["tail", "-f", "/dev/null"]

  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
    networks:
      - homegeek
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml
      - ./traefik/acme.json:/acme.json
    environment:
      - TRAEFIK_LOG_LEVEL=INFO
    labels:
      - "traefik.enable=true"
