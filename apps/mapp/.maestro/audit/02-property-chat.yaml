appId: ${APP_ID}
---
- runFlow: ../subflows/open-property.yaml

- assertVisible:
    id: "property-tab-chat"
- extendedWaitUntil:
    visible: "Type a message…"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 3000
    optional: true
- takeScreenshot: audit-property-chat

- tapOn:
    text: "Chat sessions"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 10000
- takeScreenshot: audit-property-sessions-drawer
- runFlow: ../subflows/close-drawer.yaml

- tapOn:
    text: "New chat session"
- takeScreenshot: audit-property-new-session

- tapOn:
    text: "Open chat settings"
    optional: true
- takeScreenshot: audit-property-chat-settings
- tapOn:
    text: "Close settings"
    optional: true
