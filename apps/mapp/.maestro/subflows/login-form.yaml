appId: ${APP_ID}
---
- assertVisible: "Welcome Back"
- tapOn:
    text: "Enter your email"
    waitToSettleTimeoutMs: 300
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    text: "Enter your password"
    waitToSettleTimeoutMs: 300
- inputText: ${MAESTRO_PASSWORD}
- tapOn:
    text: "Sign In"
    waitToSettleTimeoutMs: 300
- assertVisible: "Property AI Agent|Dashboard"
