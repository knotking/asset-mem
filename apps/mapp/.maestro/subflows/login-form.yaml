appId: ${APP_ID}
---
- assertVisible: "Welcome Back"
- tapOn:
    id: "auth-email-input"
    waitToSettleTimeoutMs: 500
- eraseText
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "auth-password-input"
    waitToSettleTimeoutMs: 500
- eraseText
- inputText: ${MAESTRO_PASSWORD}
- tapOn:
    text: "Sign In"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Property AI Agent|Ask about your timeline|Type a message"
    timeout: 20000
