appId: ${APP_ID}
---
- runFlow:
    when:
      visible: "Dashboard"
    commands:
      - tapOn: "Dashboard"

- runFlow:
    when:
      visible:
        id: "property-details-back"
    commands:
      - tapOn:
          id: "property-details-back"

- runFlow:
    when:
      visible: "Properties, tab.*"
    commands:
      - tapOn:
          text: "Properties, tab.*"

- assertVisible: "Property AI Agent"
