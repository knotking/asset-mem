appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      text: "Property AI Agent"
    timeout: 20000

- tapOn:
    text: "Add New Property"

- extendedWaitUntil:
    visible:
      text: "Upload Property Documents"
    timeout: 10000

- scroll
- waitForAnimationToEnd

- tapOn:
    text: "Cancel"
    optional: true
