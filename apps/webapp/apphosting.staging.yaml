# Staging environment configuration for Firebase App Hosting
# Deploy with: firebase apphosting:backends:create --config apphosting.staging.yaml

env:
  # Server-side environment variables (available in API routes and server components)
  # Base API URL - all endpoint URLs are constructed from this in code
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://homecare-agent-proxy-staging-291418967332.us-central1.run.app/92be3f5be13328fe265af604b0bde2061e18662203a83b5b5692119215be0376
    availability:
      - BUILD
      - RUNTIME
  # Add this for monorepo support
  - variable: GOOGLE_BUILDABLE
    value: apps/webapp
    availability:
      - BUILD
  # Environment identifier
  - variable: NEXT_PUBLIC_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME
  # Staging canonical URL for OG metadata (adjust if backend URL differs)
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://staging--homegeekdemo.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPPORT_EMAIL
    value: support@homegeek.ai
    availability:
      - BUILD
      - RUNTIME
  # Optional: GA4 for staging smoke tests
  # - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
  #   value: G-XXXXXXXXXX
  #   availability:
  #     - BUILD
  #     - RUNTIME
  - variable: NEXT_PUBLIC_DEBUG_LOGS
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Align with GitHub Actions TOKEN_QUOTA_PERIOD_MAX_TOKENS / proxy Cloud Run (AI usage UI)
  - variable: NEXT_PUBLIC_TOKEN_QUOTA_PERIOD_MAX_TOKENS
    value: "1000000"
    availability:
      - BUILD
      - RUNTIME

runConfig:
  # Staging can have lower limits
  maxInstances: 1
  minInstances: 0
