# Production environment configuration for Firebase App Hosting
# Deploy with: firebase apphosting:backends:create --config apphosting.prod.yaml

env:
  # Server-side environment variables (available in API routes and server components)
  # Base API URL - all endpoint URLs are constructed from this in code
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://homecare-agent-proxy-prod-686746113874.us-central1.run.app
  # Strip legacy path secret if NEXT_PUBLIC_API_BASE_URL still includes it (migration)
  - variable: NEXT_PUBLIC_PROXY_PATH_SECRET
    value: 92be3f5be13328fe265af604b0bde2061e18662203a83b5b5692119215be0376
    availability:
      - BUILD
      - RUNTIME
  # Add this for monorepo support
  - variable: GOOGLE_BUILDABLE
    value: apps/webapp
    availability:
      - BUILD
  # Environment identifier
  - variable: NEXT_PUBLIC_ENV
    value: prod
    availability:
      - BUILD
      - RUNTIME
  # Canonical origin for Open Graph / metadata (no trailing slash)
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://homegeek.ai
    availability:
      - BUILD
      - RUNTIME
  # Landing contact section and legal pages
  - variable: NEXT_PUBLIC_SUPPORT_EMAIL
    value: support@homegeek.ai
    availability:
      - BUILD
      - RUNTIME
  # GA4 — uncomment and set before Product Hunt (see docs/deployment/PRODUCT_HUNT_LAUNCH.md §2.1)
  # - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
  #   value: G-XXXXXXXXXX
  #   availability:
  #     - BUILD
  #     - RUNTIME
  # Align with prod TOKEN_QUOTA_PERIOD_MAX_TOKENS on proxy + checkpoint worker
  - variable: NEXT_PUBLIC_TOKEN_QUOTA_PERIOD_MAX_TOKENS
    value: "1000000"
    availability:
      - BUILD
      - RUNTIME

runConfig:
  # Production can scale higher
  maxInstances: 1
  minInstances: 0
