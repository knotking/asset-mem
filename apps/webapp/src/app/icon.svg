<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(8, 142, 175);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(6, 120, 150);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F9FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  
  <!-- House shape - modern and clean -->
  <path d="M256 140L140 220V380H200V280H312V380H372V220L256 140Z" fill="url(#houseGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  
  <!-- Door -->
  <rect x="230" y="300" width="52" height="80" rx="4" fill="rgb(8, 142, 175)" opacity="0.8"/>
  <circle cx="265" cy="340" r="3" fill="white" opacity="0.6"/>
  
  <!-- AI sparkle element - represents intelligence -->
  <g transform="translate(360, 120)">
    <circle cx="0" cy="0" r="24" fill="white" opacity="0.9"/>
    <path d="M0 -16L4 -8L12 -8L6 0L10 8L0 4L-10 8L-6 0L-12 -8L-4 -8L0 -16Z" fill="rgb(8, 142, 175)"/>
    <circle cx="0" cy="0" r="6" fill="rgb(8, 142, 175)"/>
  </g>
  
  <!-- Subtle corner accent -->
  <circle cx="420" cy="92" r="32" fill="rgba(255,255,255,0.15)"/>
</svg>
