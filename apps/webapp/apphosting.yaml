# Default/Development environment configuration for Firebase App Hosting
# For staging: use apphosting.staging.yaml
# For production: use apphosting.prod.yaml
# https://firebase.google.com/docs/app-hosting/configure

env:
  # Server-side environment variables (available in API routes and server components)
  # Base API URL - all endpoint URLs are constructed from this in code
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://homecare-agent-proxy-321433914812.us-central1.run.app/92be3f5be13328fe265af604b0bde2061e18662203a83b5b5692119215be0376
    availability:
      - BUILD
      - RUNTIME
  # Add this for monorepo support
  - variable: GOOGLE_BUILDABLE
    value: apps/webapp
    availability:
      - BUILD
  # Environment identifier
  - variable: NEXT_PUBLIC_ENV
    value: dev
    availability:
      - BUILD
      - RUNTIME
  # Verbose client logs (debug/info). Omit or set false in production backends.
  - variable: NEXT_PUBLIC_DEBUG_LOGS
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_TOKEN_QUOTA_PERIOD_MAX_TOKENS
    value: "1000000"
    availability:
      - BUILD
      - RUNTIME

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
