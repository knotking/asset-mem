name: Destroy On-Demand Environment

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Environment name to destroy"
        required: true
        type: string
      gcp_project_id:
        description: "GCP Project ID"
        required: true
        type: string
      region:
        description: "GCP Region (should match the region used during creation)"
        required: false
        default: "us-central1"
        type: choice
        options:
          - us-central1
          - us-east1
          - us-west1
      confirm_destroy:
        description: 'Type "DESTROY" to confirm deletion'
        required: true
        type: string
      destroy_project:
        description: "Also delete the GCP project (DANGEROUS)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate-only:
    name: Validate Workflow (Push Only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow syntax
        run: |
          echo "✅ Workflow validation successful"
          echo "📝 This is a push event - NO resources will be destroyed"
          echo "ℹ️  To destroy an environment, manually trigger this workflow from Actions tab"
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

  validate:
    name: Validate Destruction Request
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::You must type 'DESTROY' to confirm environment deletion"
            exit 1
          fi

          echo "⚠️  Destruction confirmed for environment: ${{ inputs.environment_name }}"

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.ORG_WIF_PROVIDER }}" ]; then
            echo "::error::ORG_WIF_PROVIDER secret is not configured"
            echo "::error::This is required for environment destruction. See README for setup instructions."
            exit 1
          fi

          if [ -z "${{ secrets.ORG_ADMIN_SERVICE_ACCOUNT }}" ]; then
            echo "::error::ORG_ADMIN_SERVICE_ACCOUNT secret is not configured"
            echo "::error::This is required for environment destruction. See README for setup instructions."
            exit 1
          fi

          echo "✓ All required secrets configured"

      - name: Warning for project deletion
        if: inputs.destroy_project == true
        run: |
          echo "::warning::Project deletion is enabled! This will delete the entire GCP project."
          sleep 10

  cleanup-applications:
    name: Cleanup Applications
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.ORG_WIF_PROVIDER }}
          service_account: ${{ secrets.ORG_ADMIN_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Run service
        continue-on-error: true
        run: |
          REGION="${{ inputs.region }}"

          echo "Deleting Cloud Run service in region: $REGION"
          gcloud run services delete homecare-agent-proxy-${{ inputs.environment_name }} \
            --region=$REGION \
            --project=${{ inputs.gcp_project_id }} \
            --quiet

          echo "✓ Cloud Run service deleted"

      - name: Delete Cloud Function
        continue-on-error: true
        run: |
          REGION="${{ inputs.region }}"

          echo "Deleting Cloud Function in region: $REGION"
          gcloud functions delete pubsub_to_user_docs-${{ inputs.environment_name }} \
            --gen2 \
            --region=$REGION \
            --project=${{ inputs.gcp_project_id }} \
            --quiet

          echo "✓ Cloud Function deleted"

  destroy-infrastructure:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: [validate, cleanup-applications]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.ORG_WIF_PROVIDER }}
          service_account: ${{ secrets.ORG_ADMIN_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete Pub/Sub Resources
        continue-on-error: true
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"
          ENV="${{ inputs.environment_name }}"

          echo "Deleting Pub/Sub subscriptions..."
          gcloud pubsub subscriptions delete "user-upload-subscription-${ENV}" \
            --project=$PROJECT_ID --quiet || true
          gcloud pubsub subscriptions delete "user-upload-result-subscription-${ENV}" \
            --project=$PROJECT_ID --quiet || true

          echo "Deleting Pub/Sub topics..."
          gcloud pubsub topics delete "user-upload-topic-${ENV}" \
            --project=$PROJECT_ID --quiet || true
          gcloud pubsub topics delete "user-upload-result-topic-${ENV}" \
            --project=$PROJECT_ID --quiet || true

          echo "✓ Pub/Sub resources deleted"

      - name: Delete Firebase App Hosting Backend
        continue-on-error: true
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"
          ENV="${{ inputs.environment_name }}"
          BACKEND_ID="${ENV}"

          echo "Installing Firebase CLI..."
          npm install -g firebase-tools

          echo "Authenticating with Firebase..."
          export FIREBASE_TOKEN=$(gcloud auth application-default print-access-token)
          export CLOUDSDK_CORE_PROJECT=$PROJECT_ID
          export GOOGLE_CLOUD_QUOTA_PROJECT=$PROJECT_ID

          echo "Deleting Firebase App Hosting backend: $BACKEND_ID"
          firebase apphosting:backends:delete $BACKEND_ID \
            --project=$PROJECT_ID \
            --token "$FIREBASE_TOKEN" \
            --force \
            --non-interactive || echo "⚠️ Backend may not exist or already deleted"

          echo "✓ Firebase App Hosting backend deleted"

      - name: Delete Storage Buckets
        continue-on-error: true
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"
          ENV="${{ inputs.environment_name }}"

          echo "Deleting user data bucket..."
          gsutil -m rm -r gs://homegeek-user-data-${ENV} || echo "⚠️ User data bucket may not exist"

          echo "Deleting catalog bucket..."
          gsutil -m rm -r gs://homegeek-catalog-${ENV} || echo "⚠️ Catalog bucket may not exist"

          echo "Deleting Firebase Storage bucket..."
          FIREBASE_BUCKET="${PROJECT_ID}.firebasestorage.app"
          gsutil -m rm -r gs://${FIREBASE_BUCKET} || echo "⚠️ Firebase Storage bucket may not exist"

          echo "✓ Storage buckets deleted"

      - name: Delete Artifact Registry Repository
        continue-on-error: true
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"
          REGION="${{ inputs.region }}"
          REPO_NAME="cloud-run-source-deploy"

          echo "Deleting Artifact Registry repository: $REPO_NAME in $REGION"
          gcloud artifacts repositories delete $REPO_NAME \
            --location=$REGION \
            --project=$PROJECT_ID \
            --quiet || echo "⚠️ Artifact Registry repository may not exist"

          echo "✓ Artifact Registry repository deleted"

      - name: Delete Firestore Database
        continue-on-error: true
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"

          echo "Deleting Firestore database..."
          # Get database name
          DB_NAME=$(gcloud firestore databases list --project=$PROJECT_ID --format="value(name)" 2>/dev/null | head -n 1 || echo "")

          if [ -n "$DB_NAME" ]; then
            echo "Found database: $DB_NAME"
            gcloud firestore databases delete $DB_NAME \
              --project=$PROJECT_ID \
              --quiet || echo "⚠️ Failed to delete Firestore database"
            echo "✓ Firestore database deleted"
          else
            echo "⚠️ No Firestore database found"
          fi

      - name: Delete RAG Corpora
        continue-on-error: true
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"
          REGION="${{ inputs.region }}"
          ENV="${{ inputs.environment_name }}"

          # Map region to RAG region (same logic as create workflow)
          case "$REGION" in
            us-central1|us-east4)
              RAG_REGION="us-west1"
              echo "⚠️ Mapping $REGION to RAG region: $RAG_REGION"
              ;;
            europe-west*)
              RAG_REGION="europe-west4"
              ;;
            asia-*)
              RAG_REGION="asia-southeast1"
              ;;
            *)
              RAG_REGION="us-west1"
              ;;
          esac

          echo "Deleting RAG corpora in region: $RAG_REGION"

          # List all RAG corpora and delete those matching the environment
          BASE_URL="https://${RAG_REGION}-aiplatform.googleapis.com/v1/projects/${PROJECT_ID}/locations/${RAG_REGION}/ragCorpora"
          AUTH_HEADER="Authorization: Bearer $(gcloud auth print-access-token)"

          # Get list of corpora
          CORPORA=$(curl -s -H "$AUTH_HEADER" "$BASE_URL" | jq -r ".ragCorpora[]? | select(.displayName | contains(\"${ENV}\")) | .name" || echo "")

          if [ -n "$CORPORA" ]; then
            for corpus in $CORPORA; do
              if [ -n "$corpus" ]; then
                echo "Deleting corpus: $corpus"
                curl -X DELETE -H "$AUTH_HEADER" "https://${RAG_REGION}-aiplatform.googleapis.com/v1/${corpus}" || echo "⚠️ Failed to delete corpus"
              fi
            done
            echo "✓ RAG corpora deleted"
          else
            echo "⚠️ No RAG corpora found for environment: $ENV"
          fi

      - name: Delete IAM Resources
        continue-on-error: true
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')

          # Service accounts
          GITHUB_SA="githubworkflowdeployment@${PROJECT_ID}.iam.gserviceaccount.com"
          FIREBASE_SA="firebase-apphosting-deployer@${PROJECT_ID}.iam.gserviceaccount.com"
          COMPUTE_SA="firebase-app-hosting-compute@${PROJECT_ID}.iam.gserviceaccount.com"

          # Step 1: Remove Workload Identity bindings
          echo "Removing Workload Identity bindings..."
          WIF_MEMBER="principalSet://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-pool/attribute.repository/${{ github.repository }}"

          echo "Removing GitHub workflow SA binding..."
          gcloud iam service-accounts remove-iam-policy-binding $GITHUB_SA \
            --project=$PROJECT_ID \
            --role="roles/iam.workloadIdentityUser" \
            --member="$WIF_MEMBER" \
            --quiet 2>/dev/null || echo "⚠️ GitHub SA WIF binding may not exist"

          echo "Removing Firebase deployer SA binding..."
          gcloud iam service-accounts remove-iam-policy-binding $FIREBASE_SA \
            --project=$PROJECT_ID \
            --role="roles/iam.workloadIdentityUser" \
            --member="$WIF_MEMBER" \
            --quiet 2>/dev/null || echo "⚠️ Firebase SA WIF binding may not exist"

          # Step 1.5: Remove Service Account User permission
          echo "Removing Firebase deployer permission to act as compute SA..."
          gcloud iam service-accounts remove-iam-policy-binding $COMPUTE_SA \
            --project=$PROJECT_ID \
            --role="roles/iam.serviceAccountUser" \
            --member="serviceAccount:${FIREBASE_SA}" \
            --quiet 2>/dev/null || echo "⚠️ Service Account User binding may not exist"

          # Step 2: Delete Workload Identity Provider
          echo "Deleting Workload Identity Provider..."
          gcloud iam workload-identity-pools providers delete github-provider \
            --location="global" \
            --workload-identity-pool="github-pool" \
            --project=$PROJECT_ID \
            --quiet 2>/dev/null || echo "⚠️ WIF Provider may not exist"

          # Step 3: Delete Workload Identity Pool
          echo "Deleting Workload Identity Pool..."
          gcloud iam workload-identity-pools delete github-pool \
            --location="global" \
            --project=$PROJECT_ID \
            --quiet 2>/dev/null || echo "⚠️ WIF Pool may not exist"

          # Step 4: Delete GitHub workflow service account
          echo "Deleting GitHub workflow service account..."
          gcloud iam service-accounts delete $GITHUB_SA \
            --project=$PROJECT_ID \
            --quiet 2>/dev/null || echo "⚠️ GitHub SA may not exist"

          # Step 5: Delete Firebase App Hosting service account
          echo "Deleting Firebase App Hosting service account..."
          gcloud iam service-accounts delete $FIREBASE_SA \
            --project=$PROJECT_ID \
            --quiet 2>/dev/null || echo "⚠️ Firebase SA may not exist"

          # Step 6: Revoke RAG service account permissions (optional cleanup)
          echo "Revoking RAG service account permissions..."
          RAG_SA="service-${PROJECT_NUMBER}@gcp-sa-vertex-rag.iam.gserviceaccount.com"
          gcloud projects remove-iam-policy-binding $PROJECT_ID \
            --member="serviceAccount:${RAG_SA}" \
            --role="roles/storage.objectAdmin" \
            --quiet 2>/dev/null || echo "⚠️ RAG SA permissions may not exist"

          # Step 7: Revoke Reasoning Engine RAG access permissions
          echo "Revoking Reasoning Engine RAG access permissions..."
          REASONING_ENGINE_SA="service-${PROJECT_NUMBER}@gcp-sa-aiplatform-re.iam.gserviceaccount.com"
          ROLE_ID="ragCorpusAccessRole"

          # Remove the custom role binding from Reasoning Engine SA
          gcloud projects remove-iam-policy-binding $PROJECT_ID \
            --member="serviceAccount:${REASONING_ENGINE_SA}" \
            --role="projects/$PROJECT_ID/roles/$ROLE_ID" \
            --quiet 2>/dev/null || echo "⚠️ Reasoning Engine RAG role binding may not exist"

          # Step 8: Delete the custom RAG role
          echo "Deleting custom RAG role..."
          gcloud iam roles delete "$ROLE_ID" \
            --project="$PROJECT_ID" \
            --quiet 2>/dev/null || echo "⚠️ Custom RAG role may not exist"

          echo "✓ IAM resources deleted"

  destroy-project:
    name: Destroy GCP Project
    runs-on: ubuntu-latest
    needs: [validate, destroy-infrastructure]
    if: github.event_name == 'workflow_dispatch' && inputs.destroy_project == true
    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.ORG_WIF_PROVIDER }}
          service_account: ${{ secrets.ORG_ADMIN_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Final confirmation wait
        run: |
          echo "⚠️⚠️⚠️  FINAL WARNING ⚠️⚠️⚠️"
          echo "About to delete GCP project: ${{ inputs.gcp_project_id }}"
          echo "Waiting 30 seconds for final consideration..."
          sleep 30

      - name: Delete GCP project
        run: |
          gcloud projects delete ${{ inputs.gcp_project_id }} --quiet
          echo "✓ GCP project deleted"

  summary:
    name: Destruction Summary
    runs-on: ubuntu-latest
    needs: [validate, cleanup-applications, destroy-infrastructure]
    if: github.event_name == 'workflow_dispatch' && always()
    steps:
      - name: Generate summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🗑️ Environment Destroyed: ${{ inputs.environment_name }}

          ## Destruction Report

          | Resource Category | Status |
          |------------------|--------|
          | **Applications** | |
          | Cloud Run Service | ${{ needs.cleanup-applications.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | Cloud Function | ${{ needs.cleanup-applications.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | Firebase App Hosting Backend | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | **Storage** | |
          | User Data Bucket | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | Catalog Bucket | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | Firebase Storage Bucket | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | Artifact Registry Repository | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | **Messaging** | |
          | Pub/Sub Topics & Subscriptions | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | **Database** | |
          | Firestore Database | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | **AI/ML** | |
          | RAG Corpora (2) | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | **IAM & Security** | |
          | Service Accounts (2) | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | Workload Identity Pool & Provider | ${{ needs.destroy-infrastructure.result == 'success' && '✅ Deleted' || '⚠️ Check logs' }} |
          | **Project** | |
          | GCP Project | ${{ inputs.destroy_project == true && '✅ Deleted' || '➖ Preserved' }} |

          ## Environment Details

          - **Environment:** \`${{ inputs.environment_name }}\`
          - **Project:** \`${{ inputs.gcp_project_id }}\`
          - **Region:** \`${{ inputs.region }}\`
          - **Destroyed at:** $(date -u)

          ## Resources Cleaned

          The following resources were deleted:
          - Cloud Run service: \`homecare-agent-proxy-${{ inputs.environment_name }}\`
          - Cloud Function: \`pubsub_to_user_docs-${{ inputs.environment_name }}\`
          - Firebase App Hosting backend: \`${{ inputs.environment_name }}\`
          - Storage buckets: \`homegeek-user-data-${{ inputs.environment_name }}\`, \`homegeek-catalog-${{ inputs.environment_name }}\`, Firebase Storage
          - Artifact Registry: \`cloud-run-source-deploy\` (${{ inputs.region }})
          - Pub/Sub topics: \`user-upload-topic-${{ inputs.environment_name }}\`, \`user-upload-result-topic-${{ inputs.environment_name }}\`
          - Firestore database
          - RAG corpora: \`user-upload-rag-corpus-${{ inputs.environment_name }}\`, \`knowledge-base-rag-corpus-${{ inputs.environment_name }}\`
          - Service accounts: GitHub workflow deployment, Firebase App Hosting deployer
          - Workload Identity Pool and Provider

          ${{ inputs.destroy_project == false && '⚠️ **Note:** GCP project was preserved. You may want to manually delete it if no longer needed.' || '' }}

          ## Cleanup Complete

          All environment resources have been destroyed. The infrastructure is fully cleaned up.
          EOF
