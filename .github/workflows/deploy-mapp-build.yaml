name: Deploy Mapp - EAS Build

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "apps/mapp/**"
  #     - "apps/common/**"
  #     - ".github/workflows/deploy-mapp-build.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - staging
          - prod
      platform:
        description: "Select platform to build"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: "Build profile (leave empty to use environment default)"
        required: false
        type: string
      version:
        description: "App version (e.g., 1.0.0). Leave empty to auto-increment."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      platform: ${{ steps.set-platform.outputs.platform }}
      profile: ${{ steps.set-profile.outputs.profile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set platform
        id: set-platform
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
          else
            echo "platform=all" >> $GITHUB_OUTPUT
          fi

      - name: Set build profile
        id: set-profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.profile }}" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            echo "profile=${{ steps.set-env.outputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate GitHub Secrets
        run: |
          echo "Validating required GitHub secrets..."
          REQUIRED_SECRETS=("EXPO_TOKEN")
          MISSING_SECRETS=()

          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            MISSING_SECRETS+=("EXPO_TOKEN")
          fi

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "Error: Missing required GitHub secrets:"
            printf '%s\n' "${MISSING_SECRETS[@]}"
            exit 1
          fi

          echo "All required secrets are present"
          echo "Note: PROXY_TOKEN will be validated at the environment level in the build job"

  build:
    name: Build Mapp - ${{ needs.validate.outputs.profile }} (${{ needs.validate.outputs.platform }})
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Environment Configuration
        run: |
          echo "Validating environment-specific configuration..."
          MISSING_ITEMS=()

          # Check environment secrets
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            MISSING_ITEMS+=("EXPO_TOKEN (secret)")
          fi

          if [ -z "${{ secrets.PROXY_TOKEN }}" ]; then
            MISSING_ITEMS+=("PROXY_TOKEN (secret)")
          fi

          # Check environment variables
          if [ -z "${{ vars.EXPO_PROJECT_ID }}" ]; then
            MISSING_ITEMS+=("EXPO_PROJECT_ID (variable)")
          fi

          if [ -z "${{ vars.EXPO_ACCOUNT }}" ]; then
            MISSING_ITEMS+=("EXPO_ACCOUNT (variable)")
          fi

          if [ ${#MISSING_ITEMS[@]} -ne 0 ]; then
            echo "Error: Missing required environment configuration for '${{ needs.validate.outputs.environment }}' environment:"
            printf '%s\n' "${MISSING_ITEMS[@]}"
            echo ""
            echo "Please configure these in Settings → Environments → ${{ needs.validate.outputs.environment }}"
            exit 1
          fi

          echo "Environment configuration validated successfully"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm ci
          cd apps/mapp
          npm ci

      - name: Generate app version
        id: version
        run: |
          # Use manual version input if provided, otherwise auto-increment
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version: $VERSION"
          else
            VERSION="0.0.${{ github.run_number }}"
            echo "Using auto-incremented version: $VERSION"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build for iOS
        if: ${{ needs.validate.outputs.platform == 'ios' || needs.validate.outputs.platform == 'all' }}
        working-directory: apps/mapp
        run: |
          echo "Building iOS app for ${{ needs.validate.outputs.profile }} profile..."
          echo "App version: $APP_VERSION"
          echo "Expo Project ID: $EXPO_PROJECT_ID"
          eas build --platform ios --profile ${{ needs.validate.outputs.profile }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          APP_VERSION: ${{ env.APP_VERSION }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          # app.config.js → extra.tokenQuotaPeriodMaxTokens (UI fallback if /token-quota-status fails); optional
          TOKEN_QUOTA_PERIOD_MAX_TOKENS: ${{ vars.TOKEN_QUOTA_PERIOD_MAX_TOKENS }}

      - name: Build for Android
        if: ${{ needs.validate.outputs.platform == 'android' || needs.validate.outputs.platform == 'all' }}
        working-directory: apps/mapp
        run: |
          echo "Building Android app for ${{ needs.validate.outputs.profile }} profile..."
          echo "App version: $APP_VERSION"
          echo "Expo Project ID: $EXPO_PROJECT_ID"
          eas build --platform android --profile ${{ needs.validate.outputs.profile }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          APP_VERSION: ${{ env.APP_VERSION }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          # app.config.js → extra.tokenQuotaPeriodMaxTokens (UI fallback if /token-quota-status fails); optional
          TOKEN_QUOTA_PERIOD_MAX_TOKENS: ${{ vars.TOKEN_QUOTA_PERIOD_MAX_TOKENS }}

      - name: Summary
        run: |
          echo "### Build Triggered Successfully! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.validate.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ needs.validate.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ needs.validate.outputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ env.APP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check build status: https://expo.dev/accounts/${{ vars.EXPO_ACCOUNT }}/projects/homegeekai-$${{ needs.validate.outputs.environment }}/builds" >> $GITHUB_STEP_SUMMARY
