name: Deploy Mapp - EAS Build

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "apps/mapp/**"
  #     - "apps/common/**"
  #     - ".github/workflows/deploy-mapp-build.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - staging
          - prod
      platform:
        description: "Select platform to build"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: "Build profile (leave empty to use environment default)"
        required: false
        type: string
      version:
        description: "App version override (e.g., 1.0.0). Leave empty to use eas.json profile APP_VERSION."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      platform: ${{ steps.set-platform.outputs.platform }}
      profile: ${{ steps.set-profile.outputs.profile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set platform
        id: set-platform
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
          else
            echo "platform=all" >> $GITHUB_OUTPUT
          fi

      - name: Set build profile
        id: set-profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.profile }}" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            echo "profile=${{ steps.set-env.outputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate eas.json profile
        working-directory: apps/mapp
        env:
          PROFILE: ${{ steps.set-profile.outputs.profile }}
        run: |
          node -e "
            const fs = require('fs');
            const profile = process.env.PROFILE;
            const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            if (!eas.build?.[profile]) {
              console.error('Unknown EAS build profile:', profile);
              console.error('Valid profiles:', Object.keys(eas.build || {}).join(', '));
              process.exit(1);
            }
          "

      - name: Validate GitHub Secrets
        run: |
          echo "Validating required GitHub secrets..."
          REQUIRED_SECRETS=("EXPO_TOKEN")
          MISSING_SECRETS=()

          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            MISSING_SECRETS+=("EXPO_TOKEN")
          fi

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "Error: Missing required GitHub secrets:"
            printf '%s\n' "${MISSING_SECRETS[@]}"
            exit 1
          fi

          echo "All required secrets are present"

  build:
    name: Build Mapp - ${{ needs.validate.outputs.profile }} (${{ needs.validate.outputs.platform }})
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Environment Configuration
        run: |
          echo "Validating environment-specific configuration..."
          MISSING_ITEMS=()

          # Check environment secrets
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            MISSING_ITEMS+=("EXPO_TOKEN (secret)")
          fi

          if [ -z "${{ vars.EXPO_ACCOUNT }}" ]; then
            MISSING_ITEMS+=("EXPO_ACCOUNT (variable)")
          fi

          if [ ${#MISSING_ITEMS[@]} -ne 0 ]; then
            echo "Error: Missing required environment configuration for '${{ needs.validate.outputs.environment }}' environment:"
            printf '%s\n' "${MISSING_ITEMS[@]}"
            echo ""
            echo "Please configure these in Settings → Environments → ${{ needs.validate.outputs.environment }}"
            exit 1
          fi

          echo "Environment configuration validated successfully"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm ci
          cd apps/mapp
          npm ci

      - name: Build shared package
        run: npm run build --workspace=@homeapp/common

      - name: Load environment variables from eas.json
        id: eas-env
        working-directory: apps/mapp
        run: |
          PROFILE="${{ needs.validate.outputs.profile }}"
          echo "Loading environment variables from eas.json for profile: $PROFILE"

          APP_ENV=$(node -pe "require('./eas.json').build['$PROFILE'].env.APP_ENV")
          PROXY_BASE_URL=$(node -pe "require('./eas.json').build['$PROFILE'].env.PROXY_BASE_URL")
          WEB_APP_URL=$(node -pe "require('./eas.json').build['$PROFILE'].env.WEB_APP_URL")
          APP_SLUG=$(node -pe "require('./eas.json').build['$PROFILE'].env.APP_SLUG")
          EXPO_PROJECT_ID=$(node -pe "require('./eas.json').build['$PROFILE'].env.EXPO_PROJECT_ID")
          APP_VERSION=$(node -pe "require('./eas.json').build['$PROFILE'].env.APP_VERSION || '0.0.1'")

          echo "APP_ENV=$APP_ENV" >> $GITHUB_ENV
          echo "PROXY_BASE_URL=$PROXY_BASE_URL" >> $GITHUB_ENV
          echo "WEB_APP_URL=$WEB_APP_URL" >> $GITHUB_ENV
          echo "APP_SLUG=$APP_SLUG" >> $GITHUB_ENV
          echo "EXPO_PROJECT_ID=$EXPO_PROJECT_ID" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          echo "Loaded environment variables:"
          echo "  APP_ENV: $APP_ENV"
          echo "  PROXY_BASE_URL: $PROXY_BASE_URL"
          echo "  WEB_APP_URL: $WEB_APP_URL"
          echo "  APP_SLUG: $APP_SLUG"
          echo "  EXPO_PROJECT_ID: $EXPO_PROJECT_ID"
          echo "  APP_VERSION: $APP_VERSION"

      - name: Set app version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version from workflow input: $VERSION"
            echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          else
            echo "Using APP_VERSION from eas.json profile: $APP_VERSION"
          fi
          echo "version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Build for iOS
        if: ${{ needs.validate.outputs.platform == 'ios' || needs.validate.outputs.platform == 'all' }}
        working-directory: apps/mapp
        run: |
          echo "Building iOS app for ${{ needs.validate.outputs.profile }} profile..."
          echo "Environment: $APP_ENV"
          echo "App version: $APP_VERSION"
          echo "App slug: $APP_SLUG"
          echo "Expo Project ID: $EXPO_PROJECT_ID"
          echo "Proxy Base URL: $PROXY_BASE_URL"
          eas build --platform ios --profile ${{ needs.validate.outputs.profile }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: ${{ env.APP_ENV }}
          APP_SLUG: ${{ env.APP_SLUG }}
          PROXY_BASE_URL: ${{ env.PROXY_BASE_URL }}
          WEB_APP_URL: ${{ env.WEB_APP_URL }}
          APP_VERSION: ${{ env.APP_VERSION }}
          EXPO_PROJECT_ID: ${{ env.EXPO_PROJECT_ID }}

      - name: Build for Android
        if: ${{ needs.validate.outputs.platform == 'android' || needs.validate.outputs.platform == 'all' }}
        working-directory: apps/mapp
        run: |
          echo "Building Android app for ${{ needs.validate.outputs.profile }} profile..."
          echo "Environment: $APP_ENV"
          echo "App version: $APP_VERSION"
          echo "App slug: $APP_SLUG"
          echo "Expo Project ID: $EXPO_PROJECT_ID"
          echo "Proxy Base URL: $PROXY_BASE_URL"
          eas build --platform android --profile ${{ needs.validate.outputs.profile }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: ${{ env.APP_ENV }}
          APP_SLUG: ${{ env.APP_SLUG }}
          PROXY_BASE_URL: ${{ env.PROXY_BASE_URL }}
          WEB_APP_URL: ${{ env.WEB_APP_URL }}
          APP_VERSION: ${{ env.APP_VERSION }}
          EXPO_PROJECT_ID: ${{ env.EXPO_PROJECT_ID }}

      - name: Summary
        run: |
          echo "### Build Triggered Successfully! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.validate.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ needs.validate.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ needs.validate.outputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ env.APP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check build status: https://expo.dev/accounts/${{ vars.EXPO_ACCOUNT }}/projects/${{ env.APP_SLUG }}/builds" >> $GITHUB_STEP_SUMMARY
