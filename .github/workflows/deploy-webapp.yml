name: Deploy WebApp to Firebase App Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'apps/webapp/**'
      - '.github/workflows/deploy-webapp.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase App Hosting
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/webapp

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/webapp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck
        continue-on-error: true

      - name: Build Application
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy to Firebase App Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: goggle-gab
          BACKEND_ID: studio
        run: |
          # Set Firebase project
          firebase use $PROJECT_ID --token $FIREBASE_TOKEN

          # Create a new rollout for the App Hosting backend
          firebase apphosting:rollouts:create $BACKEND_ID \
            --project $PROJECT_ID \
            --token $FIREBASE_TOKEN

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Your webapp is available at: https://studio--goggle-gab.us-central1.hosted.app"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed. Please check the logs above for details."
          exit 1
