name: Update GCP VM

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (e.g., demo, staging, prod)"
        required: true
        default: "demo"
      zone:
        description: "GCP zone where the VM is located (e.g., us-central1-a)"
        required: true
        default: "us-central1-a"

jobs:
  update-vm:
    name: Update GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Update VM
        run: |
          gcloud compute ssh 'homegeek${{ github.event.inputs.environment }}' \
            --zone "${{ github.event.inputs.zone }}" \
            --command "
              cd HomeAMA &&
              cp .env.${{ github.event.inputs.environment }} .env &&
              git pull origin main &&
              docker-compose down &&
              docker-compose up -d
            "