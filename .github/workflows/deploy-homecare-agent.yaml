name: Deploy Homecare Agent Engine

on:
  push:
    branches:
      - main
    paths:
      - "gcp/agents/homecare/deployment/**"
      - "gcp/agents/homecare/property_agent/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      action:
        description: "Deployment action (create or update)"
        required: true
        default: "update"
        type: choice
        options:
          - create
          - update

env:
  GOOGLE_GENAI_USE_VERTEXAI: 1
  GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_REGION }}
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
  DEPLOY_SCRIPT_PATH: deployment/deploy.py
  WORKING_DIRECTORY: gcp/agents/homecare

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment ||  'staging' }}
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub variables
        run: |
          missing_vars=()

          if [ -z "${{ vars.GCP_REGION }}" ]; then
            missing_vars+=("GCP_REGION")
          fi

          if [ -z "${{ vars.PYTHON_VERSION }}" ]; then
            missing_vars+=("PYTHON_VERSION")
          fi

          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            missing_vars+=("GCP_PROJECT_ID")
          fi

          if [ -z "${{ vars.GCP_PROJECT_NUMBER }}" ]; then
            missing_vars+=("GCP_PROJECT_NUMBER")
          fi

          if [ -z "${{ vars.AGENT_STAGING_BUCKET }}" ]; then
            missing_vars+=("AGENT_STAGING_BUCKET")
          fi

          if [ -z "${{ vars.REASONING_ENGINE_ID }}" ]; then
            missing_vars+=("REASONING_ENGINE_ID")
          fi

          if [ -z "${{ vars.GCS_BUCKET }}" ]; then
            missing_vars+=("GCS_BUCKET")
          fi

          if [ -z "${{ vars.USER_UPLOAD_FOLDER }}" ]; then
            missing_vars+=("USER_UPLOAD_FOLDER")
          fi

          if [ -z "${{ vars.USER_UPLOAD_RAG_CORPUS }}" ]; then
            missing_vars+=("USER_UPLOAD_RAG_CORPUS")
          fi

          if [ -z "${{ vars.KNOWLEDGE_BASE_RAG_CORPUS }}" ]; then
            missing_vars+=("KNOWLEDGE_BASE_RAG_CORPUS")
          fi

          if [ -z "${{ vars.USER_UPLOAD_TOPIC }}" ]; then
            missing_vars+=("USER_UPLOAD_TOPIC")
          fi

          if [ -z "${{ vars.YELP_URL }}" ]; then
            missing_vars+=("YELP_URL")
          fi

          if [ -z "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            missing_vars+=("WORKLOAD_IDENTITY_PROVIDER")
          fi

          if [ -z "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}" ]; then
            missing_vars+=("GCP_SERVICE_ACCOUNT_EMAIL")
          fi

          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub variables: ${missing_vars[*]}"
            echo "Please set the following variables in your GitHub repository settings:"
            printf '  - %s\n' "${missing_vars[@]}"
            exit 1
          fi

          echo "✓ All required GitHub variables are set"

      - name: Validate required GitHub secrets
        run: |
          missing_secrets=()

          if [ -z "${{ secrets.SERP_API_KEY }}" ]; then
            missing_secrets+=("SERP_API_KEY")
          fi

          if [ -z "${{ secrets.YELP_API_KEY }}" ]; then
            missing_secrets+=("YELP_API_KEY")
          fi

          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing_secrets[*]}"
            echo "Please set the following secrets in your GitHub repository settings:"
            printf '  - %s\n' "${missing_secrets[@]}"
            exit 1
          fi

          echo "✓ All required GitHub secrets are set"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set environment variables
        run: |
          CURRENT_ENVIRONMENT="${{ github.event.inputs.environment }}"
          DEPLOY_ACTION="${{ github.event.inputs.action }}"

          if [[ "$CURRENT_ENVIRONMENT" == "" ]]; then
              CURRENT_ENVIRONMENT="staging"
          fi

          if [[ "$DEPLOY_ACTION" == "" ]]; then
            DEPLOY_ACTION="update"
          fi

          echo "DEPLOY_ACTION=$DEPLOY_ACTION" >> $GITHUB_ENV
          echo "CURRENT_ENVIRONMENT=$CURRENT_ENVIRONMENT" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}" >> $GITHUB_ENV
          echo "STAGING_BUCKET=${{ vars.AGENT_STAGING_BUCKET }}" >> $GITHUB_ENV
          echo "AGENT_ENGINE_ID=projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/${{ vars.GCP_REGION }}/reasoningEngines/${{ vars.REASONING_ENGINE_ID }}" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_BUCKET=${{ vars.GCS_BUCKET }}" >> $GITHUB_ENV
          echo "USER_UPLOAD_FOLDER=${{ vars.USER_UPLOAD_FOLDER }}" >> $GITHUB_ENV
          echo "USER_UPLOAD_RAG_CORPUS=${{ vars.USER_UPLOAD_RAG_CORPUS }}" >> $GITHUB_ENV
          echo "KNOWLEDGE_BASE_RAG_CORPUS=${{ vars.KNOWLEDGE_BASE_RAG_CORPUS }}" >> $GITHUB_ENV
          echo "USER_UPLOAD_TOPIC=${{ vars.USER_UPLOAD_TOPIC }}" >> $GITHUB_ENV
          echo "YELP_URL=${{ vars.YELP_URL }}" >> $GITHUB_ENV
          echo "SERP_API_KEY=${{ secrets.SERP_API_KEY }}" >> $GITHUB_ENV
          echo "YELP_API_KEY=${{ secrets.YELP_API_KEY }}" >> $GITHUB_ENV

      - name: Verify secrets are set
        run: |
          echo "SERP_API_KEY starts with: ${SERP_API_KEY:0:3}..."
          echo "YELP_API_KEY starts with: ${YELP_API_KEY:0:3}..."
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          YELP_API_KEY: ${{ secrets.YELP_API_KEY }}

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Run deployment script
        run: uv run python ${{ env.DEPLOY_SCRIPT_PATH }} ${{ env.DEPLOY_ACTION }} ${{ env.CURRENT_ENVIRONMENT }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
