name: Deploy Report Generation Function

on:
  push:
    branches:
      - apps/report
    paths:
      - "gcp/proxy/workers/function/report_generation/**"
      - "gcp/common/token/**"
      - "gcp/common/report/**"
      - ".github/workflows/deploy-report-generation.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      FUNCTION_NAME_BASE: pubsub-report-generation
      RUNTIME: python313
      ENTRY_POINT: pubsub_to_report_generation
      MAX_INSTANCES: 10
      CONCURRENCY: 1
      MEMORY: 2048Mi
      SOURCE_DIRECTORY: gcp/proxy/workers/function/report_generation
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub variables
        run: |
          missing_vars=()

          if [ -z "${{ vars.GCP_REGION }}" ]; then
            missing_vars+=("GCP_REGION")
          fi

          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            missing_vars+=("GCP_PROJECT_ID")
          fi

          if [ -z "${{ vars.REPORT_GENERATION_TOPIC }}" ]; then
            missing_vars+=("REPORT_GENERATION_TOPIC")
          fi

          if [ -z "${{ vars.GCS_BUCKET }}" ]; then
            missing_vars+=("GCS_BUCKET")
          fi

          if [ -z "${{ vars.USER_UPLOAD_TOPIC }}" ]; then
            missing_vars+=("USER_UPLOAD_TOPIC")
          fi

          if [ -z "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            missing_vars+=("WORKLOAD_IDENTITY_PROVIDER")
          fi

          if [ -z "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}" ]; then
            missing_vars+=("GCP_SERVICE_ACCOUNT_EMAIL")
          fi

          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub variables: ${missing_vars[*]}"
            printf '  - %s\n' "${missing_vars[@]}"
            exit 1
          fi

          echo "✓ All required GitHub variables are set"

      - name: Set environment variables
        run: |
          echo "REGION=${{ vars.GCP_REGION }}" >> $GITHUB_ENV
          echo "FUNCTION_NAME=${{ env.FUNCTION_NAME_BASE }}-${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_ENV
          echo "TRIGGER_TOPIC=projects/${{ vars.GCP_PROJECT_ID }}/topics/${{ vars.REPORT_GENERATION_TOPIC }}" >> $GITHUB_ENV

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"

      - name: Prepare shared modules (sync gcp/common → function source)
        shell: bash
        run: |
          set -euo pipefail
          DST_COMMON_DIR="${{ env.SOURCE_DIRECTORY }}/common"
          mkdir -p "${DST_COMMON_DIR}"
          if [ ! -f "${DST_COMMON_DIR}/__init__.py" ]; then
            echo "# Shared modules synced at deploy time." > "${DST_COMMON_DIR}/__init__.py"
          fi
          rsync -a --delete gcp/common/token/ "${DST_COMMON_DIR}/token/"
          echo "✓ Synced gcp/common/token -> ${DST_COMMON_DIR}/token"
          rsync -a --delete gcp/common/report/ "${DST_COMMON_DIR}/report/"
          echo "✓ Synced gcp/common/report -> ${DST_COMMON_DIR}/report"

      - name: Bundle Playwright Chromium (linux/amd64 for Cloud Functions)
        run: bash "${{ env.SOURCE_DIRECTORY }}/scripts/install-playwright-browsers.sh"

      - name: Deploy Cloud Function
        id: deploy
        uses: "google-github-actions/deploy-cloud-functions@v3"
        with:
          name: ${{ env.FUNCTION_NAME }}
          runtime: ${{ env.RUNTIME }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          entry_point: ${{ env.ENTRY_POINT }}
          source_dir: ${{ env.SOURCE_DIRECTORY }}
          max_instance_count: ${{ env.MAX_INSTANCES }}
          max_instance_request_concurrency: ${{ env.CONCURRENCY }}
          memory: ${{ env.MEMORY }}
          event_trigger_type: google.cloud.pubsub.topic.v1.messagePublished
          event_trigger_pubsub_topic: ${{ env.TRIGGER_TOPIC }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          environment_variables: |
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ vars.GCP_REGION }}
            GOOGLE_CLOUD_BUCKET=${{ vars.GCS_BUCKET }}
            GCS_BUCKET_NAME=${{ vars.GCS_BUCKET }}
            USER_UPLOAD_TOPIC=${{ vars.USER_UPLOAD_TOPIC }}
            REPORT_PDF_RENDERER=playwright
            PLAYWRIGHT_BROWSERS_PATH=/workspace/ms-playwright

      # Match other Pub/Sub workers (e.g. checkpoint analysis): allow Eventarc delivery
      # without per-invoker IAM bindings on the underlying Cloud Run service.
      - name: Allow Pub/Sub trigger invocations
        run: |
          gcloud run services update "${{ env.FUNCTION_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --update-annotations=run.googleapis.com/invoker-iam-disabled=true
