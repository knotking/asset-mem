name: Nightly Homecare Conformance Replay

# ADK replay against committed generated-recordings.yaml (staging creds when live).
# Manual only (workflow_dispatch) — see AGENT_TESTING_STRATEGY.md Phase 3.

on:
  workflow_dispatch:

env:
  WORKING_DIRECTORY: gcp/agents/homecare
  PYTHON_VERSION: "3.11"
  GOOGLE_GENAI_USE_VERTEXAI: 1

jobs:
  conformance-replay:
    name: Conformance replay (ADK)
    runs-on: ubuntu-latest
    environment: staging
    continue-on-error: true # alert-only until recordings + pass-rate gate
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "gcp/agents/homecare/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run conformance replay
        run: make conformance-test
        env:
          HOMEAPP_ADK_CONFORMANCE_PLUGINS: replay
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_REGION }}

      - name: Note when no recordings
        if: always()
        run: |
          echo "Replay skips cases without generated-recordings.yaml."
          echo "Record locally: make conformance-record (requires uv run adk web)."
