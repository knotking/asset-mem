name: Deploy PubSub to User Docs Function

on:
  push:
    branches:
      - main
    paths:
      - "gcp/proxy/workers/function/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

env:
  REGION: ${{ vars.GCP_REGION }}
  FUNCTION_NAME_BASE: pubsub-to-user-docs
  RUNTIME: python313
  ENTRY_POINT: pubsub_to_user_docs
  MAX_INSTANCES: 1
  CONCURRENCY: 1
  MEMORY: 512Mi
  SOURCE_DIRECTORY: gcp/proxy/workers/function

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment ||  'staging' }}
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub variables
        run: |
          missing_vars=()

          if [ -z "${{ vars.GCP_REGION }}" ]; then
            missing_vars+=("GCP_REGION")
          fi

          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            missing_vars+=("GCP_PROJECT_ID")
          fi

          if [ -z "${{ vars.USER_UPLOAD_TOPIC }}" ]; then
            missing_vars+=("USER_UPLOAD_TOPIC")
          fi

          if [ -z "${{ vars.USER_UPLOAD_RESULT_TOPIC }}" ]; then
            missing_vars+=("USER_UPLOAD_RESULT_TOPIC")
          fi

          if [ -z "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            missing_vars+=("WORKLOAD_IDENTITY_PROVIDER")
          fi

          if [ -z "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}" ]; then
            missing_vars+=("GCP_SERVICE_ACCOUNT_EMAIL")
          fi

          if [ -z "${{ vars.GCS_BUCKET }}" ]; then
            missing_vars+=("GCS_BUCKET")
          fi

          if [ -z "${{ vars.USER_UPLOAD_RAG_CORPUS }}" ]; then
            missing_vars+=("USER_UPLOAD_RAG_CORPUS")
          fi

          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub variables: ${missing_vars[*]}"
            echo "Please set the following variables in your GitHub repository settings:"
            printf '  - %s\n' "${missing_vars[@]}"
            exit 1
          fi

          echo "✓ All required GitHub variables are set"

      - name: Set environment variables
        run: |
          echo "FUNCTION_NAME=${{ env.FUNCTION_NAME_BASE }}-${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_ENV
          echo "TRIGGER_TOPIC=projects/${{ vars.GCP_PROJECT_ID }}/topics/${{ vars.USER_UPLOAD_TOPIC }}" >> $GITHUB_ENV
          echo "USER_UPLOAD_RESULT_TOPIC_PATH=projects/${{ vars.GCP_PROJECT_ID }}/topics/${{ vars.USER_UPLOAD_RESULT_TOPIC }}" >> $GITHUB_ENV

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"

      - name: Deploy Cloud Function
        id: deploy
        uses: "google-github-actions/deploy-cloud-functions@v3"
        with:
          name: ${{ env.FUNCTION_NAME }}
          runtime: ${{ env.RUNTIME }}
          region: ${{ env.REGION }}
          entry_point: ${{ env.ENTRY_POINT }}
          source_dir: ${{ env.SOURCE_DIRECTORY }}
          max_instance_count: ${{ env.MAX_INSTANCES }}
          max_instance_request_concurrency: ${{ env.CONCURRENCY }}
          memory: ${{ env.MEMORY }}
          event_trigger_type: google.cloud.pubsub.topic.v1.messagePublished
          event_trigger_pubsub_topic: ${{ env.TRIGGER_TOPIC }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          environment_variables: |
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_REGION=${{ env.REGION }}
            GCS_BUCKET=${{ vars.GCS_BUCKET }}
            USER_UPLOAD_RESULT_TOPIC=${{ env.USER_UPLOAD_RESULT_TOPIC_PATH }}
            RAG_CORPUS=${{ vars.USER_UPLOAD_RAG_CORPUS }}
