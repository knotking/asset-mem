name: Test Webapp

on:
  push:
    branches:
      - main
    paths:
      - "apps/webapp/**"
      - ".github/workflows/test-webapp.yaml"
  pull_request:
    paths:
      - "apps/webapp/**"
      - ".github/workflows/test-webapp.yaml"

jobs:
  lint:
    name: Lint and guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint (includes no @homeapp/common imports)
        run: npm run lint --workspace=nextn

      - name: Verify no @homeapp/common imports
        working-directory: apps/webapp
        run: bash scripts/check-no-common-imports.sh

      - name: Typecheck
        run: npm run typecheck --workspace=nextn
