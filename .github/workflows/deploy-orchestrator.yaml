name: Deploy Orchestrator

# Triggers selected deploy-*.yaml workflows via the Actions API.
# Child workflows use the branch from "Use workflow from" (github.ref_name).
# GitHub allows 10 workflow_dispatch inputs: environment + nine workflow checkboxes.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for selected deploy workflows"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      deploy_homecare_agent:
        description: "Backend — Vertex AI homecare agent (action=update; run deploy-homecare-agent.yaml alone for create)"
        required: false
        default: false
        type: boolean
      deploy_homecare_agent_proxy:
        description: "Backend — Cloud Run homecare agent proxy"
        required: false
        default: false
        type: boolean
      deploy_checkpoint_analysis:
        description: "Workers — checkpoint analysis Cloud Function"
        required: false
        default: false
        type: boolean
      deploy_checkpoint_metrics:
        description: "Workers — checkpoint metrics Cloud Function"
        required: false
        default: false
        type: boolean
      deploy_document_analysis:
        description: "Workers — document analysis Cloud Function"
        required: false
        default: false
        type: boolean
      deploy_pubsub_user_docs:
        description: "Workers — Pub/Sub user docs Cloud Function"
        required: false
        default: false
        type: boolean
      deploy_report_generation:
        description: "Workers — report generation Cloud Function"
        required: false
        default: false
        type: boolean
      deploy_webapp:
        description: "Frontend — Firebase App Hosting webapp"
        required: false
        default: false
        type: boolean
      deploy_mapp_update:
        description: "Frontend — EAS OTA update"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-orchestrator-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger selected deploy workflows
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch child workflows
        uses: actions/github-script@v7
        id: dispatch
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
          GIT_REF: ${{ github.ref_name }}
          FLAG_AGENT: ${{ github.event.inputs.deploy_homecare_agent }}
          FLAG_PROXY: ${{ github.event.inputs.deploy_homecare_agent_proxy }}
          FLAG_CP_ANALYSIS: ${{ github.event.inputs.deploy_checkpoint_analysis }}
          FLAG_CP_METRICS: ${{ github.event.inputs.deploy_checkpoint_metrics }}
          FLAG_DOC_ANALYSIS: ${{ github.event.inputs.deploy_document_analysis }}
          FLAG_USER_DOCS: ${{ github.event.inputs.deploy_pubsub_user_docs }}
          FLAG_REPORT_GENERATION: ${{ github.event.inputs.deploy_report_generation }}
          FLAG_WEBAPP: ${{ github.event.inputs.deploy_webapp }}
          FLAG_MAPP_UPDATE: ${{ github.event.inputs.deploy_mapp_update }}
        with:
          script: |
            const env = process.env.DEPLOY_ENV;
            const ref = process.env.GIT_REF;
            const flag = (name) => process.env[name] === 'true';

            const workflows = [
              {
                key: 'agent',
                group: 'Backend',
                enabled: flag('FLAG_AGENT'),
                id: 'deploy-homecare-agent.yaml',
                label: 'Homecare Agent',
                inputs: { environment: env, action: 'update' },
              },
              {
                key: 'proxy',
                group: 'Backend',
                enabled: flag('FLAG_PROXY'),
                id: 'deploy-homecare-agent-proxy.yaml',
                label: 'Homecare Agent Proxy',
                inputs: { environment: env },
              },
              {
                key: 'checkpoint-analysis',
                group: 'Workers',
                enabled: flag('FLAG_CP_ANALYSIS'),
                id: 'deploy-checkpoint-analysis.yaml',
                label: 'Checkpoint Analysis',
                inputs: { environment: env },
              },
              {
                key: 'checkpoint-metrics',
                group: 'Workers',
                enabled: flag('FLAG_CP_METRICS'),
                id: 'deploy-checkpoint-metrics.yaml',
                label: 'Checkpoint Metrics',
                inputs: { environment: env },
              },
              {
                key: 'document-analysis',
                group: 'Workers',
                enabled: flag('FLAG_DOC_ANALYSIS'),
                id: 'deploy-document-analysis.yaml',
                label: 'Document Analysis',
                inputs: { environment: env },
              },
              {
                key: 'user-docs',
                group: 'Workers',
                enabled: flag('FLAG_USER_DOCS'),
                id: 'deploy-pubsub-user-docs.yaml',
                label: 'Pub/Sub User Docs',
                inputs: { environment: env },
              },
              {
                key: 'report-generation',
                group: 'Workers',
                enabled: flag('FLAG_REPORT_GENERATION'),
                id: 'deploy-report-generation.yaml',
                label: 'Report Generation',
                inputs: { environment: env },
              },
              {
                key: 'webapp',
                group: 'Frontend',
                enabled: flag('FLAG_WEBAPP'),
                id: 'deploy-webapp-apphosting.yaml',
                label: 'Webapp App Hosting',
                inputs: { environment: env },
              },
              {
                key: 'mapp-update',
                group: 'Frontend',
                enabled: flag('FLAG_MAPP_UPDATE'),
                id: 'deploy-mapp-update.yaml',
                label: 'Mapp EAS Update',
                inputs: { environment: env },
              },
            ];

            const toRun = workflows.filter((w) => w.enabled);
            if (toRun.length === 0) {
              core.setFailed('No workflows selected. Enable at least one deploy checkbox.');
              return;
            }

            core.info(`Environment: ${env}, ref (Use workflow from): ${ref}`);
            for (const group of ['Backend', 'Workers', 'Frontend']) {
              const selected = toRun.filter((w) => w.group === group);
              if (selected.length) {
                core.info(`${group}: ${selected.map((w) => w.label).join(', ')}`);
              }
            }

            const triggered = [];
            for (const w of toRun) {
              core.info(`Dispatching ${w.id} (${w.label}) on ref ${ref}…`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: w.id,
                ref,
                inputs: w.inputs,
              });
              triggered.push(w);
            }

            const byGroup = (group) =>
              triggered.filter((w) => w.group === group).map((w) => w.label);

            core.summary.addHeading('Deploy orchestrator');
            core.summary.addTable([
              [{ data: 'Setting', header: true }, { data: 'Value', header: true }],
              ['Environment', env],
              ['Git ref (Use workflow from)', ref],
            ]);
            for (const group of ['Backend', 'Workers', 'Frontend']) {
              const labels = byGroup(group);
              if (labels.length) {
                core.summary.addRaw(`\n**${group}:** ${labels.join(', ')}\n`);
              }
            }
            core.summary.addHeading('Triggered workflows', 3);
            core.summary.addTable([
              [
                { data: 'Group', header: true },
                { data: 'Workflow file', header: true },
                { data: 'Name', header: true },
              ],
              ...triggered.map((t) => [t.group, t.id, t.label]),
            ]);
            core.summary.addRaw(
              '\nOpen the [Actions](https://github.com/' +
                context.repo.owner +
                '/' +
                context.repo.repo +
                '/actions) tab to monitor each run. Child workflows may require environment approval for prod.\n'
            );
            await core.summary.write();

            core.setOutput('count', String(triggered.length));
            core.setOutput('workflows', triggered.map((t) => t.id).join(','));
