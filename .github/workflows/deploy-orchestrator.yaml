name: Deploy Orchestrator

# Triggers selected deploy-*.yaml workflows via the Actions API.
# Each child run is independent (own logs, environment approvals, concurrency).
# Excludes create/destroy-environment and apply-operations-config (different inputs).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for all selected deploy workflows"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      git_ref:
        description: "Git ref (branch or tag) child workflows run against"
        required: true
        default: main
        type: string
      deploy_preset:
        description: "Quick-select a group; use Custom to pick individual workflows below"
        required: true
        default: custom
        type: choice
        options:
          - custom
          - all
          - backend
          - workers
          - frontend
      deploy_homecare_agent:
        description: "Vertex AI homecare agent (deploy-homecare-agent.yaml)"
        required: false
        default: false
        type: boolean
      deploy_homecare_agent_proxy:
        description: "Cloud Run proxy (deploy-homecare-agent-proxy.yaml)"
        required: false
        default: false
        type: boolean
      deploy_webapp:
        description: "Firebase App Hosting webapp (deploy-webapp-apphosting.yaml)"
        required: false
        default: false
        type: boolean
      deploy_checkpoint_analysis:
        description: "Checkpoint analysis worker (deploy-checkpoint-analysis.yaml)"
        required: false
        default: false
        type: boolean
      deploy_checkpoint_metrics:
        description: "Checkpoint metrics worker (deploy-checkpoint-metrics.yaml)"
        required: false
        default: false
        type: boolean
      deploy_document_analysis:
        description: "Document analysis worker (deploy-document-analysis.yaml)"
        required: false
        default: false
        type: boolean
      deploy_pubsub_user_docs:
        description: "User docs Pub/Sub worker (deploy-pubsub-user-docs.yaml)"
        required: false
        default: false
        type: boolean
      deploy_mapp_build:
        description: "EAS native build (deploy-mapp-build.yaml)"
        required: false
        default: false
        type: boolean
      deploy_mapp_update:
        description: "EAS OTA update (deploy-mapp-update.yaml)"
        required: false
        default: false
        type: boolean
      agent_action:
        description: "Homecare agent deploy action (only when agent is selected)"
        required: true
        default: update
        type: choice
        options:
          - update
          - create
      mapp_platform:
        description: "Mapp EAS build platform (only when mapp build is selected)"
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-orchestrator-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger selected deploy workflows
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch child workflows
        uses: actions/github-script@v7
        id: dispatch
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
          GIT_REF: ${{ github.event.inputs.git_ref }}
          DEPLOY_PRESET: ${{ github.event.inputs.deploy_preset }}
          AGENT_ACTION: ${{ github.event.inputs.agent_action }}
          MAPP_PLATFORM: ${{ github.event.inputs.mapp_platform }}
          FLAG_AGENT: ${{ github.event.inputs.deploy_homecare_agent }}
          FLAG_PROXY: ${{ github.event.inputs.deploy_homecare_agent_proxy }}
          FLAG_WEBAPP: ${{ github.event.inputs.deploy_webapp }}
          FLAG_CP_ANALYSIS: ${{ github.event.inputs.deploy_checkpoint_analysis }}
          FLAG_CP_METRICS: ${{ github.event.inputs.deploy_checkpoint_metrics }}
          FLAG_DOC_ANALYSIS: ${{ github.event.inputs.deploy_document_analysis }}
          FLAG_USER_DOCS: ${{ github.event.inputs.deploy_pubsub_user_docs }}
          FLAG_MAPP_BUILD: ${{ github.event.inputs.deploy_mapp_build }}
          FLAG_MAPP_UPDATE: ${{ github.event.inputs.deploy_mapp_update }}
        with:
          script: |
            const preset = process.env.DEPLOY_PRESET;
            const env = process.env.DEPLOY_ENV;
            const ref = process.env.GIT_REF;
            const agentAction = process.env.AGENT_ACTION;
            const mappPlatform = process.env.MAPP_PLATFORM;

            const flag = (name) => process.env[name] === 'true';

            const workflows = [
              {
                id: 'deploy-homecare-agent.yaml',
                label: 'Homecare Agent',
                group: 'backend',
                customFlag: flag('FLAG_AGENT'),
                inputs: { environment: env, action: agentAction },
              },
              {
                id: 'deploy-homecare-agent-proxy.yaml',
                label: 'Homecare Agent Proxy',
                group: 'backend',
                customFlag: flag('FLAG_PROXY'),
                inputs: { environment: env },
              },
              {
                id: 'deploy-checkpoint-analysis.yaml',
                label: 'Checkpoint Analysis',
                group: 'workers',
                customFlag: flag('FLAG_CP_ANALYSIS'),
                inputs: { environment: env },
              },
              {
                id: 'deploy-checkpoint-metrics.yaml',
                label: 'Checkpoint Metrics',
                group: 'workers',
                customFlag: flag('FLAG_CP_METRICS'),
                inputs: { environment: env },
              },
              {
                id: 'deploy-document-analysis.yaml',
                label: 'Document Analysis',
                group: 'workers',
                customFlag: flag('FLAG_DOC_ANALYSIS'),
                inputs: { environment: env },
              },
              {
                id: 'deploy-pubsub-user-docs.yaml',
                label: 'Pub/Sub User Docs',
                group: 'workers',
                customFlag: flag('FLAG_USER_DOCS'),
                inputs: { environment: env },
              },
              {
                id: 'deploy-webapp-apphosting.yaml',
                label: 'Webapp App Hosting',
                group: 'frontend',
                customFlag: flag('FLAG_WEBAPP'),
                inputs: { environment: env },
              },
              {
                id: 'deploy-mapp-build.yaml',
                label: 'Mapp EAS Build',
                group: 'frontend',
                customFlag: flag('FLAG_MAPP_BUILD'),
                inputs: { environment: env, platform: mappPlatform },
              },
              {
                id: 'deploy-mapp-update.yaml',
                label: 'Mapp EAS Update',
                group: 'frontend',
                customFlag: flag('FLAG_MAPP_UPDATE'),
                inputs: { environment: env },
              },
            ];

            const presetGroups = {
              all: ['backend', 'workers', 'frontend'],
              backend: ['backend'],
              workers: ['workers'],
              frontend: ['frontend'],
            };

            function selected(w) {
              if (preset === 'custom') return w.customFlag;
              const groups = presetGroups[preset];
              if (!groups) return w.customFlag;
              return groups.includes(w.group);
            }

            const toRun = workflows.filter(selected);
            if (toRun.length === 0) {
              core.setFailed(
                'No workflows selected. Set deploy_preset to a group or enable at least one workflow (custom preset).'
              );
              return;
            }

            core.info(`Environment: ${env}, ref: ${ref}, preset: ${preset}`);
            const triggered = [];

            for (const w of toRun) {
              core.info(`Dispatching ${w.id} (${w.label})…`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: w.id,
                ref,
                inputs: w.inputs,
              });
              triggered.push({ id: w.id, label: w.label });
            }

            core.summary.addHeading('Deploy orchestrator');
            core.summary.addTable([
              [{ data: 'Setting', header: true }, { data: 'Value', header: true }],
              ['Environment', env],
              ['Git ref', ref],
              ['Preset', preset],
            ]);
            core.summary.addHeading('Triggered workflows', 3);
            core.summary.addTable([
              [{ data: 'Workflow file', header: true }, { data: 'Name', header: true }],
              ...triggered.map((t) => [t.id, t.label]),
            ]);
            core.summary.addRaw(
              '\nOpen the [Actions](https://github.com/' +
                context.repo.owner +
                '/' +
                context.repo.repo +
                '/actions) tab to monitor each run. Child workflows may require environment approval for prod.\n'
            );
            await core.summary.write();

            core.setOutput('count', String(triggered.length));
            core.setOutput(
              'workflows',
              triggered.map((t) => t.id).join(',')
            );
