name: Deploy Homecare Agent Proxy

on:
  push:
    branches:
      - main
      - deploy
    paths:
      - "gcp/proxy/api/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

env:
  REGION: us-central1
  SERVICE_NAME: homecare-agent-proxy
  USER_UPLOAD_TOPIC: user-upload-topic
  USER_UPLOAD_RESULT_SUBSCRIPTION: user-upload-result-subscription
  GCS_BUCKET: homegeek-user-data

  # Environment specific variables
  STAGING_PROJECT_ID: homegeekdemo # Replace with your staging project ID
  STAGING_SERVICE_ACCOUNT_EMAIL: githubworkflowdeployment@homegeekdemo.iam.gserviceaccount.com # Replace with your staging service account
  STAGING_REASONING_ENGINE_ID: new # Replace with your staging reasoning engine ID

  PROD_PROJECT_ID: homegeekdemo # Replace with your production project ID
  PROD_SERVICE_ACCOUNT_EMAIL: githubworkflowdeployment@homegeekdemo.iam.gserviceaccount.com # Replace with your production service account
  PROD_REASONING_ENGINE_ID: new # Replace with your production reasoning engine ID

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          CURRENT_ENVIRONMENT="${{ github.event.inputs.environment }}"
          if [[ "$CURRENT_ENVIRONMENT" == "" ]]; then
            if [[ "${{ github.ref_name }}" == "deploy" ]]; then
              CURRENT_ENVIRONMENT="staging"
            else
              CURRENT_ENVIRONMENT="prod"
            fi
          fi

          ENV_SUFFIX=""
          if [[ "$CURRENT_ENVIRONMENT" == "staging" ]]; then
            ENV_SUFFIX="-staging"
            echo "GCP_PROJECT_ID=${{ env.STAGING_PROJECT_ID }}" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT_EMAIL=${{ env.STAGING_SERVICE_ACCOUNT_EMAIL }}" >> $GITHUB_ENV
            echo "REASONING_ENGINE_ID=${{ env.STAGING_REASONING_ENGINE_ID }}" >> $GITHUB_ENV
          else
            ENV_SUFFIX="-prod"
            echo "GCP_PROJECT_ID=${{ env.PROD_PROJECT_ID }}" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT_EMAIL=${{ env.PROD_SERVICE_ACCOUNT_EMAIL }}" >> $GITHUB_ENV
            echo "REASONING_ENGINE_ID=${{ env.PROD_REASONING_ENGINE_ID }}" >> $GITHUB_ENV
          fi
          echo "ENV_SUFFIX=$ENV_SUFFIX" >> $GITHUB_ENV
          echo "SERVICE_NAME=${{ env.SERVICE_NAME }}$ENV_SUFFIX" >> $GITHUB_ENV
          echo "USER_UPLOAD_TOPIC=${{ env.USER_UPLOAD_TOPIC }}$ENV_SUFFIX" >> $GITHUB_ENV
          echo "USER_UPLOAD_RESULT_SUBSCRIPTION=${{ env.USER_UPLOAD_RESULT_SUBSCRIPTION }}$ENV_SUFFIX" >> $GITHUB_ENV
          echo "GCS_BUCKET=${{ env.GCS_BUCKET }}$ENV_SUFFIX" >> $GITHUB_ENV

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "projects/1000000000000/locations/global/workloadIdentityPools/github-pool/providers/github-provider" # Replace with your Workload Identity Provider
          service_account: "${{ env.SERVICE_ACCOUNT_EMAIL }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: gcp/proxy/api # Path to the source directory for the service
          flags: "--allow-unauthenticated"
          env_vars: |
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GCP_REGION=${{ env.REGION }}
            REASONING_ENGINE_ID=${{ env.REASONING_ENGINE_ID }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
            FIREBASE_WEBHOOK_SECRET=${{ secrets.FIREBASE_WEBHOOK_SECRET }}
            USER_UPLOAD_TOPIC=${{ env.USER_UPLOAD_TOPIC }}
            USER_UPLOAD_RESULT_SUBSCRIPTION=${{ env.USER_UPLOAD_RESULT_SUBSCRIPTION }}
            GCS_BUCKET=${{ env.GCS_BUCKET }}
