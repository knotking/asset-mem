name: Deploy Homecare Agent Proxy

on:
  push:
    branches:
      - main
    paths:
      - "gcp/proxy/api/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME_BASE: homecare-agent-proxy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set service name
        run: |
          echo "SERVICE_NAME=${{ env.SERVICE_NAME_BASE }}-${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_ENV

      - name: Verify secrets are set
        run: |
          echo "TELEGRAM_BOT_TOKEN starts with: ${TELEGRAM_BOT_TOKEN:0:3}..."
          echo "TELEGRAM_WEBHOOK_SECRET starts with: ${TELEGRAM_WEBHOOK_SECRET:0:3}..."
          echo "FIREBASE_WEBHOOK_SECRET starts with: ${FIREBASE_WEBHOOK_SECRET:0:3}..."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          FIREBASE_WEBHOOK_SECRET: ${{ secrets.FIREBASE_WEBHOOK_SECRET }}

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: gcp/proxy/api # Path to the source directory for the service
          flags: "--allow-unauthenticated --service-account=${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"
          env_vars: |
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_REGION=${{ env.REGION }}
            REASONING_ENGINE_ID=${{ vars.REASONING_ENGINE_ID }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
            FIREBASE_WEBHOOK_SECRET=${{ secrets.FIREBASE_WEBHOOK_SECRET }}
            USER_UPLOAD_TOPIC=${{ vars.USER_UPLOAD_TOPIC }}
            USER_UPLOAD_RESULT_SUBSCRIPTION=${{ vars.USER_UPLOAD_RESULT_SUBSCRIPTION }}
            GCS_BUCKET=${{ vars.GCS_BUCKET }}
