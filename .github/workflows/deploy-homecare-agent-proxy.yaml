name: Deploy Homecare Agent Proxy

on:
  push:
    branches:
      - main
      - mapp_checkpoint_proxy_deployment
    paths:
      - "gcp/proxy/api/**"
      - "gcp/common/**"
      - "gcp/agent_framework/**"
      - ".github/workflows/deploy-homecare-agent-proxy.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME_BASE: homecare-agent-proxy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub variables
        run: |
          missing_vars=()

          if [ -z "${{ vars.GCP_REGION }}" ]; then
            missing_vars+=("GCP_REGION")
          fi

          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            missing_vars+=("GCP_PROJECT_ID")
          fi

          if [ -z "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            missing_vars+=("WORKLOAD_IDENTITY_PROVIDER")
          fi

          if [ -z "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}" ]; then
            missing_vars+=("GCP_SERVICE_ACCOUNT_EMAIL")
          fi

          if [ -z "${{ vars.REASONING_ENGINE_ID }}" ]; then
            missing_vars+=("REASONING_ENGINE_ID")
          fi

          if [ -z "${{ vars.USER_UPLOAD_TOPIC }}" ]; then
            missing_vars+=("USER_UPLOAD_TOPIC")
          fi

          if [ -z "${{ vars.USER_UPLOAD_RESULT_SUBSCRIPTION }}" ]; then
            missing_vars+=("USER_UPLOAD_RESULT_SUBSCRIPTION")
          fi

          if [ -z "${{ vars.GCS_BUCKET }}" ]; then
            missing_vars+=("GCS_BUCKET")
          fi

          if [ -z "${{ vars.CHECKPOINT_ANALYSIS_TOPIC }}" ]; then
            missing_vars+=("CHECKPOINT_ANALYSIS_TOPIC")
          fi

          if [ -z "${{ vars.CHECKPOINT_METRICS_TOPIC }}" ]; then
            missing_vars+=("CHECKPOINT_METRICS_TOPIC")
          fi

          if [ -z "${{ vars.DOCUMENT_ANALYSIS_TOPIC }}" ]; then
            missing_vars+=("DOCUMENT_ANALYSIS_TOPIC")
          fi

          if [ -z "${{ vars.REPORT_GENERATION_TOPIC }}" ]; then
            missing_vars+=("REPORT_GENERATION_TOPIC")
          fi

          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub variables: ${missing_vars[*]}"
            echo "Please set the following variables in your GitHub repository settings:"
            printf '  - %s\n' "${missing_vars[@]}"
            exit 1
          fi

          echo "✓ All required GitHub variables are set"

      - name: Validate required GitHub secrets
        run: |
          missing_secrets=()

          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            missing_secrets+=("TELEGRAM_BOT_TOKEN")
          fi

          if [ -z "${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" ]; then
            missing_secrets+=("TELEGRAM_WEBHOOK_SECRET")
          fi

          if [ -z "${{ secrets.FIREBASE_WEBHOOK_SECRET }}" ]; then
            missing_secrets+=("FIREBASE_WEBHOOK_SECRET")
          fi

          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing_secrets[*]}"
            echo "Please set the following secrets in your GitHub repository settings:"
            printf '  - %s\n' "${missing_secrets[@]}"
            exit 1
          fi

          echo "✓ All required GitHub secrets are set"

      - name: Set service name
        run: |
          echo "SERVICE_NAME=${{ env.SERVICE_NAME_BASE }}-${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_ENV

      - name: Verify secrets are set
        run: |
          echo "TELEGRAM_BOT_TOKEN starts with: ${TELEGRAM_BOT_TOKEN:0:3}..."
          echo "TELEGRAM_WEBHOOK_SECRET starts with: ${TELEGRAM_WEBHOOK_SECRET:0:3}..."
          echo "FIREBASE_WEBHOOK_SECRET starts with: ${FIREBASE_WEBHOOK_SECRET:0:3}..."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          FIREBASE_WEBHOOK_SECRET: ${{ secrets.FIREBASE_WEBHOOK_SECRET }}

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Stage gcp/common and slim agent_framework contracts (gitignored). .gcloudignore
      # forces these into the upload; proxy only needs message_patch_v1 + message_patch_types.
      - name: Stage gcp/common for Docker build
        run: rm -rf gcp/proxy/api/common && cp -R gcp/common gcp/proxy/api/common

      - name: Stage agent_framework contracts for Docker build
        run: bash gcp/proxy/scripts/stage-agent-framework-contracts.sh

      # STRIPE_B2C_PRICE_TOKEN_CAPS_JSON is base64 in env_vars (deploy-cloudrun uses comma delimiters).
      - name: Prepare STRIPE_B2C_PRICE_TOKEN_CAPS_JSON for deploy
        env:
          STRIPE_B2C_PRICE_TOKEN_CAPS_JSON_RAW: ${{ vars.STRIPE_B2C_PRICE_TOKEN_CAPS_JSON }}
        run: bash gcp/proxy/scripts/prepare-stripe-b2c-caps-github-env.sh

      - name: Deploy to Cloud Run
        id: deploy
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          source: gcp/proxy/api
          flags: "--allow-unauthenticated --service-account=${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"
          gcloud_version: latest
          env_vars: |
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_REGION=${{ env.REGION }}
            REASONING_ENGINE_ID=${{ vars.REASONING_ENGINE_ID }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
            FIREBASE_WEBHOOK_SECRET=${{ secrets.FIREBASE_WEBHOOK_SECRET }}
            USER_UPLOAD_TOPIC=${{ vars.USER_UPLOAD_TOPIC }}
            USER_UPLOAD_RESULT_SUBSCRIPTION=${{ vars.USER_UPLOAD_RESULT_SUBSCRIPTION }}
            GCS_BUCKET=${{ vars.GCS_BUCKET }}
            CHECKPOINT_ANALYSIS_TOPIC=${{ vars.CHECKPOINT_ANALYSIS_TOPIC }}
            CHECKPOINT_METRICS_TOPIC=${{ vars.CHECKPOINT_METRICS_TOPIC }}
            DOCUMENT_ANALYSIS_TOPIC=${{ vars.DOCUMENT_ANALYSIS_TOPIC }}
            REPORT_GENERATION_TOPIC=${{ vars.REPORT_GENERATION_TOPIC }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SIGNING_SECRET=${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}
            STRIPE_B2C_PRICE_TOKEN_CAPS_JSON=${{ env.STRIPE_B2C_PRICE_TOKEN_CAPS_JSON }}
            BILLING_PUBLIC_APP_BASE_URL=${{ vars.BILLING_PUBLIC_APP_BASE_URL }}

      # Firestore: Cloud Run uses vars.GCP_SERVICE_ACCOUNT_EMAIL at runtime. That SA needs
      # roles/datastore.user on the project. The workflow identity usually cannot call setIamPolicy;
      # create-environment.yaml grants datastore.user to githubworkflowdeployment@... — run that
      # workflow once or bind manually: gcloud projects add-iam-policy-binding PROJECT_ID \
      #   --member="serviceAccount:RUNTIME_SA" --role="roles/datastore.user"

      - name: Set IAM policy for public access
        continue-on-error: true
        run: |
          echo "Attempting to grant public access..."
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --project=${{ vars.GCP_PROJECT_ID }} || echo "⚠️  Organization policy prevents granting public access. You need to either: 1) Update org policy to allow allUsers, 2) Grant access to specific service accounts/users, or 3) Use a domain constraint like 'domain:yourdomain.com'"
