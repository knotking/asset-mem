name: Apply production hardware

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - staging
          - prod
      traffic_tier:
        description: "Hardware traffic tier"
        required: true
        default: "idle"
        type: choice
        options:
          - idle
          - ph
          - scale_10x
          - scale_100x
      mode:
        description: "audit = compare live GCP to tier; apply = render tier + orchestrate deploys"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - apply
      run_health_checks:
        description: "curl proxy /health and web origin after audit/apply"
        required: false
        default: true
        type: boolean
      skip_agent:
        description: "Skip deploy-homecare-agent (apply mode only)"
        required: false
        default: false
        type: boolean
      skip_webapp:
        description: "Skip deploy-webapp-apphosting (apply mode only)"
        required: false
        default: false
        type: boolean
      set_github_vars:
        description: "Persist tier to GitHub environment variables (needs admin)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  hardware:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      REPORT_PATH: hardware-audit-report-${{ inputs.traffic_tier }}.md
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          missing=()
          [ -z "${{ vars.GCP_PROJECT_ID }}" ] && missing+=("GCP_PROJECT_ID")
          [ -z "${{ vars.GCP_REGION }}" ] && missing+=("GCP_REGION")
          [ -z "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}" ] && missing+=("WORKLOAD_IDENTITY_PROVIDER")
          [ -z "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}" ] && missing+=("GCP_SERVICE_ACCOUNT_EMAIL")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub variables: ${missing[*]}"
            exit 1
          fi

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Apply hardware tier (orchestrate deploys)
        if: inputs.mode == 'apply'
        env:
          SKIP_AGENT: ${{ inputs.skip_agent }}
          SKIP_WEBAPP: ${{ inputs.skip_webapp }}
          SET_GITHUB_VARS: ${{ inputs.set_github_vars }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/apply-production-hardware.sh
          .github/scripts/apply-production-hardware.sh "${{ inputs.environment }}" "${{ inputs.traffic_tier }}"

      - name: Audit live hardware
        env:
          # apply: deploys succeeded — report drift without failing the workflow
          FAIL_ON_MISMATCH: ${{ inputs.mode == 'audit' && 'true' || 'false' }}
        run: |
          python3 -m pip install -q pyyaml
          chmod +x .github/scripts/verify-production-hardware.sh
          .github/scripts/verify-production-hardware.sh "${{ inputs.environment }}" "${{ inputs.traffic_tier }}"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-audit-${{ inputs.environment }}-${{ inputs.traffic_tier }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: ignore

      - name: Health checks
        if: inputs.run_health_checks && success()
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          if [ "$ENV" = "prod" ]; then
            WEB_URL="https://prod--${{ vars.GCP_PROJECT_ID }}.${{ vars.GCP_REGION }}.hosted.app"
          else
            WEB_URL="https://staging--${{ vars.GCP_PROJECT_ID }}.${{ vars.GCP_REGION }}.hosted.app"
          fi
          PROXY_URL="${{ vars.PROXY_HEALTH_URL }}"
          if [ -z "$PROXY_URL" ]; then
            PROXY_URL="https://homecare-agent-proxy-${ENV}-${{ vars.GCP_PROJECT_NUMBER || '0' }}.${{ vars.GCP_REGION }}.run.app"
          fi
          echo "Checking web: $WEB_URL"
          curl -fsS -o /dev/null -w "web %{http_code}\n" "$WEB_URL/" || echo "Web check failed (may be cold start)"
          echo "Checking proxy health: ${PROXY_URL}/health"
          curl -fsS -o /dev/null -w "proxy %{http_code}\n" "${PROXY_URL%/}/health" || echo "Proxy health check failed"
