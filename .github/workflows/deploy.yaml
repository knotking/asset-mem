name: Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (demo, staging, prod)'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - staging
          - prod

jobs:
  terraform:
    name: Deploy with Terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      # Common Setup Steps
      - name: Validate Environment
        id: validate-env
        run: |
          if [[ "${{ github.event.inputs.environment }}" =~ ^(demo|staging|prod)$ ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            echo "instance_name=${{ vars.GCP_INSTANCE_ID_PREFIX }}${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            echo "Invalid environment: ${{ github.event.inputs.environment }}"
            exit 1
          fi
      - name: Set uppercase environment
        run: echo "ENV_UPPER=$(echo ${{ github.event.inputs.environment }} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_ENV
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('GCP_SA_KEY_{0}', env.ENV_UPPER)] }}
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      # Terraform-Specific Steps
      - name: Terraform Init with Backend
        run: terraform init -backend-config="bucket=${{ vars.GCS_BACKEND_BUCKET }}" -backend-config="prefix=terraform/${{ env.environment }}" -lock=true
        working-directory: deployment/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: deployment/terraform

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.environment }}
          TF_VAR_instance_name: ${{ env.instance_name }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_tags: ${{ env.instance_name}}
          TF_VAR_GCS_BACKEND_BUCKET: ${{ vars.GCS_BACKEND_BUCKET }}
        run: terraform plan -out=tfplan
        working-directory: deployment/terraform

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.environment }}
          path: deployment/terraform/tfplan
          retention-days: 7

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        env:
          TF_VAR_environment: ${{ env.environment }}
          TF_VAR_instance_name: ${{ env.instance_name }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_tags: ${{ env.instance_name}}
          TF_VAR_GCS_BACKEND_BUCKET: ${{ vars.GCS_BACKEND_BUCKET }}
        run: terraform apply -auto-approve tfplan
        working-directory: deployment/terraform

      
      - name: Set Log Path
        run: echo "STARTUP_LOG=/home/deploy/startup_script.log" >> $GITHUB_ENV

      - name: Stream Startup Script Log
        if: always()
        run: |
          # Create a minimal monitoring script
          gcloud compute ssh ${{ env.instance_name }} --zone=${{ vars.GCP_ZONE }} --command='
          cat << EOF > /tmp/monitor.sh
          #!/bin/bash
          log_file=$1
          while ! grep "Startup script execution completed" $log_file &>/dev/null; do
            tail -n 20 $log_file
            sleep 30
          done
          cat $log_file
          EOF
          ' || exit 1

          # Make script executable and run it
          gcloud compute ssh ${{ env.instance_name }} --zone=${{ vars.GCP_ZONE }} --command="
          sudo chmod +x /tmp/monitor.sh && 
          sudo -u deploy /tmp/monitor.sh ${{ env.STARTUP_LOG }} &&
          sudo rm /tmp/monitor.sh"

      - name: Clean up OS Login SSH Keys
        if: always()
        run: |
          # List all SSH keys for the current account
          KEYS=$(gcloud compute os-login ssh-keys list --format="value(key)")
          for KEY in $KEYS; do
            gcloud compute os-login ssh-keys remove --key="$KEY" || true
          done