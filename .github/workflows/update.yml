name: Update Repository and Restart Docker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (e.g., demo, staging, prod)"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - staging
          - prod
      zone:
        description: "GCP zone where the instance is located"
        required: true
        default: "us-central1-a"

jobs:
  update-repo:
    name: Update Repository and Restart Docker
    runs-on: ubuntu-latest

    steps:
      # Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # Update repository and restart Docker Compose
      - name: Update Repository and Restart Docker
        run: |
          gcloud compute ssh homegeek${{  github.event.inputs.environment}} \
            --zone=${{ github.event.inputs.zone }} \
            --command "bash -c '
              set -e
              LOG_FILE=\"/home/deploy/update.log\"
              echo \"Update script execution started at \$(date)\" >> \$LOG_FILE

              # Switch to deploy user
              sudo -u deploy bash -c \"
                set -e

                # Pull the latest changes from the repository
                echo 'Pulling latest changes from repository...' >> \$LOG_FILE
                cd /home/deploy/HomeAMA
                rm -f .env
                git pull origin main >> \$LOG_FILE 2>&1
                if [ \$? -eq 0 ]; then
                  echo 'Repository updated successfully.' >> \$LOG_FILE
                else
                  echo 'Failed to update repository.' >> \$LOG_FILE
                  exit 1
                fi

                # Copy environment file
                cp .env.${{ github.event.inputs.environment }} .env

                # Restart Docker Compose
                echo 'Restarting Docker Compose...' >> \$LOG_FILE
                docker-compose down >> \$LOG_FILE 2>&1
                docker-compose up -d >> \$LOG_FILE 2>&1
                if [ \$? -eq 0 ]; then
                  echo 'Docker Compose restarted successfully.' >> \$LOG_FILE
                else
                  echo 'Failed to restart Docker Compose.' >> \$LOG_FILE
                  exit 1
                fi

                echo 'Update script execution completed at \$(date)' >> \$LOG_FILE
              \"
            '"