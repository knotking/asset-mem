name: Update Repository and Restart Docker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (e.g., demo, staging, prod)"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - staging
          - prod
      zone:
        description: "GCP zone where the instance is located"
        required: true
        default: "us-central1-a"

jobs:
  update-repo:
    name: Update Repository and Restart Docker
    runs-on: ubuntu-latest

    steps:
      # Authenticate with Google Cloud using service account key
      - name: Authenticate to Google Cloud
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > ${{ github.workspace }}/key.json
          gcloud auth activate-service-account --key-file=${{ github.workspace }}/key.json
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      # Update repository and restart Docker Compose
      - name: Update Repository and Restart Docker
        id: update
        |
          gcloud compute scp scripts/update.sh homegeek${{ github.event.inputs.environment }}:/tmp/update.sh \
            --zone=${{ github.event.inputs.zone }}
          gcloud compute ssh homegeek${{ github.event.inputs.environment }} \
            --zone=${{ github.event.inputs.zone }} \
            --command "bash /tmp/update.sh ${{ github.event.inputs.environment }}"

      # Retrieve and display logs (Logging)
      - name: Retrieve Update Log
        if: always()
        run: |
          gcloud compute ssh homegeek${{ github.event.inputs.environment }} \
            --zone=${{ github.event.inputs.zone }} \
            --command "bash -c '
              set -e
              sudo -u deploy bash -c \"cat /home/deploy/update.log\"
            '" || echo "Failed to retrieve log file"

      # Clean up sensitive data (Cleanup)
      - name: Clean Up
        if: always()
        run: |
          rm -f ${{ github.workspace }}/key.json
          echo "Temporary service account key file removed."