name: Update Repository and Restart Docker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (e.g., demo, staging, prod)"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - staging
          - prod

jobs:
  update-repo:
    name: Update Repository and Restart Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate Environment
        id: validate-env
        run: |
          if [[ "${{ github.event.inputs.environment }}" =~ ^(demo|staging|prod)$ ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            echo "instance_name=${{ vars.GCP_INSTANCE_ID_PREFIX }}${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            echo "Invalid environment: ${{ github.event.inputs.environment }}"
            exit 1
          fi
      - name: Set uppercase environment
        run: echo "ENV_UPPER=$(echo ${{ github.event.inputs.environment }} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('GCP_SA_KEY_{0}', env.ENV_UPPER)] }}
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      # Create and run update.sh in a single command as deploy user
      - name: Create and Run update.sh on Instance as Deploy User
        run: |
          gcloud compute ssh ${{env.instance_name}} \
            --zone=${{vars.GCP_ZONE}} \
            --command "sudo -u deploy bash -c '
              set -e
              LOG_FILE=\"/home/deploy/update.log\"
              ENVIRONMENT=\"${{ env.environment }}\"

              echo \"Update script execution started at \$(date)\" >> \"\$LOG_FILE\"
              
              # Create backup directories
              echo \"Creating backup directories...\" >> \"\$LOG_FILE\"
              mkdir -p /tmp/volume-backups /tmp/traefik-backup
              
              # Backup Docker volumes
              echo \"Backing up Docker volumes...\" >> \"\$LOG_FILE\"
              docker volume ls -q | while read volume; do
                echo \"Backing up volume: \$volume\" >> \"\$LOG_FILE\"
                docker run --rm \
                  -v \"\$volume\":/data \
                  -v /tmp/volume-backups:/backup \
                  ubuntu \
                  tar -czf \"/backup/\${volume}.tar.gz\" -C /data .
              done
              
              # Backup acme.json
              echo \"Backing up acme.json...\" >> \"\$LOG_FILE\"
              if [ -f \"/home/deploy/HomeApp/traefik/acme.json\" ]; then
                cp /home/deploy/HomeApp/traefik/acme.json /tmp/traefik-backup/acme.json
                chmod 644 /tmp/traefik-backup/acme.json
              fi
              
              # Upload backups to GCS
              echo \"Uploading backups to GCS...\" >> \"\$LOG_FILE\"
              gsutil -m cp /tmp/volume-backups/*.tar.gz gs://${{ vars.GCS_BACKEND_BUCKET }}/${{ env.environment }}/volumes/ >> \"\$LOG_FILE\" 2>&1 || echo \"No volumes to backup\"
              gsutil cp /tmp/traefik-backup/acme.json gs://${{ vars.GCS_BACKEND_BUCKET }}/${{ env.environment }}/traefik/ >> \"\$LOG_FILE\" 2>&1 || echo \"No acme.json to backup\"
              
              # Clean up backup files
              rm -rf /tmp/volume-backups /tmp/traefik-backup
              
              echo \"Checking for updates...\" >> \"\$LOG_FILE\"
              cd /home/deploy/HomeApp
              git fetch origin main >> \"\$LOG_FILE\" 2>&1
              if git diff origin/main --quiet; then
                echo \"Repository is already up-to-date. No action needed.\" >> \"\$LOG_FILE\"
                echo \"Update script execution completed at \$(date)\" >> \"\$LOG_FILE\"
                exit 0
              fi
              echo \"Pulling latest changes from repository...\" >> \"\$LOG_FILE\"
              rm -f .env
              git pull origin main >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to update repository.\" >> \"\$LOG_FILE\"; exit 1; }
              cp \".env.\$ENVIRONMENT\" .env || { echo \"Failed to copy .env file.\" >> \"\$LOG_FILE\"; exit 1; }
              echo \"Restarting Docker Compose...\" >> \"\$LOG_FILE\"
              docker-compose down >> \"\$LOG_FILE\" 2>&1
              docker-compose -f docker-compose.yml up -d >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to restart Docker Compose.\" >> \"\$LOG_FILE\"; exit 1; }
              echo \"Update script execution completed at \$(date)\" >> \"\$LOG_FILE\"
            '"

      # Retrieve and display logs (Logging)
      - name: Retrieve Update Log
        if: always()
        run: |
          gcloud compute ssh ${{ env.instance_name}} \
            --zone=${{vars.GCP_ZONE}} \
            --command "bash -c '
              set -e
              sudo -u deploy bash -c \"cat /home/deploy/update.log\"
            '" || echo "Failed to retrieve log file"
