name: Update Repository and Restart Docker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (e.g., demo, staging, prod)"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - staging
          - prod
      zone:
        description: "GCP zone where the instance is located"
        required: true
        default: "us-central1-a"

jobs:
  update-repo:
    name: Update Repository and Restart Docker
    runs-on: ubuntu-latest

    steps:
      # Authenticate with Google Cloud using service account key
      - name: Authenticate to Google Cloud
      run: |
        if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
          echo "Error: GCP_SERVICE_ACCOUNT_KEY is empty"
          exit 1
        fi
        echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > gcp-key.json
        gcloud auth activate-service-account --key-file=gcp-key.json
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      # Update repository and restart Docker Compose
      - name: Update Repository and Restart Docker
        id: update
        run: |
          gcloud compute ssh homegeek${{ github.event.inputs.environment }} \
            --zone=${{ github.event.inputs.zone }} \
            --command "bash -c '
              set -e
              LOG_FILE=\"/home/deploy/update.log\"
              echo \"Update script execution started at \$(date)\" >> \$LOG_FILE

              # Switch to deploy user
              sudo -u deploy bash -c \"
                set -e
                cd /home/deploy/HomeAMA

                # Check if repository is up-to-date (Idempotency)
                echo 'Checking for updates...' >> \$LOG_FILE
                git fetch origin main >> \$LOG_FILE 2>&1
                if git diff origin/main --quiet; then
                  echo 'Repository is already up-to-date. No action needed.' >> \$LOG_FILE
                  echo 'Update script execution completed at \$(date)' >> \$LOG_FILE
                  exit 0
                fi

                # Pull the latest changes from the repository
                echo 'Pulling latest changes from repository...' >> \$LOG_FILE
                rm -f .env
                git pull origin main >> \$LOG_FILE 2>&1
                if [ \$? -eq 0 ]; then
                  echo 'Repository updated successfully.' >> \$LOG_FILE
                else
                  echo 'Failed to update repository.' >> \$LOG_FILE
                  exit 1
                fi

                # Copy environment file
                cp .env.${{ github.event.inputs.environment }} .env

                # Restart Docker Compose
                echo 'Restarting Docker Compose...' >> \$LOG_FILE
                docker-compose down >> \$LOG_FILE 2>&1
                docker-compose up -d >> \$LOG_FILE 2>&1
                if [ \$? -eq 0 ]; then
                  echo 'Docker Compose restarted successfully.' >> \$LOG_FILE
                else
                  echo 'Failed to restart Docker Compose.' >> \$LOG_FILE
                  exit 1
                fi

                echo 'Update script execution completed at \$(date)' >> \$LOG_FILE
              \"
            '"

      # Retrieve and display logs (Logging)
      - name: Retrieve Update Log
        if: always()
        run: |
          gcloud compute ssh homegeek${{ github.event.inputs.environment }} \
            --zone=${{ github.event.inputs.zone }} \
            --command "cat /home/deploy/update.log" || echo "Failed to retrieve log file"

      # Clean up sensitive data (Cleanup)
      - name: Clean Up
        if: always()
        run: |
          rm -f gcp-key.json
          echo "Temporary service account key file removed."