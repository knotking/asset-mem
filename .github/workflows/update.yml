name: Update Repository and Restart Docker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (e.g., demo, staging, prod)"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - staging
          - prod

jobs:
  update-repo:
    name: Update Repository and Restart Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      steps:
      - name: Validate Environment
        id: validate-env
        run: |
          if [[ "${{ github.event.inputs.environment }}" =~ ^(demo|staging|prod)$ ]]; then
            echo "environment=${{ github.event.inputs.environment || 'demo' }}" >> $GITHUB_ENV
          else
            echo "Invalid environment: ${{ github.event.inputs.environment }}"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
    
      - name: Terraform Init with Backend
        run: terraform init -backend-config="bucket=${{ secrets.GCS_BACKEND_BUCKET }}" -backend-config="prefix=tfstate/${{ env.environment }}" -lock=true
        working-directory: deployment/terraform
        # Fetch Zone from Terraform Outputs
      - name: Fetch Zone
        id: fetch-zone
        run: |
          echo "instance_zone=$(terraform output -raw instance_zone)" >> $GITHUB_ENV
          echo "instance_name=$(terraform output -raw instance_name)" >> $GITHUB_ENV
        working-directory: deployment/terraform

      # Create and run update.sh in a single command as deploy user
      - name: Create and Run update.sh on Instance as Deploy User
        run: |
          gcloud compute ssh ${{env.instance_name}} \
            --zone=${{env.instance_zone}} \
            --command "sudo -u deploy bash -c '
              set -e
              LOG_FILE=\"/home/deploy/update.log\"
              ENVIRONMENT=\"${{ github.event.inputs.environment }}\"

              echo \"Update script execution started at \$(date)\" >> \"\$LOG_FILE\"
              echo \"Checking for updates...\" >> \"\$LOG_FILE\"
              cd /home/deploy/HomeAMA
              git fetch origin main >> \"\$LOG_FILE\" 2>&1
              if git diff origin/main --quiet; then
                echo \"Repository is already up-to-date. No action needed.\" >> \"\$LOG_FILE\"
                echo \"Update script execution completed at \$(date)\" >> \"\$LOG_FILE\"
                exit 0
              fi
              echo \"Pulling latest changes from repository...\" >> \"\$LOG_FILE\"
              rm -f .env
              git pull origin main >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to update repository.\" >> \"\$LOG_FILE\"; exit 1; }
              cp \".env.\$ENVIRONMENT\" .env || { echo \"Failed to copy .env file.\" >> \"\$LOG_FILE\"; exit 1; }
              echo \"Restarting Docker Compose...\" >> \"\$LOG_FILE\"
              docker-compose down >> \"\$LOG_FILE\" 2>&1
              docker-compose up -d >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to restart Docker Compose.\" >> \"\$LOG_FILE\"; exit 1; }
              echo \"Update script execution completed at \$(date)\" >> \"\$LOG_FILE\"
            '"

      # Retrieve and display logs (Logging)
      - name: Retrieve Update Log
        if: always()
        run: |
          gcloud compute ssh ${{env.instance_name}} \
            --zone=${{env.instance_zone}} \
            --command "bash -c '
              set -e
              sudo -u deploy bash -c \"cat /home/deploy/update.log\"
            '" || echo "Failed to retrieve log file"
