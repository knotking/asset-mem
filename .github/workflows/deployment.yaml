name: Terraform Deployment

on:
  push:
    branches:
      - main
      - fix_github_action
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (demo, staging, prod)'
        required: true
        default: 'demo'

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set Environment
        id: set-env
        run: echo "environment=${{ github.event.inputs.environment || 'demo' }}" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: List Files in Workspace
        run: ls -R

      - name: Print Terraform Files
        run: cat deployment/terraform/main.tf
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          install_components: 'beta'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

  terraform:
    name: Deploy with Terraform
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/terraform

    steps:
      - name: Terraform Init with Backend
        run: terraform init -backend-config="bucket=${{ secrets.GCS_BACKEND_BUCKET }}" -backend-config="prefix=tfstate/${{ env.environment }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Request Manual Approval Before Apply
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v6
        with:
          script: |
            const core = require('@actions/core');
            core.notice('Please approve the workflow to proceed.');

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

  destroy:
    name: Terraform Destroy
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: deployment/terraform

    steps:
      - name: Terraform Init with Backend
        run: terraform init -backend-config="bucket=${{ secrets.GCS_BACKEND_BUCKET }}" -backend-config="prefix=tfstate/${{ env.environment }}"

      - name: Request Manual Approval Before Destroy
        uses: actions/github-script@v6
        with:
          script: |
            const core = require('@actions/core');
            core.notice('Please approve the workflow to proceed.');

      - name: Terraform Destroy
        run: terraform destroy -auto-approve