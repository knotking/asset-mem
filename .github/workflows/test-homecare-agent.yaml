name: Test Homecare Agent

on:
  pull_request:
    paths:
      - "gcp/agents/homecare/**"
  push:
    branches:
      - main
    paths:
      - "gcp/agents/homecare/**"

env:
  WORKING_DIRECTORY: gcp/agents/homecare
  PYTHON_VERSION: "3.11"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "gcp/agents/homecare/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: make test
        env:
          # Opt-in live YouTube / SerpAPI tests stay skipped in CI.
          RUN_EXTERNAL_DIY_SEARCH_TESTS: ""
