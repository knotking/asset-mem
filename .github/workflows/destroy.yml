name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (demo, staging, prod)'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - staging
          - prod
jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate Environment
        id: validate-env
        run: |
          if [[ "${{ github.event.inputs.environment }}" =~ ^(demo|staging|prod)$ ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            echo "Invalid environment: ${{ github.event.inputs.environment }}"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets[format('GCP_SA_KEY_{0}', github.event.inputs.environment | upper)] }}'
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
        
      - name: Terraform Init with Backend
        run: terraform init -backend-config="bucket=${{ secrets.GCS_BACKEND_BUCKET }}" -backend-config="prefix=terraform/${{ env.environment }}" -lock=true
        working-directory: deployment/terraform
    
      - name: Backup Docker Volumes
        run: |
          echo "The zone is: ${{ secrets.GCP_ZONE }}"
          gcloud compute ssh ${{ secrets.GCP_PROJECT_ID }}${{env.environment}} --zone=${{ secrets.GCP_ZONE }} --command="
            sudo -u deploy docker volume ls -q | while read volume; do
              sudo -u deploy docker run --rm \
                -v \$volume:/data \
                -v /tmp:/backup \
                ubuntu \
                tar -czf /backup/\${volume}.tar.gz -C /data .
            done &&
            sudo -u deploy gsutil cp /tmp/*.tar.gz gs://${{ secrets.GCS_BACKEND_BUCKET }}/docker/${{ env.environment }}/
          "      
      - name: Terraform Destroy
        env:
          TF_VAR_ENVIRONMENT: ${{ env.environment }}
          TF_VAR_INSTANCE_NAME: "${{secrets.GCP_PROJECT_ID}}${{ env.environment }}"
          TF_VAR_ZONE: ${{secrets.GCP_ZONE}}
          TF_VAR_PROJECT_ID: ${{secrets.GCP_PROJECT_ID}}
          TF_VAR_REGION: ${{secrets.GCP_REGION}}
        run: terraform destroy -auto-approve
        working-directory: deployment/terraform