name: Backup and Restore

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Select operation'
        required: true
        type: choice
        options:
          - backup
          - restore
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - demo
          - staging
          - prod

jobs:
  backup-restore:
    name: Backup or Restore Operation
    runs-on: ubuntu-latest
    steps:
      # Set default operation to backup for push events
      - name: Set Default Operation
        if: github.event_name == 'push'
        run: |
          echo "operation=backup" >> $GITHUB_ENV
          echo "environment=demo" >> $GITHUB_ENV

      # For workflow_dispatch, use the input values
      - name: Set Input Operation
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "operation=${{ github.event.inputs.operation }}" >> $GITHUB_ENV
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      - name: Set Environment Variables
        run: |
          echo "instance_name=${{ vars.GCP_INSTANCE_ID_PREFIX }}${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "ENV_UPPER=$(echo ${{ github.event.inputs.environment }} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('GCP_SA_KEY_{0}', env.ENV_UPPER)] }}
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      - name: Execute Backup
        if: github.event.inputs.operation == 'backup'
        run: |
          gcloud compute ssh ${{ env.instance_name }} --zone=${{ vars.GCP_ZONE }} --command="sudo -u deploy bash -c '
            set -e
            LOG_FILE=\"/home/deploy/backup.log\"
            echo \"Backup operation started at \$(date)\" >> \"\$LOG_FILE\"
            
            # Stop Docker containers
            echo \"Stopping Docker containers...\" >> \"\$LOG_FILE\"
            cd /home/deploy/HomeApp
            docker-compose down >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to stop containers\" >> \"\$LOG_FILE\"; exit 1; }
            
            # Create backup directories
            mkdir -p /tmp/volume-backups /tmp/traefik-backup
            
            # Backup Docker volumes
            echo \"Backing up Docker volumes...\" >> \"\$LOG_FILE\"
            docker volume ls -q | while read volume; do
              if [[ \$volume == homeapp* ]]; then
                echo \"Backing up volume: \$volume\" >> \"\$LOG_FILE\"
                docker run --rm \
                  -v \"\$volume\":/data \
                  -v /tmp/volume-backups:/backup \
                  ubuntu \
                  tar -czf \"/backup/\${volume}.tar.gz\" -C /data .
              fi
            done
            
            # Backup acme.json if exists
            if [ -f \"/home/deploy/HomeApp/traefik/acme.json\" ]; then
              echo \"Backing up acme.json...\" >> \"\$LOG_FILE\"
              cp /home/deploy/HomeApp/traefik/acme.json /tmp/traefik-backup/acme.json
              chmod 644 /tmp/traefik-backup/acme.json
            fi
            
            # Upload to GCS with error handling
            echo \"Uploading backups to GCS...\" >> \"\$LOG_FILE\"
            if [ -n \"\$(ls -A /tmp/volume-backups/*.tar.gz 2>/dev/null)\" ]; then
              gsutil -m cp /tmp/volume-backups/*.tar.gz gs://${{ vars.GCS_BACKEND_BUCKET }}/${{ github.event.inputs.environment }}/volumes/ >> \"\$LOG_FILE\" 2>&1
              echo \"Volume backups uploaded successfully\" >> \"\$LOG_FILE\"
            else
              echo \"No volume backups to upload\" >> \"\$LOG_FILE\"
            fi
            
            if [ -f \"/tmp/traefik-backup/acme.json\" ]; then
              gsutil cp /tmp/traefik-backup/acme.json gs://${{ vars.GCS_BACKEND_BUCKET }}/${{ github.event.inputs.environment }}/traefik/ >> \"\$LOG_FILE\" 2>&1
              echo \"acme.json uploaded successfully\" >> \"\$LOG_FILE\"
            fi
            
            # Restart Docker containers
            echo \"Restarting Docker containers...\" >> \"\$LOG_FILE\"
            docker-compose up -d >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to restart containers\" >> \"\$LOG_FILE\"; exit 1; }
            
            echo \"Backup operation completed at \$(date)\" >> \"\$LOG_FILE\"
          '"

      - name: Execute Restore
        if: github.event.inputs.operation == 'restore'
        run: |
          gcloud compute ssh ${{ env.instance_name }} --zone=${{ vars.GCP_ZONE }} --command="sudo -u deploy bash -c '
            set -e
            LOG_FILE=\"/home/deploy/restore.log\"
            echo \"Restore operation started at \$(date)\" >> \"\$LOG_FILE\"
            
            # Stop Docker containers
            echo \"Stopping Docker containers...\" >> \"\$LOG_FILE\"
            cd /home/deploy/HomeApp
            docker-compose down >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to stop containers\" >> \"\$LOG_FILE\"; exit 1; }
            
            # Remove existing volumes that start with homeapp
            echo \"Removing existing volumes...\" >> \"\$LOG_FILE\"
            docker volume ls -q | grep ^homeapp | while read volume; do
              echo \"Removing volume: \$volume\" >> \"\$LOG_FILE\"
              docker volume rm \"\$volume\" >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to remove volume \$volume\" >> \"\$LOG_FILE\"; exit 1; }
            done
            
            # Create restore directories
            mkdir -p /tmp/volume-backups /tmp/traefik-backup
            
            # Download from GCS with error handling
            echo \"Downloading backups from GCS...\" >> \"\$LOG_FILE\"
            gsutil -m cp -r gs://${{ vars.GCS_BACKEND_BUCKET }}/${{ github.event.inputs.environment }}/volumes/homeapp* /tmp/volume-backups/ >> \"\$LOG_FILE\" 2>&1 || echo \"No volumes to restore\"
            gsutil cp gs://${{ vars.GCS_BACKEND_BUCKET }}/${{ github.event.inputs.environment }}/traefik/acme.json /tmp/traefik-backup/acme.json >> \"\$LOG_FILE\" 2>&1 || echo \"No acme.json to restore\"
            
            # Restore volumes
            if [ -n \"\$(ls -A /tmp/volume-backups/*.tar.gz 2>/dev/null)\" ]; then
              echo \"Restoring volumes...\" >> \"\$LOG_FILE\"
              for backup in /tmp/volume-backups/*.tar.gz; do
                volume_name=\$(basename \"\$backup\" .tar.gz)
                echo \"Restoring volume: \$volume_name\" >> \"\$LOG_FILE\"
                docker volume create \"\$volume_name\" >> \"\$LOG_FILE\" 2>&1
                docker run --rm \
                  -v \"\$volume_name\":/restore \
                  -v \"\$backup\":/backup.tar.gz \
                  ubuntu bash -c \"cd /restore && tar xzf /backup.tar.gz\" >> \"\$LOG_FILE\" 2>&1
              done
            fi
            
            # Restore acme.json
            if [ -f \"/tmp/traefik-backup/acme.json\" ]; then
              echo \"Restoring acme.json...\" >> \"\$LOG_FILE\"
              mkdir -p /home/deploy/HomeApp/traefik
              mv /tmp/traefik-backup/acme.json /home/deploy/HomeApp/traefik/
              chmod 600 /home/deploy/HomeApp/traefik/acme.json
            fi
            
            # Restart Docker containers
            echo \"Restarting Docker containers...\" >> \"\$LOG_FILE\"
            docker-compose up -d >> \"\$LOG_FILE\" 2>&1 || { echo \"Failed to restart containers\" >> \"\$LOG_FILE\"; exit 1; }
            
            echo \"Restore operation completed at \$(date)\" >> \"\$LOG_FILE\"
          '"

      # Retrieve and display logs
      - name: Retrieve Operation Log
        if: always()
        run: |
          gcloud compute ssh ${{ env.instance_name}} \
            --zone=${{vars.GCP_ZONE}} \
            --command="sudo -u deploy bash -c '
              if [ \"${{ github.event.inputs.operation }}\" == \"backup\" ]; then
                cat /home/deploy/backup.log
              else
                cat /home/deploy/restore.log
              fi
            '" || echo "Failed to retrieve log file"

      - name: Cleanup OS Login SSH Keys
        if: always()
        uses: ./.github/workflows/cleanup-oslogin.yml