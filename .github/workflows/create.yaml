name: Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (demo, staging, prod)'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - staging
          - prod
      destroy:
        description: 'Set to true to destroy resources'
        required: false
        default: 'false'

jobs:
  terraform:
    name: Deploy with Terraform
    runs-on: ubuntu-latest

    steps:
      # Common Setup Steps
      - name: Validate Environment
        id: validate-env
        run: |
          if [[ "${{ github.event.inputs.environment }}" =~ ^(demo|staging|prod)$ ]]; then
            echo "environment=${{ github.event.inputs.environment || 'demo' }}" >> $GITHUB_ENV
          else
            echo "Invalid environment: ${{ github.event.inputs.environment }}"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # Terraform-Specific Steps
      - name: Terraform Init with Backend
        run: terraform init -backend-config="bucket=${{ secrets.GCS_BACKEND_BUCKET }}" -backend-config="prefix=tfstate/${{ env.environment }}" -lock=true
        working-directory: deployment/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: deployment/terraform

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.environment }}
        run: terraform plan -out=tfplan
        working-directory: deployment/terraform

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.environment }}
          path: deployment/terraform/tfplan
          retention-days: 7

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        env:
          TF_VAR_environment: ${{ env.environment }}
        run: terraform apply -auto-approve tfplan
        working-directory: deployment/terraform

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'

    steps:
      - name: Validate Environment
        id: validate-env
        run: |
          if [[ "${{ github.event.inputs.environment }}" =~ ^(demo|staging|prod)$ ]]; then
            echo "environment=${{ github.event.inputs.environment || 'demo' }}" >> $GITHUB_ENV
          else
            echo "Invalid environment: ${{ github.event.inputs.environment }}"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init with Backend
        run: terraform init -backend-config="bucket=${{ secrets.GCS_BACKEND_BUCKET }}" -backend-config="prefix=tfstate/${{ env.environment }}" -lock=true
        working-directory: deployment/terraform

      - name: Terraform Destroy
        env:
          TF_VAR_environment: ${{ env.environment }}
        run: terraform destroy -auto-approve
        working-directory: deployment/terraform