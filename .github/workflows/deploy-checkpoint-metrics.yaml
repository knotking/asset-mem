name: Deploy Checkpoint Metrics Function

on:
  push:
    branches:
      - main
    paths:
      - "gcp/proxy/workers/function/checkpoint_metrics/**"
      - "gcp/common/observability/**"
      - ".github/workflows/deploy-checkpoint-metrics.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      traffic_tier:
        description: "Hardware traffic tier"
        required: false
        default: "idle"
        type: choice
        options:
          - idle
          - warm
          - ph
          - scale_10x
          - scale_100x

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment ||  'staging' }}
    env:
      FUNCTION_NAME_BASE: pubsub-checkpoint-metrics
      RUNTIME: python313
      ENTRY_POINT: pubsub_checkpoint_metrics_aggregate
      MAX_INSTANCES: 3
      CONCURRENCY: 1
      MEMORY: 256Mi
      SOURCE_DIRECTORY: gcp/proxy/workers/function/checkpoint_metrics
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub variables
        run: |
          missing_vars=()

          if [ -z "${{ vars.GCP_REGION }}" ]; then
            missing_vars+=("GCP_REGION")
          fi

          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            missing_vars+=("GCP_PROJECT_ID")
          fi

          if [ -z "${{ vars.CHECKPOINT_METRICS_TOPIC }}" ]; then
            missing_vars+=("CHECKPOINT_METRICS_TOPIC")
          fi

          if [ -z "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            missing_vars+=("WORKLOAD_IDENTITY_PROVIDER")
          fi

          if [ -z "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}" ]; then
            missing_vars+=("GCP_SERVICE_ACCOUNT_EMAIL")
          fi

          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub variables: ${missing_vars[*]}"
            printf '  - %s\n' "${missing_vars[@]}"
            exit 1
          fi

          echo "✓ All required GitHub variables are set"

      - name: Set environment variables
        run: |
          echo "REGION=${{ vars.GCP_REGION }}" >> $GITHUB_ENV
          echo "FUNCTION_NAME=${{ env.FUNCTION_NAME_BASE }}-${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_ENV
          echo "TRIGGER_TOPIC=projects/${{ vars.GCP_PROJECT_ID }}/topics/${{ vars.CHECKPOINT_METRICS_TOPIC }}" >> $GITHUB_ENV

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"

      - name: Prepare shared modules (sync gcp/common → function source)
        shell: bash
        run: |
          set -euo pipefail
          DST_COMMON_DIR="${{ env.SOURCE_DIRECTORY }}/common"
          mkdir -p "${DST_COMMON_DIR}"
          if [ ! -f "${DST_COMMON_DIR}/__init__.py" ]; then
            printf '%s\n' "# Shared modules synced at deploy time." > "${DST_COMMON_DIR}/__init__.py"
          fi
          SRC_OBS_DIR="gcp/common/observability"
          DST_OBS_DIR="${DST_COMMON_DIR}/observability"
          mkdir -p "${DST_OBS_DIR}"
          rsync -a --delete "${SRC_OBS_DIR}/" "${DST_OBS_DIR}/"
          echo "✓ Synced ${SRC_OBS_DIR} -> ${DST_OBS_DIR}"

      - name: Resolve hardware tier
        run: |
          TIER="${{ github.event.inputs.traffic_tier }}"
          if [ -z "$TIER" ]; then TIER="${{ vars.HARDWARE_TIER }}"; fi
          if [ -z "$TIER" ]; then TIER="idle"; fi
          ENV_NAME="${{ github.event.inputs.environment || 'staging' }}"
          bash .github/scripts/resolve-hardware-env.sh "$ENV_NAME" "$TIER"

      - name: Map worker hardware env
        run: |
          echo "MAX_INSTANCES=${WORKER_CHECKPOINT_METRICS_MAX_INSTANCES}" >> $GITHUB_ENV
          echo "MEMORY=${WORKER_CHECKPOINT_METRICS_MEMORY}" >> $GITHUB_ENV
          echo "FUNCTION_TIMEOUT=${WORKER_CHECKPOINT_METRICS_TIMEOUT}s" >> $GITHUB_ENV

      - name: Deploy Cloud Function
        id: deploy
        uses: "google-github-actions/deploy-cloud-functions@v3"
        with:
          name: ${{ env.FUNCTION_NAME }}
          runtime: ${{ env.RUNTIME }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          entry_point: ${{ env.ENTRY_POINT }}
          source_dir: ${{ env.SOURCE_DIRECTORY }}
          max_instance_count: ${{ env.MAX_INSTANCES }}
          max_instance_request_concurrency: ${{ env.CONCURRENCY }}
          memory: ${{ env.MEMORY }}
          service_timeout: ${{ env.FUNCTION_TIMEOUT }}
          event_trigger_type: google.cloud.pubsub.topic.v1.messagePublished
          event_trigger_pubsub_topic: ${{ env.TRIGGER_TOPIC }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          environment_variables: |
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ vars.GCP_REGION }}

      # Pub/Sub → Eventarc must invoke the underlying Cloud Run service (deploy-cloud-functions does not set this).
      - name: Allow Pub/Sub trigger invocations
        run: |
          gcloud run services update "${{ env.FUNCTION_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --update-annotations=run.googleapis.com/invoker-iam-disabled=true
