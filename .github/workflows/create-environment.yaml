name: Create New Environment

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Environment name (e.g., qa-team-1, demo-customer-x)"
        required: true
        type: string
      gcp_project_id:
        description: "GCP Project ID (leave empty to use existing from GitHub env)"
        required: false
        type: string
      folder_id:
        description: "Folder ID (optional, for new projects)"
        required: false
        type: string
      region:
        description: "GCP Region (leave empty to use existing from GitHub env)"
        required: false
        default: "us-central1"
        type: choice
        options:
          - ""
          - us-central1
          - us-east1
          - us-west1

permissions:
  contents: read
  id-token: write

jobs:
  validate-only:
    name: Validate Workflow (Push Only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow syntax
        run: |
          echo "✅ Workflow validation successful"
          echo "📝 This is a push event - infrastructure will NOT be created"
          echo "ℹ️  To create infrastructure, manually trigger this workflow from Actions tab"
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

  create-gcp-project:
    name: Create GCP Project (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      project_id: ${{ steps.create.outputs.project_id }}
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.gcp_project_id }}" ]; then
            echo "::error::gcp_project_id is required when creating a new project"
            exit 1
          fi

          if [ -z "${{ secrets.ORG_WIF_PROVIDER }}" ]; then
            echo "::error::ORG_WIF_PROVIDER secret is not configured"
            echo "::error::This is required for project creation. See README for setup instructions."
            exit 1
          fi

          if [ -z "${{ secrets.ORG_ADMIN_SERVICE_ACCOUNT }}" ]; then
            echo "::error::ORG_ADMIN_SERVICE_ACCOUNT secret is not configured"
            echo "::error::This is required for project creation. See README for setup instructions."
            exit 1
          fi

          if [ -z "${{ secrets.BILLING_ACCOUNT_ID }}" ]; then
            echo "::error::BILLING_ACCOUNT_ID secret is not configured"
            echo "::error::This is required for project creation. See README for setup instructions."
            exit 1
          fi

          if [ -z "${{ secrets.ORGANIZATION_ID }}" ]; then
            echo "::error::ORGANIZATION_ID secret is not configured"
            echo "::error::Projects must be created under an organization for proper governance."
            echo "::error::See README for setup instructions."
            exit 1
          fi

          echo "✓ All required secrets configured"
          echo "✓ Creating new GCP project: ${{ inputs.gcp_project_id }}"

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.ORG_WIF_PROVIDER }}
          service_account: ${{ secrets.ORG_ADMIN_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create GCP Project
        id: create
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"

          # Check if project already exists
          echo "Checking if project $PROJECT_ID already exists..."
          if gcloud projects describe $PROJECT_ID &>/dev/null; then
            echo "ℹ️  Project $PROJECT_ID already exists"
            echo "   Using existing project"
            echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          else
            echo "Creating new project if needed: $PROJECT_ID"

            # Build create command
            CREATE_CMD="gcloud projects create $PROJECT_ID"

            # Add organization if provided from secrets
            if [ -n "${{ secrets.ORGANIZATION_ID }}" ]; then
              CREATE_CMD="$CREATE_CMD --organization=${{ secrets.ORGANIZATION_ID }}"
            fi

            # Add folder if provided from inputs
            if [ -n "${{ inputs.folder_id }}" ]; then
              CREATE_CMD="$CREATE_CMD --folder=${{ inputs.folder_id }}"
            fi

            # Try to create project; don't fail if ID already in use
            set +e
            eval $CREATE_CMD
            CREATE_EXIT_CODE=$?
            set -e

            if [ $CREATE_EXIT_CODE -ne 0 ]; then
              echo "⚠️  gcloud projects create failed (exit $CREATE_EXIT_CODE). Checking if project now exists..."
            fi

            # Final check: if we can describe it, treat as success; otherwise fail
            if gcloud projects describe $PROJECT_ID &>/dev/null; then
              echo "✓ Using project: $PROJECT_ID"
              echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
            else
              echo "::error::Project $PROJECT_ID does not exist and could not be created."
              exit 1
            fi
          fi

      - name: Link Billing Account
        run: |
          PROJECT_ID="${{ inputs.gcp_project_id }}"

          # Check if billing is already linked
          CURRENT_BILLING=$(gcloud billing projects describe $PROJECT_ID \
            --format="value(billingAccountName)" 2>/dev/null || echo "")

          if [ -n "$CURRENT_BILLING" ]; then
            echo "ℹ️  Billing account already linked: $CURRENT_BILLING"
          else
            echo "Linking billing account..."
            gcloud billing projects link $PROJECT_ID \
              --billing-account=${{ secrets.BILLING_ACCOUNT_ID }}
            echo "✓ Billing account linked"
          fi

      - name: Wait for project creation to propagate
        run: |
          echo "Waiting for project creation to propagate..."
          sleep 30

  resolve-inputs:
    name: Resolve Configuration
    runs-on: ubuntu-latest
    needs: create-gcp-project
    if: github.event_name == 'workflow_dispatch' && always()
    environment: ${{ inputs.environment_name }}
    outputs:
      gcp_project_id: ${{ steps.resolve.outputs.gcp_project_id }}
      region: ${{ steps.resolve.outputs.region }}
    steps:
      - name: Resolve inputs from GitHub environment or workflow inputs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ENV_ADMIN }}
        run: |
          # Function to get value from GitHub environment variable
          get_github_var() {
            gh variable get "$1" --env ${{ inputs.environment_name }} 2>/dev/null || echo ""
          }

          # Resolve GCP_PROJECT_ID (priority: created project > workflow input > github env)
          if [ -n "${{ needs.create-gcp-project.outputs.project_id }}" ]; then
            PROJECT_ID="${{ needs.create-gcp-project.outputs.project_id }}"
            echo "Using GCP_PROJECT_ID from created project: $PROJECT_ID"
          elif [ -n "${{ inputs.gcp_project_id }}" ]; then
            PROJECT_ID="${{ inputs.gcp_project_id }}"
            echo "Using GCP_PROJECT_ID from workflow input: $PROJECT_ID"
          else
            PROJECT_ID=$(get_github_var "GCP_PROJECT_ID")
            # Remove quotes if present
            PROJECT_ID=$(echo "$PROJECT_ID" | tr -d '"')
            if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
              echo "::error::GCP_PROJECT_ID not provided and not found in GitHub environment"
              echo "::error::Current value: '$PROJECT_ID'"
              echo "::error::Please provide gcp_project_id as workflow input or set it in the GitHub environment"
              exit 1
            fi
            echo "Using GCP_PROJECT_ID from GitHub environment: $PROJECT_ID"
          fi

          # Resolve REGION
          if [ -n "${{ inputs.region }}" ] && [ "${{ inputs.region }}" != "us-central1" ]; then
            REGION="${{ inputs.region }}"
            echo "Using region from workflow input"
          else
            REGION=$(get_github_var "GCP_REGION")
            if [ -z "$REGION" ]; then
              REGION="${{ inputs.region }}"
              if [ -z "$REGION" ]; then
                REGION="us-central1"
              fi
              echo "Using default region: $REGION"
            else
              echo "Using region from GitHub environment: $REGION"
            fi
          fi

          echo "gcp_project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT

  create-infrastructure:
    name: Create Infrastructure with gcloud
    runs-on: ubuntu-latest
    needs: resolve-inputs
    if: github.event_name == 'workflow_dispatch'
    outputs:
      gcp_project_number: ${{ steps.iam.outputs.project_number }}
      workload_identity_provider: ${{ steps.iam.outputs.wif_provider }}
      service_account_email: ${{ steps.iam.outputs.sa_email }}
      firebase_service_account_email: ${{ steps.iam.outputs.firebase_sa_email }}
      user_data_bucket: ${{ steps.storage.outputs.user_data_bucket }}
      user_upload_topic: ${{ steps.pubsub.outputs.upload_topic }}
      user_upload_result_topic: ${{ steps.pubsub.outputs.result_topic }}
      user_upload_result_subscription: ${{ steps.pubsub.outputs.result_subscription }}
      checkpoint_analysis_topic: ${{ steps.pubsub.outputs.checkpoint_analysis_topic }}
      checkpoint_metrics_topic: ${{ steps.pubsub.outputs.checkpoint_metrics_topic }}
      document_analysis_topic: ${{ steps.pubsub.outputs.document_analysis_topic }}
      user_upload_rag_corpus: ${{ steps.rag.outputs.user_upload_rag_corpus }}
      knowledge_base_rag_corpus: ${{ steps.rag.outputs.knowledge_base_rag_corpus }}
      apphosting_backend_id: ${{ steps.apphosting.outputs.backend_id }}
      apphosting_backend_url: ${{ steps.apphosting.outputs.backend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.ORG_WIF_PROVIDER }}
          service_account: ${{ secrets.ORG_ADMIN_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Required APIs
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"

          # Define required APIs
          REQUIRED_APIS=(
            "cloudresourcemanager.googleapis.com"
            "iam.googleapis.com"
            "iamcredentials.googleapis.com"
            "sts.googleapis.com"
            "artifactregistry.googleapis.com"
            "cloudbuild.googleapis.com"
            "run.googleapis.com"
            "aiplatform.googleapis.com"
            "pubsub.googleapis.com"
            "storage.googleapis.com"
            "secretmanager.googleapis.com"
            "cloudfunctions.googleapis.com"
            "eventarc.googleapis.com"
            "firebase.googleapis.com"
            "firestore.googleapis.com"
            "firebaserules.googleapis.com"
            "firebasestorage.googleapis.com"
            "identitytoolkit.googleapis.com"
            "logging.googleapis.com"
            # YouTube Data API v3 (DIY agent search; API key still created in Console → Credentials)
            "youtube.googleapis.com"
            # Optional for OpenTelemetry exports (needed if enabling OTel traces/metrics export)
            "cloudtrace.googleapis.com"
            "monitoring.googleapis.com"
          )

          echo "Checking which APIs need to be enabled..."

          # Get list of enabled services
          ENABLED_SERVICES=$(gcloud services list --enabled --project=$PROJECT_ID --format="value(config.name)" 2>/dev/null)

          # Find APIs that need to be enabled
          APIS_TO_ENABLE=()
          for api in "${REQUIRED_APIS[@]}"; do
            if echo "$ENABLED_SERVICES" | grep -q "^${api}$"; then
              echo "✓ $api (already enabled)"
            else
              echo "⚠ $api (needs enabling)"
              APIS_TO_ENABLE+=("$api")
            fi
          done

          # Enable missing APIs if any
          if [ ${#APIS_TO_ENABLE[@]} -eq 0 ]; then
            echo ""
            echo "✓ All required APIs are already enabled, skipping enable step"
          else
            echo ""
            echo "Enabling ${#APIS_TO_ENABLE[@]} API(s)..."
            gcloud services enable "${APIS_TO_ENABLE[@]}" --project=$PROJECT_ID

            echo "✓ APIs enabled, waiting for propagation..."
            sleep 30
          fi

      - name: Create IAM Resources
        id: iam
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          REGION="${{ needs.resolve-inputs.outputs.region }}"
          SA_EMAIL="githubworkflowdeployment@${PROJECT_ID}.iam.gserviceaccount.com"
          FIREBASE_SA_EMAIL="firebase-apphosting-deployer@${PROJECT_ID}.iam.gserviceaccount.com"

          echo "Checking GitHub workflow service account..."
          # Check if service account already exists
          if gcloud iam service-accounts describe $SA_EMAIL --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Service account already exists: $SA_EMAIL"
          else
            echo "Creating service account..."
            gcloud iam service-accounts create githubworkflowdeployment \
              --display-name="GitHub Workflow Deployment Service Account" \
              --description="Service account used by GitHub Actions for deploying services" \
              --project=$PROJECT_ID
            echo "✓ Service account created: $SA_EMAIL"
          fi

          # Define required roles for GitHub workflow service account
          REQUIRED_ROLES=(
            "roles/run.developer"
            "roles/artifactregistry.writer"
            "roles/cloudbuild.builds.editor"
            "roles/serviceusage.serviceUsageConsumer"
            "roles/iam.serviceAccountUser"
            "roles/artifactregistry.repoAdmin"
            "roles/storage.admin"
            "roles/pubsub.editor"
            "roles/aiplatform.user"
            "roles/cloudfunctions.developer"
            "roles/run.admin"
            "roles/secretmanager.secretAccessor"
            "roles/firebasehosting.admin"
            "roles/firebaserules.admin"
            "roles/firebase.admin"
            "roles/firebasestorage.admin"
            # OpenTelemetry export permissions (Cloud Monitoring + Cloud Trace)
            # - metricWriter: write time series
            # - monitoring.editor: allow creating metric descriptors (required by some exporters on first run)
            "roles/monitoring.metricWriter"
            "roles/monitoring.editor"
            "roles/cloudtrace.agent"
            # Firestore (Datastore API) — agent proxy Cloud Run uses this SA at runtime for chats, sessions, token quota
            "roles/datastore.user"
          )

          echo "Checking IAM role bindings for GitHub workflow service account..."
          # Get current IAM policy
          CURRENT_POLICY=$(gcloud projects get-iam-policy $PROJECT_ID --format=json)

          ROLES_TO_ADD=()
          for role in "${REQUIRED_ROLES[@]}"; do
            # Check if the service account already has this role
            if echo "$CURRENT_POLICY" | jq -e ".bindings[] | select(.role==\"$role\") | .members[] | select(. == \"serviceAccount:${SA_EMAIL}\")" &>/dev/null; then
              echo "✓ $role (already bound)"
            else
              echo "⚠ $role (needs binding)"
              ROLES_TO_ADD+=("$role")
            fi
          done

          # Grant missing roles
          if [ ${#ROLES_TO_ADD[@]} -eq 0 ]; then
            echo "✓ All IAM roles already bound"
          else
            echo "Granting ${#ROLES_TO_ADD[@]} IAM role(s)..."
            for role in "${ROLES_TO_ADD[@]}"; do
              gcloud projects add-iam-policy-binding $PROJECT_ID \
                --member="serviceAccount:${SA_EMAIL}" \
                --role="$role" \
                --condition=None \
                --quiet
            done
            echo "✓ IAM roles granted"
          fi

          # Refresh policy after GitHub workflow SA bindings (needed for idempotent checks below).
          CURRENT_POLICY=$(gcloud projects get-iam-policy $PROJECT_ID --format=json)

          # Cloud Run default runtime SA (when using Compute Engine default). Proxy also uses
          # vars.GCP_SERVICE_ACCOUNT_EMAIL in deploy-homecare-agent-proxy — grant both patterns.
          echo ""
          echo "Ensuring Firestore (Datastore API) access for common Cloud Run runtime service accounts..."
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          DEFAULT_COMPUTE_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          DATASTORE_ROLE="roles/datastore.user"
          for RUNTIME_SA in "$DEFAULT_COMPUTE_SA"; do
            MEMBER="serviceAccount:${RUNTIME_SA}"
            if echo "$CURRENT_POLICY" | jq -e --arg role "$DATASTORE_ROLE" --arg member "$MEMBER" \
              '.bindings[] | select(.role==$role) | .members[] | select(. == $member)' >/dev/null 2>&1; then
              echo "✓ ${DATASTORE_ROLE} already granted to ${RUNTIME_SA}"
            else
              gcloud projects add-iam-policy-binding "$PROJECT_ID" \
                --member="$MEMBER" \
                --role="$DATASTORE_ROLE" \
                --condition=None \
                --quiet
              echo "✓ Granted ${DATASTORE_ROLE} to ${RUNTIME_SA}"
            fi
          done

          echo ""
          echo "Checking Firebase App Hosting deployer service account..."
          # Check if Firebase service account already exists
          if gcloud iam service-accounts describe $FIREBASE_SA_EMAIL --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Firebase service account already exists: $FIREBASE_SA_EMAIL"
          else
            echo "Creating Firebase App Hosting deployer service account..."
            gcloud iam service-accounts create firebase-apphosting-deployer \
              --display-name="Firebase App Hosting Deployer" \
              --description="Service account used by Firebase App Hosting for deploying web applications" \
              --project=$PROJECT_ID
            echo "✓ Firebase service account created: $FIREBASE_SA_EMAIL"
          fi

          # Define required roles for Firebase App Hosting deployer
          FIREBASE_REQUIRED_ROLES=(
            "roles/developerconnect.admin"
            "roles/developerconnect.readTokenAccessor"
            "roles/firebaseapphosting.admin"
            "roles/serviceusage.serviceUsageConsumer"
            "roles/storage.objectViewer"
          )

          echo "Checking IAM role bindings for Firebase service account..."
          # Refresh current IAM policy
          CURRENT_POLICY=$(gcloud projects get-iam-policy $PROJECT_ID --format=json)

          FIREBASE_ROLES_TO_ADD=()
          for role in "${FIREBASE_REQUIRED_ROLES[@]}"; do
            # Check if the Firebase service account already has this role
            if echo "$CURRENT_POLICY" | jq -e ".bindings[] | select(.role==\"$role\") | .members[] | select(. == \"serviceAccount:${FIREBASE_SA_EMAIL}\")" &>/dev/null; then
              echo "✓ $role (already bound)"
            else
              echo "⚠ $role (needs binding)"
              FIREBASE_ROLES_TO_ADD+=("$role")
            fi
          done

          # Grant missing roles to Firebase service account
          if [ ${#FIREBASE_ROLES_TO_ADD[@]} -eq 0 ]; then
            echo "✓ All Firebase IAM roles already bound"
          else
            echo "Granting ${#FIREBASE_ROLES_TO_ADD[@]} Firebase IAM role(s)..."
            for role in "${FIREBASE_ROLES_TO_ADD[@]}"; do
              gcloud projects add-iam-policy-binding $PROJECT_ID \
                --member="serviceAccount:${FIREBASE_SA_EMAIL}" \
                --role="$role" \
                --condition=None \
                --quiet
            done
            echo "✓ Firebase IAM roles granted"
          fi

          echo "Checking Workload Identity Pool..."
          # Check if Workload Identity Pool already exists
          if gcloud iam workload-identity-pools describe github-pool \
            --location="global" \
            --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Workload Identity Pool already exists"
          else
            echo "Creating Workload Identity Pool..."
            gcloud iam workload-identity-pools create github-pool \
              --location="global" \
              --display-name="GitHub Actions Pool" \
              --description="Workload Identity Pool for GitHub Actions" \
              --project=$PROJECT_ID
            echo "✓ Workload Identity Pool created"
          fi

          # Check if Workload Identity Provider already exists
          echo "Checking for existing Workload Identity Provider..."
          EXISTING_PROVIDER=$(gcloud iam workload-identity-pools providers describe github-provider \
            --location="global" \
            --workload-identity-pool="github-pool" \
            --project=$PROJECT_ID \
            --format="value(name)" 2>/dev/null || echo "")

          if [ -n "$EXISTING_PROVIDER" ]; then
            echo "ℹ️  Workload Identity Provider already exists: $EXISTING_PROVIDER"
            echo "   Skipping creation to preserve existing configuration"
            WIF_PROVIDER="$EXISTING_PROVIDER"
          else
            echo "Creating Workload Identity Provider..."
            # Create Workload Identity Provider
            gcloud iam workload-identity-pools providers create-oidc github-provider \
              --location="global" \
              --workload-identity-pool="github-pool" \
              --display-name="GitHub Provider" \
              --attribute-mapping="google.subject=assertion.sub,attribute.actor=assertion.actor,attribute.repository=assertion.repository,attribute.repository_owner=assertion.repository_owner" \
              --attribute-condition="assertion.repository_owner == '${{ github.repository_owner }}'" \
              --issuer-uri="https://token.actions.githubusercontent.com" \
              --project=$PROJECT_ID

            echo "✓ Workload Identity Provider created"
            echo "   Waiting for provider to propagate..."
            sleep 10

            # Get the newly created provider with retries
            for i in {1..5}; do
              WIF_PROVIDER=$(gcloud iam workload-identity-pools providers describe github-provider \
                --location="global" \
                --workload-identity-pool="github-pool" \
                --project=$PROJECT_ID \
                --format="value(name)" 2>/dev/null || echo "")

              if [ -n "$WIF_PROVIDER" ]; then
                echo "✓ Provider verified: $WIF_PROVIDER"
                break
              fi

              echo "   Waiting for provider to be available (attempt $i/5)..."
              sleep 5
            done

            if [ -z "$WIF_PROVIDER" ]; then
              echo "::warning::Provider created but not yet available for describe. Constructing expected name..."
              PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
              WIF_PROVIDER="projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
              echo "   Using constructed provider name: $WIF_PROVIDER"
            fi
          fi

          echo "Checking Workload Identity binding for GitHub workflow service account..."
          # Check if binding already exists
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
          WIF_MEMBER="principalSet://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-pool/attribute.repository/${{ github.repository }}"

          EXISTING_BINDING=$(gcloud iam service-accounts get-iam-policy $SA_EMAIL \
            --project=$PROJECT_ID \
            --format=json | jq -e ".bindings[] | select(.role==\"roles/iam.workloadIdentityUser\") | .members[] | select(. == \"$WIF_MEMBER\")" 2>/dev/null || echo "")

          if [ -n "$EXISTING_BINDING" ]; then
            echo "✓ Workload Identity binding already exists"
          else
            echo "Creating Workload Identity binding..."
            gcloud iam service-accounts add-iam-policy-binding $SA_EMAIL \
              --project=$PROJECT_ID \
              --role="roles/iam.workloadIdentityUser" \
              --member="$WIF_MEMBER" \
              --quiet
            echo "✓ Workload Identity binding created"
          fi

          echo ""
          echo "Checking Workload Identity binding for Firebase service account..."
          # Check if Firebase service account has workload identity binding
          FIREBASE_EXISTING_BINDING=$(gcloud iam service-accounts get-iam-policy $FIREBASE_SA_EMAIL \
            --project=$PROJECT_ID \
            --format=json | jq -e ".bindings[] | select(.role==\"roles/iam.workloadIdentityUser\") | .members[] | select(. == \"$WIF_MEMBER\")" 2>/dev/null || echo "")

          if [ -n "$FIREBASE_EXISTING_BINDING" ]; then
            echo "✓ Firebase Workload Identity binding already exists"
          else
            echo "Creating Workload Identity binding for Firebase service account..."
            gcloud iam service-accounts add-iam-policy-binding $FIREBASE_SA_EMAIL \
              --project=$PROJECT_ID \
              --role="roles/iam.workloadIdentityUser" \
              --member="$WIF_MEMBER" \
              --quiet
            echo "✓ Firebase Workload Identity binding created"
          fi

          echo ""
          echo "Checking Service Account User permission for Firebase deployer..."
          # Grant Firebase deployer permission to act as the compute service account
          COMPUTE_SA="firebase-app-hosting-compute@${PROJECT_ID}.iam.gserviceaccount.com"

          # Only attempt binding if the compute service account exists
          if gcloud iam service-accounts describe "$COMPUTE_SA" --project="$PROJECT_ID" &>/dev/null; then
            # Check if the binding already exists
            COMPUTE_SA_BINDING=$(gcloud iam service-accounts get-iam-policy "$COMPUTE_SA" \
              --project="$PROJECT_ID" \
              --format=json 2>/dev/null | jq -e ".bindings[] | select(.role==\"roles/iam.serviceAccountUser\") | .members[] | select(. == \"serviceAccount:${FIREBASE_SA_EMAIL}\")" 2>/dev/null || echo "")

            if [ -n "$COMPUTE_SA_BINDING" ]; then
              echo "✓ Firebase deployer already has permission to act as compute service account"
            else
              echo "Granting Firebase deployer permission to act as compute service account..."
              gcloud iam service-accounts add-iam-policy-binding "$COMPUTE_SA" \
                --project="$PROJECT_ID" \
                --role="roles/iam.serviceAccountUser" \
                --member="serviceAccount:${FIREBASE_SA_EMAIL}" \
                --quiet
              echo "✓ Service Account User permission granted"
            fi
          else
            echo "⚠️  Compute service account $COMPUTE_SA does not exist yet; skipping Service Account User binding."
            echo "    You can grant this after Firebase App Hosting creates the compute service account."
          fi

          # Output values
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
          echo "project_number=$PROJECT_NUMBER" >> $GITHUB_OUTPUT
          echo "sa_email=$SA_EMAIL" >> $GITHUB_OUTPUT
          echo "firebase_sa_email=$FIREBASE_SA_EMAIL" >> $GITHUB_OUTPUT
          echo "wif_provider=$WIF_PROVIDER" >> $GITHUB_OUTPUT

      - name: Configure Cloud Build Service Account Permissions
        id: cloudbuild_permissions
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')

          # Cloud Build default service account
          CLOUDBUILD_SA="${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com"
          # Compute Engine default service account (used by Cloud Build)
          COMPUTE_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"

          echo "Configuring Cloud Build permissions..."
          echo "Cloud Build SA: $CLOUDBUILD_SA"
          echo "Compute Engine SA: $COMPUTE_SA"

          # Get current IAM policy
          CURRENT_POLICY=$(gcloud projects get-iam-policy $PROJECT_ID --format=json)

          # Roles needed for Cloud Build to work with Cloud Run source deployments
          CLOUDBUILD_ROLES=(
            "roles/storage.admin"
            "roles/logging.logWriter"
            "roles/artifactregistry.writer"
          )

          COMPUTE_ROLES=(
            "roles/storage.objectViewer"
            "roles/artifactregistry.writer"
          )

          # Grant roles to Cloud Build service account
          echo "Checking Cloud Build service account roles..."
          ROLES_TO_ADD=()
          for role in "${CLOUDBUILD_ROLES[@]}"; do
            if echo "$CURRENT_POLICY" | jq -e ".bindings[] | select(.role==\"$role\") | .members[] | select(. == \"serviceAccount:${CLOUDBUILD_SA}\")" &>/dev/null; then
              echo "✓ $role (already bound to Cloud Build SA)"
            else
              echo "⚠ $role (needs binding to Cloud Build SA)"
              ROLES_TO_ADD+=("$role")
            fi
          done

          if [ ${#ROLES_TO_ADD[@]} -gt 0 ]; then
            echo "Granting ${#ROLES_TO_ADD[@]} role(s) to Cloud Build service account..."
            for role in "${ROLES_TO_ADD[@]}"; do
              gcloud projects add-iam-policy-binding $PROJECT_ID \
                --member="serviceAccount:${CLOUDBUILD_SA}" \
                --role="$role" \
                --condition=None \
                --quiet
            done
            echo "✓ Cloud Build IAM roles granted"
          else
            echo "✓ All Cloud Build roles already bound"
          fi

          # Grant roles to Compute Engine default service account
          echo ""
          echo "Checking Compute Engine service account roles..."
          CURRENT_POLICY=$(gcloud projects get-iam-policy $PROJECT_ID --format=json)
          COMPUTE_ROLES_TO_ADD=()
          for role in "${COMPUTE_ROLES[@]}"; do
            if echo "$CURRENT_POLICY" | jq -e ".bindings[] | select(.role==\"$role\") | .members[] | select(. == \"serviceAccount:${COMPUTE_SA}\")" &>/dev/null; then
              echo "✓ $role (already bound to Compute SA)"
            else
              echo "⚠ $role (needs binding to Compute SA)"
              COMPUTE_ROLES_TO_ADD+=("$role")
            fi
          done

          if [ ${#COMPUTE_ROLES_TO_ADD[@]} -gt 0 ]; then
            echo "Granting ${#COMPUTE_ROLES_TO_ADD[@]} role(s) to Compute Engine service account..."
            for role in "${COMPUTE_ROLES_TO_ADD[@]}"; do
              gcloud projects add-iam-policy-binding $PROJECT_ID \
                --member="serviceAccount:${COMPUTE_SA}" \
                --role="$role" \
                --condition=None \
                --quiet
            done
            echo "✓ Compute Engine IAM roles granted"
          else
            echo "✓ All Compute Engine roles already bound"
          fi

      - name: Create Artifact Registry Repository
        id: artifact_registry
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          REGION="${{ needs.resolve-inputs.outputs.region }}"
          REPO_NAME="cloud-run-source-deploy"

          echo "Checking Artifact Registry repository: $REPO_NAME"

          # Check if repository already exists
          if gcloud artifacts repositories describe $REPO_NAME \
            --location=$REGION \
            --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Artifact Registry repository already exists: $REPO_NAME"
          else
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create $REPO_NAME \
              --repository-format=docker \
              --location=$REGION \
              --description="Docker repository for Cloud Run source deployments" \
              --project=$PROJECT_ID
            echo "✓ Artifact Registry repository created: $REPO_NAME"
          fi

      - name: Create Storage Buckets
        id: storage
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          REGION="${{ needs.resolve-inputs.outputs.region }}"
          ENV="${{ inputs.environment_name }}"

          # Create user data bucket
          USER_DATA_BUCKET="homegeek-user-data-${ENV}"
          echo "Checking user data bucket: $USER_DATA_BUCKET"

          if gsutil ls -b gs://${USER_DATA_BUCKET}/ &>/dev/null; then
            echo "✓ User data bucket already exists: $USER_DATA_BUCKET"
          else
            echo "Creating user data bucket..."
            gsutil mb -p $PROJECT_ID -l $REGION -b on gs://${USER_DATA_BUCKET}/

            # Enable versioning
            gsutil versioning set on gs://${USER_DATA_BUCKET}/

            # Set lifecycle policy (delete after 90 days)
            echo '{"lifecycle":{"rule":[{"action":{"type":"Delete"},"condition":{"age":90}}]}}' > /tmp/lifecycle.json
            gsutil lifecycle set /tmp/lifecycle.json gs://${USER_DATA_BUCKET}/

            # Set CORS policy
            echo '[{"origin":["*"],"method":["GET","HEAD","PUT","POST","DELETE"],"responseHeader":["*"],"maxAgeSeconds":3600}]' > /tmp/cors.json
            gsutil cors set /tmp/cors.json gs://${USER_DATA_BUCKET}/

            # Set uniform bucket-level access
            gsutil uniformbucketlevelaccess set on gs://${USER_DATA_BUCKET}/

            echo "✓ User data bucket created: $USER_DATA_BUCKET"
          fi

          # Create agent catalog bucket (per-environment)
          CATALOG_BUCKET="homegeek-catalog-${ENV}"
          echo "Checking catalog bucket: $CATALOG_BUCKET"

          if gsutil ls -b gs://${CATALOG_BUCKET}/ &>/dev/null; then
            echo "✓ Catalog bucket already exists: $CATALOG_BUCKET"
          else
            echo "Creating catalog bucket..."
            gsutil mb -p $PROJECT_ID -l $REGION -b on gs://${CATALOG_BUCKET}/
            gsutil uniformbucketlevelaccess set on gs://${CATALOG_BUCKET}/
            echo "✓ Catalog bucket created: $CATALOG_BUCKET"
          fi

          # Output values
          echo "user_data_bucket=$USER_DATA_BUCKET" >> $GITHUB_OUTPUT

      - name: Create Pub/Sub Resources
        id: pubsub
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          ENV="${{ inputs.environment_name }}"

          # Create user upload topic
          UPLOAD_TOPIC="user-upload-topic-${ENV}"
          echo "Checking topic: $UPLOAD_TOPIC"

          if gcloud pubsub topics describe $UPLOAD_TOPIC --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Topic already exists: $UPLOAD_TOPIC"
          else
            echo "Creating topic: $UPLOAD_TOPIC"
            gcloud pubsub topics create $UPLOAD_TOPIC \
              --project=$PROJECT_ID \
              --message-retention-duration=7d
            echo "✓ Topic created: $UPLOAD_TOPIC"
          fi

          # Create user upload subscription
          UPLOAD_SUB="user-upload-subscription-${ENV}"
          echo "Checking subscription: $UPLOAD_SUB"

          if gcloud pubsub subscriptions describe $UPLOAD_SUB --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Subscription already exists: $UPLOAD_SUB"
          else
            echo "Creating subscription: $UPLOAD_SUB"
            gcloud pubsub subscriptions create $UPLOAD_SUB \
              --topic=$UPLOAD_TOPIC \
              --project=$PROJECT_ID \
              --ack-deadline=60 \
              --message-retention-duration=7d \
              --min-retry-delay=10s \
              --max-retry-delay=600s
            echo "✓ Subscription created: $UPLOAD_SUB"
          fi

          # Create user upload result topic
          RESULT_TOPIC="user-upload-result-topic-${ENV}"
          echo "Checking topic: $RESULT_TOPIC"

          if gcloud pubsub topics describe $RESULT_TOPIC --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Topic already exists: $RESULT_TOPIC"
          else
            echo "Creating topic: $RESULT_TOPIC"
            gcloud pubsub topics create $RESULT_TOPIC \
              --project=$PROJECT_ID \
              --message-retention-duration=7d
            echo "✓ Topic created: $RESULT_TOPIC"
          fi

          # Create user upload result subscription
          RESULT_SUB="user-upload-result-subscription-${ENV}"
          echo "Checking subscription: $RESULT_SUB"

          if gcloud pubsub subscriptions describe $RESULT_SUB --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Subscription already exists: $RESULT_SUB"
          else
            echo "Creating subscription: $RESULT_SUB"
            gcloud pubsub subscriptions create $RESULT_SUB \
              --topic=$RESULT_TOPIC \
              --project=$PROJECT_ID \
              --ack-deadline=60 \
              --message-retention-duration=7d \
              --min-retry-delay=10s \
              --max-retry-delay=600s
            echo "✓ Subscription created: $RESULT_SUB"
          fi

          # Create checkpoint analysis topic
          CHECKPOINT_TOPIC="checkpoint-analysis-topic-${ENV}"
          echo "Checking topic: $CHECKPOINT_TOPIC"

          if gcloud pubsub topics describe $CHECKPOINT_TOPIC --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Topic already exists: $CHECKPOINT_TOPIC"
          else
            echo "Creating topic: $CHECKPOINT_TOPIC"
            gcloud pubsub topics create $CHECKPOINT_TOPIC \
              --project=$PROJECT_ID \
              --message-retention-duration=7d
            echo "✓ Topic created: $CHECKPOINT_TOPIC"
          fi

          # Create checkpoint metrics aggregation topic (for mobile analytics refresh)
          CHECKPOINT_METRICS_TOPIC="checkpoint-metrics-topic-${ENV}"
          echo "Checking topic: $CHECKPOINT_METRICS_TOPIC"

          if gcloud pubsub topics describe $CHECKPOINT_METRICS_TOPIC --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Topic already exists: $CHECKPOINT_METRICS_TOPIC"
          else
            echo "Creating topic: $CHECKPOINT_METRICS_TOPIC"
            gcloud pubsub topics create $CHECKPOINT_METRICS_TOPIC \
              --project=$PROJECT_ID \
              --message-retention-duration=7d
            echo "✓ Topic created: $CHECKPOINT_METRICS_TOPIC"
          fi

          # Create document analysis topic (async Gemini extraction for user docs)
          DOCUMENT_ANALYSIS_TOPIC="document-analysis-topic-${ENV}"
          echo "Checking topic: $DOCUMENT_ANALYSIS_TOPIC"

          if gcloud pubsub topics describe $DOCUMENT_ANALYSIS_TOPIC --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Topic already exists: $DOCUMENT_ANALYSIS_TOPIC"
          else
            echo "Creating topic: $DOCUMENT_ANALYSIS_TOPIC"
            gcloud pubsub topics create $DOCUMENT_ANALYSIS_TOPIC \
              --project=$PROJECT_ID \
              --message-retention-duration=7d
            echo "✓ Topic created: $DOCUMENT_ANALYSIS_TOPIC"
          fi

          # Output values
          echo "upload_topic=$UPLOAD_TOPIC" >> $GITHUB_OUTPUT
          echo "result_topic=$RESULT_TOPIC" >> $GITHUB_OUTPUT
          echo "result_subscription=$RESULT_SUB" >> $GITHUB_OUTPUT
          echo "checkpoint_analysis_topic=$CHECKPOINT_TOPIC" >> $GITHUB_OUTPUT
          echo "checkpoint_metrics_topic=$CHECKPOINT_METRICS_TOPIC" >> $GITHUB_OUTPUT
          echo "document_analysis_topic=$DOCUMENT_ANALYSIS_TOPIC" >> $GITHUB_OUTPUT

      - name: Configure Pub/Sub dead letter queues
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          ENV="${{ inputs.environment_name }}"
          chmod +x .github/scripts/apply-pubsub-dlq.sh
          .github/scripts/apply-pubsub-dlq.sh "${PROJECT_ID}" "${ENV}"

      - name: Enable Firebase Services
        id: firebase_enable
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"

          echo "Enabling Firebase services for project: $PROJECT_ID"
          echo "Waiting for Firebase Management API to be fully ready..."
          sleep 30

          # Check if Firebase project is already enabled
          echo "Checking if Firebase is enabled for project..."
          FIREBASE_CHECK=$(curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "x-goog-user-project: $PROJECT_ID" \
            "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID" 2>&1)

          if echo "$FIREBASE_CHECK" | grep -q "\"projectId\": \"$PROJECT_ID\""; then
            echo "✓ Firebase project already enabled"
          else
            echo "Enabling Firebase for project..."

            # Retry loop for adding Firebase to the GCP project
            MAX_RETRIES=5
            RETRY_COUNT=0
            SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if [ $RETRY_COUNT -gt 0 ]; then
                echo "Retry attempt $RETRY_COUNT of $MAX_RETRIES..."
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi

              # Add Firebase to the GCP project
              ADD_FIREBASE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
                -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                -H "Content-Type: application/json" \
                -H "x-goog-user-project: $PROJECT_ID" \
                "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID:addFirebase")

              HTTP_CODE=$(echo "$ADD_FIREBASE_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
              RESPONSE_BODY=$(echo "$ADD_FIREBASE_RESPONSE" | sed '/HTTP_CODE:/d')

              echo "Firebase API Response Code: $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                echo "✓ Firebase enabled successfully"
                echo "$RESPONSE_BODY" | jq '.' || echo "$RESPONSE_BODY"
                SUCCESS=true
                break
              elif echo "$RESPONSE_BODY" | grep -q "ALREADY_EXISTS"; then
                echo "✓ Firebase already enabled for this project"
                SUCCESS=true
                break
              elif echo "$RESPONSE_BODY" | grep -q "SERVICE_DISABLED"; then
                echo "⚠️  Firebase Management API not fully propagated yet (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
                RETRY_COUNT=$((RETRY_COUNT + 1))
              else
                echo "⚠️  Unexpected error (HTTP $HTTP_CODE)"
                echo "$RESPONSE_BODY"
                RETRY_COUNT=$((RETRY_COUNT + 1))
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ Failed to enable Firebase after $MAX_RETRIES attempts"
              echo "Last response: $RESPONSE_BODY"
              exit 1
            fi

            echo "   Waiting for Firebase initialization..."
            sleep 15
          fi

          # Verify Firebase is now accessible
          echo ""
          echo "Verifying Firebase project..."
          FIREBASE_VERIFY=$(curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "x-goog-user-project: $PROJECT_ID" \
            "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID" 2>&1)

          if echo "$FIREBASE_VERIFY" | grep -q "\"projectId\": \"$PROJECT_ID\""; then
            echo "✓ Firebase project verified and accessible"
            # Extract and display the Firebase project details
            echo "$FIREBASE_VERIFY" | jq -r '"  Project Number: " + .projectNumber, "  Display Name: " + (.displayName // "N/A")' 2>/dev/null || true
          else
            echo "⚠️  Warning: Firebase project may not be fully initialized yet"
            echo "   This might resolve itself, continuing with setup..."
          fi

          # Enable Firestore
          echo ""
          echo "Checking Firestore database..."
          FIRESTORE_DB=$(gcloud firestore databases list --project=$PROJECT_ID --format="value(name)" 2>/dev/null || echo "")

          if [ -n "$FIRESTORE_DB" ]; then
            echo "✓ Firestore database already exists: $FIRESTORE_DB"
          else
            echo "Creating Firestore database in native mode..."
            gcloud firestore databases create --location=${{ needs.resolve-inputs.outputs.region }} \
              --type=firestore-native \
              --project=$PROJECT_ID
            echo "✓ Firestore database created"
          fi

          # Initialize Firebase Storage
          echo ""
          echo "Initializing Firebase Storage..."
          STORAGE_BUCKET="${PROJECT_ID}.firebasestorage.app"

          # Check if Firebase Storage bucket exists
          if gsutil ls -b gs://${STORAGE_BUCKET}/ &>/dev/null; then
            echo "✓ Firebase Storage bucket already exists: $STORAGE_BUCKET"
          else
            echo "Creating Firebase Storage bucket via Firebase Management API..."
            # Use the addGoogleCloudStorageBucket API to properly initialize Firebase Storage
            STORAGE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
              -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              -H "Content-Type: application/json" \
              -H "x-goog-user-project: $PROJECT_ID" \
              "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID:addGoogleCloudStorageBucket" \
              -d "{\"bucket\": \"$STORAGE_BUCKET\"}")

            STORAGE_HTTP_CODE=$(echo "$STORAGE_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
            STORAGE_BODY=$(echo "$STORAGE_RESPONSE" | sed '/HTTP_CODE:/d')

            echo "Storage API Response Code: $STORAGE_HTTP_CODE"

            if [ "$STORAGE_HTTP_CODE" = "200" ] || [ "$STORAGE_HTTP_CODE" = "201" ]; then
              echo "✓ Firebase Storage bucket created: $STORAGE_BUCKET"
              echo "$STORAGE_BODY" | jq '.' 2>/dev/null || echo "$STORAGE_BODY"
            elif echo "$STORAGE_BODY" | grep -q "ALREADY_EXISTS\|already exists"; then
              echo "✓ Firebase Storage bucket already exists: $STORAGE_BUCKET"
            else
              echo "⚠️  Warning: Firebase Storage initialization may have failed (HTTP $STORAGE_HTTP_CODE)"
              echo "$STORAGE_BODY"
              echo "   Attempting alternative initialization method..."

              # Alternative: Try to provision the default bucket
              ALT_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
                -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                -H "Content-Type: application/json" \
                -H "x-goog-user-project: $PROJECT_ID" \
                "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/defaultBucket" \
                -d "{}")

              ALT_HTTP_CODE=$(echo "$ALT_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)

              if [ "$ALT_HTTP_CODE" = "200" ] || [ "$ALT_HTTP_CODE" = "201" ]; then
                echo "✓ Firebase Storage initialized via alternative method"
              else
                echo "⚠️  Could not initialize Firebase Storage automatically"
                echo "   The bucket may be created during first Firebase CLI deployment"
              fi
            fi

            # Wait for bucket propagation
            echo "Waiting for Firebase Storage to propagate..."
            sleep 15
          fi

          # Enable Firebase Authentication
          echo ""
          echo "Enabling Firebase Authentication..."

          # Check current auth configuration
          AUTH_CONFIG=$(curl -s -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "x-goog-user-project: $PROJECT_ID" \
            "https://identitytoolkit.googleapis.com/v2/projects/$PROJECT_ID/config" 2>&1)

          AUTH_CHECK_CODE=$(echo "$AUTH_CONFIG" | grep "HTTP_CODE:" | cut -d: -f2)
          AUTH_CHECK_BODY=$(echo "$AUTH_CONFIG" | sed '/HTTP_CODE:/d')

          if [ "$AUTH_CHECK_CODE" = "404" ] || echo "$AUTH_CHECK_BODY" | grep -q "CONFIGURATION_NOT_FOUND"; then
            echo "Initializing Firebase Authentication configuration..."

            # Initialize Identity Platform configuration by creating it
            INIT_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X PATCH \
              -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              -H "Content-Type: application/json" \
              -H "x-goog-user-project: $PROJECT_ID" \
              "https://identitytoolkit.googleapis.com/v2/projects/$PROJECT_ID/config?updateMask=signIn.email.enabled,signIn.anonymous.enabled" \
              -d '{
                "signIn": {
                  "email": {
                    "enabled": true,
                    "passwordRequired": true
                  }
                }
              }')

            INIT_HTTP_CODE=$(echo "$INIT_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
            INIT_BODY=$(echo "$INIT_RESPONSE" | sed '/HTTP_CODE:/d')

            if [ "$INIT_HTTP_CODE" = "200" ] || [ "$INIT_HTTP_CODE" = "201" ]; then
              echo "✓ Firebase Authentication initialized and configured successfully"
              echo "  - Email/Password authentication: enabled"
            else
              echo "⚠️  Warning: Authentication initialization may have failed (HTTP $INIT_HTTP_CODE)"
              echo "$INIT_BODY"
              echo "   You may need to enable authentication providers manually through Firebase Console"
            fi
          elif echo "$AUTH_CHECK_BODY" | grep -q "\"signIn\""; then
            echo "✓ Firebase Authentication already configured"
          else
            echo "Configuring Firebase Authentication providers..."

            # Enable Email/Password and Anonymous authentication
            AUTH_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X PATCH \
              -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              -H "Content-Type: application/json" \
              -H "x-goog-user-project: $PROJECT_ID" \
              "https://identitytoolkit.googleapis.com/v2/projects/$PROJECT_ID/config?updateMask=signIn.email.enabled,signIn.anonymous.enabled" \
              -d '{
                "signIn": {
                  "email": {
                    "enabled": true,
                    "passwordRequired": true
                  },
                  "anonymous": {
                    "enabled": true
                  }
                }
              }')

            AUTH_HTTP_CODE=$(echo "$AUTH_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
            AUTH_BODY=$(echo "$AUTH_RESPONSE" | sed '/HTTP_CODE:/d')

            if [ "$AUTH_HTTP_CODE" = "200" ] || [ "$AUTH_HTTP_CODE" = "201" ]; then
              echo "✓ Firebase Authentication enabled successfully"
              echo "  - Email/Password authentication: enabled"
              echo "  - Anonymous authentication: enabled"
            else
              echo "⚠️  Warning: Authentication configuration may have failed (HTTP $AUTH_HTTP_CODE)"
              echo "$AUTH_BODY"
              echo "   You may need to enable authentication providers manually through Firebase Console"
            fi
          fi

      - name: Deploy Firebase Configuration
        id: firebase_deploy
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"

          echo "Installing Firebase CLI..."
          npm install -g firebase-tools

          echo "Authenticating with Firebase using gcloud credentials..."
          # Set the quota project to the target project
          gcloud config set project $PROJECT_ID

          # Get access token and use it with Firebase CLI
          export FIREBASE_TOKEN=$(gcloud auth application-default print-access-token)

          # Set quota project environment variable for API calls
          export CLOUDSDK_CORE_PROJECT=$PROJECT_ID
          export GOOGLE_CLOUD_QUOTA_PROJECT=$PROJECT_ID

          echo "Switching to webapp directory..."
          cd apps/webapp

          echo "Deploying Firestore rules..."
          firebase deploy --only firestore:rules --project=$PROJECT_ID --token "$FIREBASE_TOKEN" --non-interactive

          echo "Deploying Firestore indexes..."
          firebase deploy --only firestore:indexes --project=$PROJECT_ID --token "$FIREBASE_TOKEN" --non-interactive

          echo "Deploying Storage rules..."
          # Deploy Storage rules (show errors but allow to continue)
          set +e  # Disable exit on error temporarily
          firebase deploy --only storage \
            --project=$PROJECT_ID \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
          STORAGE_EXIT_CODE=$?
          set -e  # Re-enable exit on error

          if [ $STORAGE_EXIT_CODE -eq 0 ]; then
            echo "✓ Storage rules deployed successfully"
          else
            echo ""
            echo "⚠️  Storage rules deployment failed with exit code: $STORAGE_EXIT_CODE"
            echo "   This is not critical - continuing with workflow..."
            echo "   You can deploy storage rules manually later if needed"
          fi

          echo "✓ Firebase configuration deployed successfully"

      - name: Create App Hosting Backend
        id: apphosting
        continue-on-error: true
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          REGION="${{ needs.resolve-inputs.outputs.region }}"
          ENV="${{ inputs.environment_name }}"
          BACKEND_ID="${ENV}"

          echo "Creating Firebase App Hosting backend..."
          echo "Backend ID: $BACKEND_ID"
          echo "Project: $PROJECT_ID"
          echo "Region: $REGION"

          # Get access token for Firebase CLI
          export FIREBASE_TOKEN=$(gcloud auth application-default print-access-token)

          # Set quota project environment variables
          export CLOUDSDK_CORE_PROJECT=$PROJECT_ID
          export GOOGLE_CLOUD_QUOTA_PROJECT=$PROJECT_ID

          # Check if backend already exists
          echo "Checking for existing backend..."
          BACKENDS_LIST=$(firebase apphosting:backends:list \
            --project=$PROJECT_ID \
            --token "$FIREBASE_TOKEN" 2>&1 || echo "")

          if echo "$BACKENDS_LIST" | grep -q "$BACKEND_ID"; then
            echo "✓ App Hosting backend already exists: $BACKEND_ID"
          else
            echo "Creating App Hosting backend..."
            # Create the backend using Firebase CLI
            # Capture both stdout and stderr
            CREATE_OUTPUT=$(firebase apphosting:backends:create $BACKEND_ID \
              --project=$PROJECT_ID \
              --token "$FIREBASE_TOKEN" \
              --primary-region=$REGION \
              --root-dir=apps/webapp \
              --non-interactive 2>&1)
            CREATE_EXIT_CODE=$?

            if [ $CREATE_EXIT_CODE -eq 0 ]; then
              echo "✓ App Hosting backend created: $BACKEND_ID"
              echo "$CREATE_OUTPUT"
            else
              echo "⚠️  Failed to create App Hosting backend via CLI (exit code: $CREATE_EXIT_CODE)"
              echo ""
              echo "Error output:"
              echo "$CREATE_OUTPUT"
              echo ""
              echo "This may require manual setup through Firebase Console."
              echo "Common reasons for failure:"
              echo "  - GitHub repository not connected to Firebase"
              echo "  - Missing required permissions"
              echo "  - Invalid configuration in apphosting.yaml"
              echo ""
              echo "See README-environment-setup.md for manual setup instructions"
              echo "Continuing with workflow..."
            fi
          fi

          # Output the backend ID
          echo "backend_id=$BACKEND_ID" >> $GITHUB_OUTPUT

          # Construct the backend URL (will be available after first deployment)
          BACKEND_URL="https://${BACKEND_ID}--${PROJECT_ID}.${REGION}.hosted.app"
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

          echo ""
          echo "✓ App Hosting backend ready for deployments"
          echo "   Backend ID: $BACKEND_ID"
          echo "   URL (after first deployment): $BACKEND_URL"

      - name: Create RAG Corpora
        id: rag
        continue-on-error: true
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          REGION="${{ needs.resolve-inputs.outputs.region }}"
          ENV="${{ inputs.environment_name }}"

          # RAG API has capacity restrictions in us-central1 and us-east4 for new projects
          # Map to supported regions: https://cloud.google.com/vertex-ai/generative-ai/docs/rag-engine/rag-overview#supported-regions
          case "$REGION" in
            us-central1|us-east4)
              RAG_REGION="us-west1"
              echo "⚠️  RAG not available in $REGION for new projects, using $RAG_REGION instead"
              ;;
            europe-west*)
              RAG_REGION="europe-west4"
              ;;
            asia-*)
              RAG_REGION="asia-southeast1"
              ;;
            *)
              RAG_REGION="us-west1"  # Default fallback to a supported region
              ;;
          esac

          echo "Managing RAG corpora for project: $PROJECT_ID"
          echo "Infrastructure region: $REGION, RAG region: $RAG_REGION"

          # Setup for RAG API calls
          BASE_URL="https://${RAG_REGION}-aiplatform.googleapis.com/v1/projects/${PROJECT_ID}/locations/${RAG_REGION}/ragCorpora"
          AUTH_HEADER="Authorization: Bearer $(gcloud auth print-access-token)"

          # Get project number for RAG service account
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
          RAG_SA="service-${PROJECT_NUMBER}@gcp-sa-vertex-rag.iam.gserviceaccount.com"

          # Check for existing User Upload RAG Corpus
          echo "Checking for existing User Upload RAG corpus..."
          USER_UPLOAD_DISPLAY_NAME="user-upload-rag-corpus-${ENV}"

          EXISTING_CORPORA=$(curl -s -X GET \
            -H "$AUTH_HEADER" \
            "$BASE_URL" 2>&1 || echo "")

          USER_UPLOAD_CORPUS=$(echo "$EXISTING_CORPORA" | jq -r ".ragCorpora[]? | select(.displayName==\"$USER_UPLOAD_DISPLAY_NAME\") | .name" 2>/dev/null || echo "")

          if [ -n "$USER_UPLOAD_CORPUS" ] && [ "$USER_UPLOAD_CORPUS" != "null" ]; then
            echo "✓ User upload RAG corpus already exists: $USER_UPLOAD_CORPUS"
            echo "user_upload_rag_corpus=$USER_UPLOAD_CORPUS" >> $GITHUB_OUTPUT
          else
            echo "Creating User Upload RAG corpus..."
            USER_UPLOAD_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              "$BASE_URL" \
              -d "{
                \"displayName\": \"$USER_UPLOAD_DISPLAY_NAME\",
                \"description\": \"User upload RAG corpus for ${ENV} environment\"
              }" 2>&1) || true

            # Extract HTTP code and body
            HTTP_CODE=$(echo "$USER_UPLOAD_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
            RESPONSE_BODY=$(echo "$USER_UPLOAD_RESPONSE" | sed '/HTTP_CODE:/d')

            echo "API Response Status: $HTTP_CODE"

            # Only try to parse JSON if we got a 200 response
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              USER_UPLOAD_CORPUS=$(echo "$RESPONSE_BODY" | jq -r '.name // empty' 2>/dev/null)
              if [ -n "$USER_UPLOAD_CORPUS" ] && [ "$USER_UPLOAD_CORPUS" != "null" ]; then
                echo "✓ User upload RAG corpus created: $USER_UPLOAD_CORPUS"
                echo "user_upload_rag_corpus=$USER_UPLOAD_CORPUS" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Could not extract corpus name from response"
                echo "Response: $RESPONSE_BODY"
                echo "user_upload_rag_corpus=placeholder" >> $GITHUB_OUTPUT
              fi
            else
              echo "⚠️ User upload RAG corpus creation failed with HTTP $HTTP_CODE"
              echo "Response: $RESPONSE_BODY"
              echo "user_upload_rag_corpus=placeholder" >> $GITHUB_OUTPUT
            fi
          fi

          # Check for existing Knowledge Base RAG Corpus
          echo "Checking for existing Knowledge Base RAG corpus..."
          KB_DISPLAY_NAME="knowledge-base-rag-corpus-${ENV}"

          KNOWLEDGE_BASE_CORPUS=$(echo "$EXISTING_CORPORA" | jq -r ".ragCorpora[]? | select(.displayName==\"$KB_DISPLAY_NAME\") | .name" 2>/dev/null || echo "")

          if [ -n "$KNOWLEDGE_BASE_CORPUS" ] && [ "$KNOWLEDGE_BASE_CORPUS" != "null" ]; then
            echo "✓ Knowledge base RAG corpus already exists: $KNOWLEDGE_BASE_CORPUS"
            echo "knowledge_base_rag_corpus=$KNOWLEDGE_BASE_CORPUS" >> $GITHUB_OUTPUT
          else
            echo "Creating Knowledge Base RAG corpus..."
            KNOWLEDGE_BASE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              "$BASE_URL" \
              -d "{
                \"displayName\": \"$KB_DISPLAY_NAME\",
                \"description\": \"Knowledge base RAG corpus for ${ENV} environment\"
              }" 2>&1) || true

            # Extract HTTP code and body
            KB_HTTP_CODE=$(echo "$KNOWLEDGE_BASE_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
            KB_RESPONSE_BODY=$(echo "$KNOWLEDGE_BASE_RESPONSE" | sed '/HTTP_CODE:/d')

            echo "API Response Status: $KB_HTTP_CODE"

            # Only try to parse JSON if we got a 200 response
            if [ "$KB_HTTP_CODE" = "200" ] || [ "$KB_HTTP_CODE" = "201" ]; then
              KNOWLEDGE_BASE_CORPUS=$(echo "$KB_RESPONSE_BODY" | jq -r '.name // empty' 2>/dev/null)
              if [ -n "$KNOWLEDGE_BASE_CORPUS" ] && [ "$KNOWLEDGE_BASE_CORPUS" != "null" ]; then
                echo "✓ Knowledge base RAG corpus created: $KNOWLEDGE_BASE_CORPUS"
                echo "knowledge_base_rag_corpus=$KNOWLEDGE_BASE_CORPUS" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Could not extract corpus name from response"
                echo "Response: $KB_RESPONSE_BODY"
                echo "knowledge_base_rag_corpus=placeholder" >> $GITHUB_OUTPUT
              fi
            else
              echo "⚠️ Knowledge base RAG corpus creation failed with HTTP $KB_HTTP_CODE"
              echo "Response: $KB_RESPONSE_BODY"
              echo "knowledge_base_rag_corpus=placeholder" >> $GITHUB_OUTPUT
            fi
          fi

          # Grant RAG service account access to storage (only if at least one corpus was created)
          if [ -n "$USER_UPLOAD_CORPUS" ] && [ "$USER_UPLOAD_CORPUS" != "null" ] && [ "$USER_UPLOAD_CORPUS" != "placeholder" ]; then
            echo "Granting RAG service account storage permissions..."
            if gcloud projects add-iam-policy-binding $PROJECT_ID \
              --member="serviceAccount:${RAG_SA}" \
              --role="roles/storage.objectAdmin" \
              --condition=None \
              --quiet 2>/dev/null; then
              echo "✓ RAG service account permissions granted"
            else
              echo "⚠️ Failed to grant RAG service account permissions (service account may not exist yet)"
              echo "   The RAG service account is: $RAG_SA"
              echo "   You may need to grant permissions manually after the first RAG operation"
            fi

            # Grant Reasoning Engine service account permissions to access RAG corpora
            echo ""
            echo "Granting Reasoning Engine service account RAG access permissions..."
            REASONING_ENGINE_SA="service-${PROJECT_NUMBER}@gcp-sa-aiplatform-re.iam.gserviceaccount.com"

            # Create custom role for RAG access (applies to all RAG corpora in project)
            ROLE_ID="ragCorpusAccessRole"
            ROLE_TITLE="RAG Corpus Access Role"
            ROLE_DESCRIPTION="Custom role with permissions to access all RAG corpora (user upload and knowledge base)"
            PERMISSIONS="aiplatform.ragCorpora.get,aiplatform.ragCorpora.query,aiplatform.ragFiles.get,aiplatform.ragFiles.list"

            # Check if custom role exists
            if gcloud iam roles describe "$ROLE_ID" --project="$PROJECT_ID" &>/dev/null; then
              echo "✓ Custom RAG role already exists: $ROLE_ID"
              # Update permissions in case they changed
              gcloud iam roles update "$ROLE_ID" \
                --project="$PROJECT_ID" \
                --permissions="$PERMISSIONS" \
                --quiet 2>/dev/null || true
            else
              echo "Creating custom RAG role: $ROLE_ID"
              gcloud iam roles create "$ROLE_ID" \
                --project="$PROJECT_ID" \
                --title="$ROLE_TITLE" \
                --description="$ROLE_DESCRIPTION" \
                --permissions="$PERMISSIONS" \
                --quiet
              echo "✓ Custom RAG role created: $ROLE_ID"
            fi

            # Grant custom role to Reasoning Engine service account
            echo "Granting custom RAG role to Reasoning Engine service account..."
            if gcloud projects add-iam-policy-binding "$PROJECT_ID" \
              --member="serviceAccount:$REASONING_ENGINE_SA" \
              --role="projects/$PROJECT_ID/roles/$ROLE_ID" \
              --condition=None \
              --quiet 2>/dev/null; then
              echo "✓ Reasoning Engine service account granted RAG access permissions"
              echo "   Service Account: $REASONING_ENGINE_SA"
              echo "   Role: $ROLE_ID"
              echo "   Permissions: $PERMISSIONS"
            else
              echo "⚠️ Failed to grant Reasoning Engine RAG permissions"
              echo "   You may need to run: gcp/agents/homecare/deployment/grant_permissions.sh"
            fi

            # Grant Firestore permissions for checkpoint access
            echo ""
            echo "Granting Firestore permissions to Reasoning Engine service account..."
            if gcloud projects add-iam-policy-binding "$PROJECT_ID" \
              --member="serviceAccount:$REASONING_ENGINE_SA" \
              --role="roles/datastore.user" \
              --condition=None \
              --quiet 2>/dev/null; then
              echo "✓ Reasoning Engine service account granted Firestore access permissions"
              echo "   Service Account: $REASONING_ENGINE_SA"
              echo "   Role: roles/datastore.user"
              echo "   This enables checkpoint read access in Firestore"
            else
              echo "⚠️ Failed to grant Reasoning Engine Firestore permissions"
              echo "   You may need to run: gcp/agents/homecare/deployment/grant_permissions.sh"
            fi
          else
            echo "⚠️ Skipping RAG service account permissions (no corpora created)"
          fi

      - name: Create Observability Resources (Log Sinks)
        id: observability
        continue-on-error: true
        run: |
          PROJECT_ID="${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          REGION="${{ needs.resolve-inputs.outputs.region }}"
          ENV="${{ inputs.environment_name }}"

          echo "Creating observability resources for checkpoint analysis..."

          # Create Cloud Storage bucket for checkpoint logs (audit trail)
          LOGS_BUCKET="checkpoint-logs-${ENV}"
          echo "Checking Cloud Storage bucket: $LOGS_BUCKET"

          if gsutil ls -b gs://${LOGS_BUCKET}/ &>/dev/null; then
            echo "✓ Logs bucket already exists: $LOGS_BUCKET"
          else
            echo "Creating logs bucket..."
            gsutil mb -p $PROJECT_ID -l $REGION -b on gs://${LOGS_BUCKET}/
            # Set lifecycle policy (retain for 7 years for audit compliance)
            echo '{"lifecycle":{"rule":[{"action":{"type":"SetStorageClass","storageClass":"ARCHIVE"},"condition":{"age":3650}},{"action":{"type":"Delete"},"condition":{"age":2555}}]}}' > /tmp/logs-lifecycle.json
            gsutil lifecycle set /tmp/logs-lifecycle.json gs://${LOGS_BUCKET}/
            gsutil uniformbucketlevelaccess set on gs://${LOGS_BUCKET}/
            echo "✓ Logs bucket created: $LOGS_BUCKET"
          fi

          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
          LOGGING_SA="service-${PROJECT_NUMBER}@gcp-sa-logging.iam.gserviceaccount.com"

          # Grant Logging service account permission to write to Cloud Storage
          echo "Granting Logging service account Cloud Storage permissions..."
          gcloud projects add-iam-policy-binding $PROJECT_ID \
            --member="serviceAccount:${LOGGING_SA}" \
            --role="roles/storage.objectCreator" \
            --condition=None \
            --quiet 2>/dev/null || echo "⚠️ Failed to grant Storage permissions (may already be granted)"

          # Create log sink to Cloud Storage for checkpoint analysis logs (audit trail)
          SINK_NAME_STORAGE="checkpoint-analysis-sink-storage-${ENV}"
          echo "Checking log sink to Cloud Storage: $SINK_NAME_STORAGE"

          if gcloud logging sinks describe $SINK_NAME_STORAGE --project=$PROJECT_ID &>/dev/null; then
            echo "✓ Log sink to Cloud Storage already exists: $SINK_NAME_STORAGE"
          else
            echo "Creating log sink to Cloud Storage..."
            FUNCTION_NAME="pubsub-checkpoint-analysis-${ENV}"
            # Filter for checkpoint analysis function logs with structured event types
            LOG_FILTER='resource.type="cloud_function" AND resource.labels.function_name="'${FUNCTION_NAME}'" AND (jsonPayload.body.event_type=~"checkpoint\\.(analysis|comparison)\\..*" OR textPayload=~"checkpoint.*")'

            gcloud logging sinks create $SINK_NAME_STORAGE \
              "storage.googleapis.com/${LOGS_BUCKET}" \
              --project=$PROJECT_ID \
              --log-filter="$LOG_FILTER" \
              --description="Checkpoint analysis logs exported to Cloud Storage for audit trail"

            echo "✓ Log sink to Cloud Storage created: $SINK_NAME_STORAGE"
          fi

          # Output values
          echo "checkpoint_logs_storage_bucket=${LOGS_BUCKET}" >> $GITHUB_OUTPUT

          echo ""
          echo "✓ Observability resources created"
          echo "  - Cloud Storage bucket: $LOGS_BUCKET"
          echo "  - Log sink to Cloud Storage: $SINK_NAME_STORAGE"

  create-github-environment:
    name: Create GitHub Environment
    runs-on: ubuntu-latest
    needs: [resolve-inputs, create-infrastructure]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Environment and Variables
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ENV_ADMIN }}
        run: |
          # Create the environment
          gh api --method PUT repos/${{ github.repository }}/environments/${{ inputs.environment_name }}

          # Function to set or update variable with diff display
          set_or_update_var() {
            local var_name=$1
            local var_value=$2

            # Try to get existing variable (will fail if doesn't exist)
            existing_value=$(gh variable get "$var_name" --env ${{ inputs.environment_name }} 2>/dev/null || echo "")

            if [ -z "$existing_value" ]; then
              gh variable set "$var_name" --body "$var_value" --env ${{ inputs.environment_name }}
              echo "✅ Created $var_name = $var_value"
            elif [ "$existing_value" != "$var_value" ]; then
              echo "🔄 Updating $var_name:"
              echo "   Old: $existing_value"
              echo "   New: $var_value"
              gh variable set "$var_name" --body "$var_value" --env ${{ inputs.environment_name }}
              echo "   ✓ Updated"
            else
              echo "✓ $var_name (unchanged)"
            fi
          }

          set_var_if_not_exists() {
            local var_name=$1
            local var_value=$2

            # Try to get existing variable (will fail if doesn't exist)
            existing_value=$(gh variable get "$var_name" --env ${{ inputs.environment_name }} 2>/dev/null || echo "")

            if [ -z "$existing_value" ]; then
              gh variable set "$var_name" --body "$var_value" --env ${{ inputs.environment_name }}
              echo "✅ Created $var_name = $var_value"
            else
              echo "✓ $var_name already exists (value: $existing_value) - skipping"
            fi
          }

          # Set or update all variables
          echo "Configuring GitHub environment variables..."

          # Core GCP configuration
          set_or_update_var "GCP_PROJECT_ID" "${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          set_or_update_var "GCP_PROJECT_NUMBER" "${{ needs.create-infrastructure.outputs.gcp_project_number }}"
          set_or_update_var "GCP_REGION" "${{ needs.resolve-inputs.outputs.region }}"
          set_or_update_var "WORKLOAD_IDENTITY_PROVIDER" "${{ needs.create-infrastructure.outputs.workload_identity_provider }}"
          set_or_update_var "GCP_SERVICE_ACCOUNT_EMAIL" "${{ needs.create-infrastructure.outputs.service_account_email }}"

          # Storage and Pub/Sub
          set_or_update_var "GCS_BUCKET" "${{ needs.create-infrastructure.outputs.user_data_bucket }}"
          set_or_update_var "USER_UPLOAD_TOPIC" "${{ needs.create-infrastructure.outputs.user_upload_topic }}"
          set_or_update_var "USER_UPLOAD_RESULT_SUBSCRIPTION" "${{ needs.create-infrastructure.outputs.user_upload_result_subscription }}"
          set_or_update_var "USER_UPLOAD_RESULT_TOPIC" "${{ needs.create-infrastructure.outputs.user_upload_result_topic }}"
          set_or_update_var "CHECKPOINT_ANALYSIS_TOPIC" "${{ needs.create-infrastructure.outputs.checkpoint_analysis_topic }}"
          set_or_update_var "CHECKPOINT_METRICS_TOPIC" "${{ needs.create-infrastructure.outputs.checkpoint_metrics_topic }}"
          set_or_update_var "DOCUMENT_ANALYSIS_TOPIC" "${{ needs.create-infrastructure.outputs.document_analysis_topic }}"
          set_or_update_var "USER_UPLOAD_FOLDER" "uploads-${{ inputs.environment_name }}"

          # RAG and Agent configuration
          set_var_if_not_exists "REASONING_ENGINE_ID" "new"
          set_or_update_var "USER_UPLOAD_RAG_CORPUS" "${{ needs.create-infrastructure.outputs.user_upload_rag_corpus }}"
          set_or_update_var "KNOWLEDGE_BASE_RAG_CORPUS" "${{ needs.create-infrastructure.outputs.knowledge_base_rag_corpus }}"

          # Agent and app-specific variables (set to defaults, can be updated manually)
          set_or_update_var "AGENT_STAGING_BUCKET" "gs://homegeek-agent-${{ inputs.environment_name }}"
          set_or_update_var "EXPO_ACCOUNT" "homegeekai"
          set_or_update_var "WEBAPP_GCP_PROJECT_ID" "${{ needs.resolve-inputs.outputs.gcp_project_id }}"
          set_or_update_var "FIREBASE_SERVICE_ACCOUNT_EMAIL" "${{ needs.create-infrastructure.outputs.firebase_service_account_email }}"

          # Monthly token cap for proxy + checkpoint worker (UTC calendar month). Only set if missing.
          set_var_if_not_exists "TOKEN_QUOTA_PERIOD_MAX_TOKENS" "1000000"

          echo ""
          echo "✅ GitHub environment '${{ inputs.environment_name }}' configured"
          echo ""
          echo "ℹ️  The following secrets need to be configured manually:"
          echo "   - FIREBASE_WEBHOOK_SECRET"
          echo "   - PROXY_TOKEN"
          echo "   - SERP_API_KEY"
          echo "   - TELEGRAM_BOT_TOKEN"
          echo "   - TELEGRAM_WEBHOOK_SECRET"
          echo "   - YOUTUBE_API_KEY (YouTube Data API v3; create key in GCP Console after API is enabled)"

      - name: Create environment config file
        run: |
          mkdir -p environment-configs
          cat > environment-configs/${{ inputs.environment_name }}.md <<EOF
          # Environment: ${{ inputs.environment_name }}

          Created: $(date -u)

          ## GitHub Repository Variables

          All variables have been automatically configured. Current values:

          \`\`\`bash
          # Core GCP Configuration
          GCP_PROJECT_ID=${{ needs.resolve-inputs.outputs.gcp_project_id }}
          GCP_PROJECT_NUMBER=${{ needs.create-infrastructure.outputs.gcp_project_number }}
          GCP_REGION=${{ needs.resolve-inputs.outputs.region }}
          WORKLOAD_IDENTITY_PROVIDER=${{ needs.create-infrastructure.outputs.workload_identity_provider }}
          GCP_SERVICE_ACCOUNT_EMAIL=${{ needs.create-infrastructure.outputs.service_account_email }}

          # Storage and Pub/Sub
          GCS_BUCKET=${{ needs.create-infrastructure.outputs.user_data_bucket }}
          USER_UPLOAD_TOPIC=${{ needs.create-infrastructure.outputs.user_upload_topic }}
          USER_UPLOAD_RESULT_SUBSCRIPTION=${{ needs.create-infrastructure.outputs.user_upload_result_subscription }}
          USER_UPLOAD_RESULT_TOPIC=${{ needs.create-infrastructure.outputs.user_upload_result_topic }}
          CHECKPOINT_ANALYSIS_TOPIC=${{ needs.create-infrastructure.outputs.checkpoint_analysis_topic }}
          CHECKPOINT_METRICS_TOPIC=${{ needs.create-infrastructure.outputs.checkpoint_metrics_topic }}
          DOCUMENT_ANALYSIS_TOPIC=${{ needs.create-infrastructure.outputs.document_analysis_topic }}
          USER_UPLOAD_FOLDER=uploads-${{ inputs.environment_name }}

          # RAG and Agent Configuration
          REASONING_ENGINE_ID=new
          USER_UPLOAD_RAG_CORPUS=${{ needs.create-infrastructure.outputs.user_upload_rag_corpus }}
          KNOWLEDGE_BASE_RAG_CORPUS=${{ needs.create-infrastructure.outputs.knowledge_base_rag_corpus }}

          # Agent and App-specific Variables
          AGENT_STAGING_BUCKET=gs://homegeek-agent-${{ inputs.environment_name }}
          EXPO_ACCOUNT=homegeekai
          WEBAPP_GCP_PROJECT_ID=${{ needs.resolve-inputs.outputs.gcp_project_id }}
          FIREBASE_SERVICE_ACCOUNT_EMAIL=${{ needs.create-infrastructure.outputs.firebase_service_account_email }}

          # Token quota (if not set earlier, default 1M — see create-github-environment step)
          TOKEN_QUOTA_PERIOD_MAX_TOKENS=1000000
          \`\`\`

          ## GitHub Repository Secrets (Manual Configuration Required)

          The following secrets need to be configured manually in Settings → Environments → ${{ inputs.environment_name }} → Secrets:

          - \`FIREBASE_WEBHOOK_SECRET\`
          - \`PROXY_TOKEN\`
          - \`SERP_API_KEY\`
          - \`TELEGRAM_BOT_TOKEN\`
          - \`TELEGRAM_WEBHOOK_SECRET\`
          - \`YOUTUBE_API_KEY\` (YouTube Data API v3 — create an API key in APIs & Services → Credentials)

          ## Deploy Applications

          Now you can deploy applications using existing workflows:

          1. **Deploy Web Application (Firebase App Hosting)**
             - Go to Actions → Deploy Webapp - AppHosting
             - Select environment: \`${{ inputs.environment_name }}\`
             - App will be available at: \`${{ needs.create-infrastructure.outputs.apphosting_backend_url }}\`

          2. **Deploy Homecare Agent Proxy**
             - Go to Actions → Deploy Homecare Agent Proxy
             - Select environment: \`${{ inputs.environment_name }}\`
             - Cloud Run will be available at: \`https://homecare-agent-proxy-${{ inputs.environment_name }}-*.run.app\`

          3. **Deploy PubSub to User Docs Function**
             - Cloud Function: \`pubsub_to_user_docs-${{ inputs.environment_name }}\`

          ## Destroy

          To destroy this environment:
          1. Go to Actions → Destroy Environment
          2. Enter environment name: \`${{ inputs.environment_name }}\`
          3. Type "DESTROY" to confirm
          EOF

      - name: Upload configuration
        uses: actions/upload-artifact@v4
        with:
          name: environment-config-${{ inputs.environment_name }}
          path: environment-configs/${{ inputs.environment_name }}.md

  summary:
    name: Environment Summary
    runs-on: ubuntu-latest
    needs: [resolve-inputs, create-infrastructure, create-github-environment]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🎉 Environment Created: ${{ inputs.environment_name }}

          ## ⚙️ Infrastructure Status

          ✅ Infrastructure provisioned with gcloud
          ✅ IAM and Workload Identity ready
          ✅ Firebase enabled (Firestore + Storage)
          ✅ Firestore rules and indexes deployed
          ✅ Storage rules deployed
          ✅ Firebase App Hosting backend created
          ✅ GitHub environment created automatically
          ✅ All variables configured
          ✅ RAG corpora created (2 separate corpora)

          ## 📋 Ready to Deploy!

          Your environment is fully configured. You can now deploy applications:

          ### Environment Variables (Already Configured)

          | Variable | Value |
          |----------|-------|
          | \`GCP_PROJECT_ID\` | \`${{ needs.resolve-inputs.outputs.gcp_project_id }}\` |
          | \`GCP_PROJECT_NUMBER\` | \`${{ needs.create-infrastructure.outputs.gcp_project_number }}\` |
          | \`GCP_REGION\` | \`${{ needs.resolve-inputs.outputs.region }}\` |
          | \`WORKLOAD_IDENTITY_PROVIDER\` | \`${{ needs.create-infrastructure.outputs.workload_identity_provider }}\` |
