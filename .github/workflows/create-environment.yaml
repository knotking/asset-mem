          | \`USER_UPLOAD_FOLDER\` | \`uploads-${{ inputs.environment_name }}\` |
          | \`REASONING_ENGINE_ID\` | \`new\` |
          | \`USER_UPLOAD_RAG_CORPUS\` | \`${{ needs.create-infrastructure.outputs.user_upload_rag_corpus }}\` |
          | \`KNOWLEDGE_BASE_RAG_CORPUS\` | \`${{ needs.create-infrastructure.outputs.knowledge_base_rag_corpus }}\` |
          | \`AGENT_STAGING_BUCKET\` | \`gs://homegeek-agent-${{ inputs.environment_name }}\` |
          | \`EXPO_ACCOUNT\` | \`homegeekai\` |
          | \`WEBAPP_GCP_PROJECT_ID\` | \`${{ needs.resolve-inputs.outputs.gcp_project_id }}\` |
          | \`FIREBASE_SERVICE_ACCOUNT_EMAIL\` | \`${{ needs.create-infrastructure.outputs.firebase_service_account_email }}\` |

          ### Secrets (Manual Configuration Required)

          Configure these in Settings → Environments → \`${{ inputs.environment_name }}\` → Secrets:
          - \`FIREBASE_WEBHOOK_SECRET\`
          - \`PROXY_TOKEN\`
          - \`SERP_API_KEY\`
          - \`TELEGRAM_BOT_TOKEN\`
          - \`TELEGRAM_WEBHOOK_SECRET\`
          - \`YELP_API_KEY\`

          ### Deploy Applications Now!

          Go to Actions and run:

          1. **Deploy Homecare Agent Proxy**
             - Select environment: \`${{ inputs.environment_name }}\`
             - Deploy in ~2-3 minutes

          2. **Deploy PubSub to User Docs Function**
             - Select environment: \`${{ inputs.environment_name }}\`
             - Deploy in ~2-3 minutes

          ### Ongoing Deployments

          - Deploy as often as needed (multiple times per day!)
          - Infrastructure stays stable
          - No manual configuration required

          ## 🔗 Resources

          - **Service Account**: \`${{ needs.create-infrastructure.outputs.service_account_email }}\`
          - **Storage**: \`${{ needs.create-infrastructure.outputs.user_data_bucket }}\`
          - **Pub/Sub Topics**: \`${{ needs.create-infrastructure.outputs.user_upload_topic }}\`

          ## 📥 Download Configuration

          Download the environment configuration from workflow artifacts.
          EOF
