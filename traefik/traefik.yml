entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:  
        certResolver: letsencrypt

providers:
  docker:
    exposedByDefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: prakashbask@homegeek.ai # Replace with your email
      storage: /acme.json
      httpChallenge:
        entryPoint: web