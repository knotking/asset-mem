# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# For npm workspaces monorepo: specify where the Next.js app is located
# The root package.json and package-lock.json are at the repository root
rootDirectory: apps/webapp

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

build:
  command: "cd apps/webapp && npm run build"
